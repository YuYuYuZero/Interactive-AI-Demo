<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掌中皮影</title>
<meta name="theme-color" content="#160805">
<meta name="description" content="你的手，就是戏台。伸出手比个手影，幕布上就走出一个皮影角色；两个角色一靠近，就即兴对上一段戏。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#140805; --wood:#2a130a; --wood2:#3d1d0e; --lac:#4a110b; --lac2:#2c0906;
  --gold:#d6a756; --gold2:#f2d08c; --goldd:#8f6528;
  --ink:#2a0d05; --inkr:#6a1408; --cloth:#f4c06e;
  --fh:"Ma Shan Zheng","Zhi Mang Xing","STKaiti","KaiTi","Kaiti SC",serif;
  --fx:"Zhi Mang Xing","Ma Shan Zheng","STKaiti","KaiTi",serif;
  --fs:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --fu:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg)}
body{font-family:var(--fu);color:#f3dcb0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  background:radial-gradient(120% 80% at 50% 30%,#2a0f07 0%,#140805 60%,#0b0403 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:var(--st)}

/* —— 戏台檐口 / 匾额 / 流苏 —— */
.eave{position:relative;height:84px;display:flex;align-items:flex-start;justify-content:center;z-index:3;
  background:linear-gradient(#1d0905,#341208 55%,#4a1a0b 56%,#2b0e06 100%);
  box-shadow:0 2px 0 #7d4a1c, 0 3px 0 #1a0704}
.eave::before{content:"";position:absolute;left:0;right:0;top:54px;height:10px;
  background:repeating-linear-gradient(90deg,#6e2a12 0 2px,transparent 2px 14px),linear-gradient(#5a2010,#3a1308);opacity:.9}
.valance{position:absolute;left:0;right:0;bottom:-15px;height:16px;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 50% 0,#8c1d12 0 11px,#d6a756 11px 12.5px,transparent 13px) 0 0/26px 16px repeat-x}
.plaque{position:relative;margin-top:6px;padding:5px 40px 7px;z-index:4;border-radius:3px;
  background:linear-gradient(#651a10,#3c0d08 70%,#2e0905);
  box-shadow:inset 0 0 0 3px #2c0906, inset 0 0 0 4px var(--gold), inset 0 0 0 7px #3c0d08, inset 0 0 0 8px var(--goldd), 0 8px 18px rgba(0,0,0,.65);
  font-family:var(--fh);font-size:34px;line-height:1.2;letter-spacing:.32em;text-indent:.32em;color:var(--gold2);
  text-shadow:0 1px 0 #1a0402,0 0 14px rgba(240,190,100,.35)}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;
  background:radial-gradient(circle,#f2d08c 0 2px,transparent 3px),radial-gradient(circle,transparent 4px,#d6a756 4.5px 6px,transparent 6.5px);}
.plaque::before{left:10px}.plaque::after{right:10px}
.tassel{position:absolute;top:40px;width:30px;height:118px;z-index:5;pointer-events:none;transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite}
.tassel.l{left:calc(50% - 250px)}.tassel.r{right:calc(50% - 250px);animation-delay:-2.4s}
.tassel.ll{left:22px}.tassel.rr{right:22px;animation-delay:-1.2s}
@keyframes sway{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}

/* —— 台面 —— */
.stage{display:flex;min-height:0;padding:16px 14px 0;gap:0;position:relative}
.pillar{width:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(90deg,#1c0604,#4c130b 35%,#5c180d 50%,#3a0e08 70%,#180503);
  box-shadow:inset 0 0 0 1px #6b2a14}
.pillar span{writing-mode:vertical-rl;font-family:var(--fh);font-size:25px;color:var(--gold);letter-spacing:.32em;
  padding:16px 7px;background:#240704;box-shadow:inset 0 0 0 1px var(--goldd),0 0 0 3px #240704,0 0 0 4px #5a2010;text-shadow:0 0 10px rgba(214,167,86,.3)}
.screen{position:relative;flex:1;min-width:0;overflow:hidden;background:#d68a3a;
  border:11px solid #3a1a0b;border-radius:2px;
  box-shadow:inset 0 0 0 2px #a7793a,0 0 0 1px #160704,0 14px 30px rgba(0,0,0,.6)}
.screen canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* —— 开场 —— */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px 12%;color:var(--ink);z-index:6;pointer-events:none;transition:opacity .5s ease}
.title > *{pointer-events:auto}
.title .kicker{font-family:var(--fs);font-size:14px;letter-spacing:.5em;text-indent:.5em;color:#6a1f0c;opacity:.9}
.title h1{margin:.08em 0 .02em;font-family:var(--fh);font-weight:400;font-size:clamp(60px,11vw,128px);line-height:1.05;color:#3a0c04;letter-spacing:.06em;
  text-shadow:0 0 1px rgba(58,12,4,.6),0 2px 22px rgba(255,236,190,.55);position:relative}
.seal{display:inline-block;vertical-align:top;margin-left:.2em;margin-top:.5em;font-family:var(--fx);font-size:18px;line-height:1.05;color:#fff2d8;background:#a8231a;padding:5px 4px;border-radius:3px;writing-mode:vertical-rl;letter-spacing:.05em;box-shadow:inset 0 0 0 2px #a8231a,inset 0 0 0 3px #f6d9b0;transform:rotate(4deg)}
.title .sub{margin:.1em 0 .2em;font-family:var(--fs);font-weight:700;font-size:clamp(19px,2.4vw,26px);letter-spacing:.22em;color:#4a1206}
.title .desc{margin:.3em 0 1.3em;font-family:var(--fs);font-size:15px;line-height:1.8;color:#5b2410;max-width:34em}
.btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{min-height:52px;padding:10px 24px;border-radius:6px;font-family:var(--fs);font-weight:700;font-size:18px;letter-spacing:.12em;color:var(--gold2);
  background:linear-gradient(#7a1d12,#4a0e08);box-shadow:inset 0 0 0 1px #2a0604,inset 0 0 0 2px #c08a44,0 4px 0 #2a0604,0 8px 18px rgba(60,10,0,.35);transition:transform .12s ease}
.btn small{font-size:13px;font-weight:400;letter-spacing:.05em;opacity:.85}
.btn.alt{color:#3a0c04;background:linear-gradient(#ffe3a6,#e9b45f);box-shadow:inset 0 0 0 1px #7a3d12,inset 0 0 0 2px #fff0c8,0 4px 0 #7a3d12,0 8px 18px rgba(60,10,0,.3)}
.btn:active{transform:translateY(2px)}
.link{margin-top:14px;min-height:44px;padding:8px 14px;font-family:var(--fs);font-size:15px;color:#6a1f0c;text-decoration:underline;text-underline-offset:5px;text-decoration-color:rgba(106,31,12,.4)}
.title .note{margin:6px 0 0;font-size:12px;color:#6b3418;opacity:.85}
body:not(.is-title) .title{opacity:0;visibility:hidden;pointer-events:none}
body:not(.is-title) .title > *{pointer-events:none}

/* —— 唱词牌 —— */
.lyric{position:absolute;z-index:5;pointer-events:none;color:var(--ink);opacity:0;transition:opacity .5s ease;
  right:14px;top:14px;bottom:14px;writing-mode:vertical-rl;display:flex;flex-direction:column;gap:14px;align-items:flex-start;
  padding:18px 12px;max-width:42%;
  background:linear-gradient(90deg,rgba(255,236,196,.6),rgba(252,222,164,.72));border-radius:3px;
  box-shadow:0 0 0 1px rgba(110,40,10,.28),inset 0 0 0 4px rgba(255,244,220,.4),inset 0 0 0 5px rgba(140,50,14,.25),0 6px 18px rgba(80,20,0,.25)}
.lyric.on{opacity:1}
.lyric .lh{display:flex;align-items:center;gap:10px;font-family:var(--fs)}
.lyric .no{white-space:nowrap;font-size:13px;color:#fff3dc;background:#9c2016;padding:6px 3px;border-radius:2px;letter-spacing:.1em}
.lyric .tt{font-family:var(--fh);font-size:26px;color:#5a0f06;letter-spacing:.08em}
.lyric .ai{font-size:11px;color:#8a4a24;letter-spacing:.2em;font-family:var(--fu)}
.lyric .ln{font-family:var(--fs);margin:0;display:flex;gap:6px;align-items:flex-start}
.lyric .who{font-size:13px;color:#9c2016;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.lyric .tx{font-size:25px;font-weight:600;letter-spacing:.14em;line-height:1.45}
.lyric .ln.bai .tx{font-size:18px;font-weight:400;letter-spacing:.06em;color:#4a1a0a}
.lyric .ch{opacity:0;transition:opacity .25s ease}
.lyric .ch.on{opacity:1}

/* —— 拜师 —— */
.lesson{position:absolute;z-index:6;left:14px;top:14px;width:272px;padding:14px 16px 12px;border-radius:4px;color:#f6e2b8;
  background:linear-gradient(#3e0f08f0,#280804f0);box-shadow:inset 0 0 0 1px #c08a44,inset 0 0 0 4px #2a0704,inset 0 0 0 5px #6a3014,0 10px 24px rgba(0,0,0,.45)}
.lesson[hidden]{display:none}
.lesson .ls-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.2em;color:var(--gold)}
.lesson .ls-body{display:flex;gap:12px;align-items:center;margin-top:8px}
.lesson canvas{width:92px;height:92px;flex:0 0 92px;border-radius:4px;background:radial-gradient(circle at 50% 40%,#ffe2a0,#e89a45 70%,#9a4a18)}
.lesson .ls-name{font-family:var(--fh);font-size:34px;line-height:1;color:var(--gold2)}
.lesson .ls-desc{font-family:var(--fs);font-size:13.5px;line-height:1.65;margin:4px 0 0;color:#f1d9ad}
.lesson .ls-task{font-size:13px;line-height:1.6;margin:10px 0 8px;color:#ffe9be;padding:6px 8px;background:rgba(0,0,0,.25);border-left:2px solid var(--gold)}
.lesson .lamps{display:flex;gap:7px}
.lamp{width:14px;height:18px;border-radius:7px 7px 5px 5px;background:#4a2414;box-shadow:inset 0 0 0 1px #7a4a24}
.lamp.on{background:radial-gradient(circle at 50% 60%,#fff2c0,#f2a640 60%,#b4501c);box-shadow:0 0 10px #f2a640}
.lesson .ls-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.sbtn{min-height:44px;min-width:56px;padding:6px 12px;border-radius:4px;font-size:14px;color:var(--gold2);background:rgba(255,220,150,.08);box-shadow:inset 0 0 0 1px rgba(214,167,86,.55)}
.lesson.done .ls-task{background:rgba(242,166,64,.25);color:#fff}

/* —— 开锣计时：一炷香 —— */
.perf{position:absolute;z-index:6;left:14px;top:14px;display:flex;align-items:flex-end;gap:10px;padding:10px 14px 10px 12px;border-radius:4px;
  background:rgba(40,10,4,.62);box-shadow:inset 0 0 0 1px rgba(214,167,86,.5);color:#ffe7bb}
.perf[hidden]{display:none}
.incense{position:relative;width:6px;height:74px;border-radius:3px;background:linear-gradient(#5a2a14,#2a1208)}
.incense i{position:absolute;left:0;right:0;bottom:0;border-radius:3px;background:linear-gradient(#b8663a,#7a3a1a);height:100%}
.incense b{position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:radial-gradient(circle,#fff3c0,#ff8a2a 55%,rgba(255,80,20,0) 72%);box-shadow:0 0 12px #ff8a2a}
.perf .pt{font-family:var(--fh);font-size:34px;line-height:1;color:var(--gold2)}
.perf .pl{font-size:12px;letter-spacing:.15em;color:#e6c48a;margin-top:4px}

/* —— 提示 —— */
.toast{position:absolute;z-index:8;left:50%;bottom:16px;transform:translate(-50%,10px);width:max-content;max-width:min(560px,92%);padding:10px 18px;border-radius:4px;
  font-size:14.5px;line-height:1.6;text-align:center;color:#ffecc4;background:rgba(36,10,4,.86);box-shadow:inset 0 0 0 1px rgba(214,167,86,.55),0 8px 20px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* —— 摄像头手影小窗 —— */
.handwin{position:absolute;z-index:6;right:14px;bottom:14px;width:132px;padding:6px;border-radius:4px;background:rgba(36,10,4,.72);box-shadow:inset 0 0 0 1px rgba(214,167,86,.5)}
.handwin[hidden]{display:none}
.handwin canvas{display:block;width:120px;height:90px;border-radius:2px;background:radial-gradient(circle at 50% 45%,#ffe1a0,#e2903f 70%,#8a3e14)}
.handwin span{display:block;margin-top:4px;font-size:12px;text-align:center;color:#ffe1b0;letter-spacing:.1em}

/* —— 台下：手影卡与工具 —— */
.tray{position:relative;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:12px 18px calc(12px + var(--sb));
  background:linear-gradient(#3a1a0b,#211007 30%,#160904);box-shadow:inset 0 2px 0 #7d4a1c,inset 0 3px 0 #1a0704}
body.is-title .tray{display:none}
.tools{display:flex;gap:10px;align-items:center}
.tools.tl{justify-content:flex-end}.tools.tr{justify-content:flex-start}
.tool{min-width:60px;min-height:48px;padding:6px 12px;border-radius:5px;font-family:var(--fs);font-weight:700;font-size:16px;letter-spacing:.12em;color:var(--gold2);
  background:linear-gradient(#5a160d,#360b07);box-shadow:inset 0 0 0 1px #1a0402,inset 0 0 0 2px rgba(214,167,86,.6),0 3px 0 #0e0302}
.tool.hot{color:#3a0c04;background:linear-gradient(#ffd98e,#e3a24a);box-shadow:inset 0 0 0 1px #7a3d12,0 3px 0 #4a2008,0 0 16px rgba(242,166,64,.5)}
.tool[aria-pressed="true"]{color:#3a0c04;background:linear-gradient(#ffe3a6,#e9b45f)}
.cards{display:flex;gap:10px;justify-content:center}
.card{position:relative;width:86px;height:106px;border-radius:6px;padding:0;overflow:hidden;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#ffe6ad,#f0aa55 58%,#a3501c 100%);
  box-shadow:inset 0 0 0 1px #3a1406,inset 0 0 0 3px rgba(255,240,200,.35),0 4px 0 #0e0302,0 0 18px rgba(242,166,64,.25);transition:filter .4s ease,transform .15s ease,box-shadow .3s ease}
.card canvas{position:absolute;left:8%;top:4px;width:84%;height:64px;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:6px;font-family:var(--fs);font-weight:900;font-size:17px;color:#3a0c04;letter-spacing:.08em;line-height:1}
.card .gs{position:absolute;left:0;right:0;bottom:26px;font-size:10.5px;color:#6a2a0c;letter-spacing:.06em}
.card.dim{filter:saturate(.35) brightness(.5);box-shadow:inset 0 0 0 1px #3a1406,0 4px 0 #0e0302}
.card.dim::after{content:"未点亮";position:absolute;top:5px;right:5px;font-size:10px;padding:1px 4px;border-radius:2px;color:#ffe9c0;background:rgba(40,10,4,.8)}
.card.lit-anim{animation:lit 1.2s ease}
@keyframes lit{0%{filter:brightness(2.2) saturate(1.4);transform:scale(1.08)}100%{filter:none;transform:none}}
.card:active{transform:translateY(2px)}

/* —— 静音 —— */
.mute{position:fixed;z-index:20;top:calc(10px + var(--st));right:10px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(30,8,4,.75);box-shadow:inset 0 0 0 1px rgba(214,167,86,.6)}
.mute svg{width:24px;height:24px}
.mute .x{display:none}.mute.off .x{display:block}.mute.off .w{display:none}

/* —— 戏单 / 戏箱 —— */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,3,1,.72)}
.modal[hidden]{display:none}
.sheet{position:relative;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;border-radius:3px;padding:26px 28px 22px;color:#2a0b04;
  background:radial-gradient(120% 90% at 30% 20%,#d8452f,#b62a1c 55%,#8e1c13);
  box-shadow:inset 0 0 0 6px #a52519,inset 0 0 0 7px #f0c070,inset 0 0 0 10px #a52519,inset 0 0 0 11px rgba(240,192,112,.6),0 20px 50px rgba(0,0,0,.6)}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(8deg,rgba(0,0,0,.1) 0 1px,transparent 1px 4px),repeating-linear-gradient(97deg,rgba(255,255,255,.06) 0 1px,transparent 1px 6px)}
.sheet h2{margin:0;text-align:center;font-family:var(--fs);font-size:14px;letter-spacing:.8em;text-indent:.8em;color:#ffe1a8;font-weight:700}
.sheet .bt{margin:6px 0 4px;text-align:center;font-family:var(--fx);font-weight:400;font-size:clamp(38px,9vw,56px);line-height:1.15;color:#1e0702;text-shadow:0 1px 0 rgba(255,200,150,.3)}
.sheet .meta{text-align:center;font-size:13px;color:#ffdcae;letter-spacing:.08em}
.sheet .sec{margin-top:16px;font-family:var(--fs)}
.sheet .sec b{display:block;font-size:13px;letter-spacing:.3em;color:#ffe1a8;margin-bottom:6px}
.sheet .cast{font-size:19px;font-weight:700;color:#1e0702;letter-spacing:.1em}
.sheet ol{list-style:none;margin:0;padding:0}
.sheet li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 0;border-top:1px dashed rgba(255,220,170,.35)}
.sheet li .n{font-size:13px;color:#ffe1a8;padding-top:3px}
.sheet li .t{font-size:17px;font-weight:700;color:#1e0702}
.sheet li .q{grid-column:2;font-size:13.5px;color:#ffe9cc}
.sheet .empty{font-size:14px;color:#ffe9cc;line-height:1.7}
.sheet .note{margin-top:16px;padding:10px 12px;font-family:var(--fs);font-size:14px;line-height:1.7;color:#2a0b04;background:rgba(255,226,170,.85);border-radius:2px}
.sheet .stamp{position:absolute;right:22px;top:22px;font-family:var(--fx);font-size:16px;line-height:1.05;color:#ffe9cc;border:2px solid rgba(255,233,204,.8);padding:4px 3px;writing-mode:vertical-rl;transform:rotate(8deg);opacity:.85}
.sheet .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.sheet .row .btn{font-size:16px;min-height:48px}
.chest-list{list-style:none;margin:10px 0 0;padding:0}
.chest-list button{width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;margin-top:8px;border-radius:3px;text-align:left;
  background:rgba(40,8,4,.35);box-shadow:inset 0 0 0 1px rgba(255,220,170,.4);color:#ffe9cc}
.chest-list .ct{font-family:var(--fx);font-size:24px;color:#fff3dc}
.chest-list .cd{font-size:12px;color:#ffd6a0;white-space:nowrap}
#vid{position:fixed;left:-10px;top:-10px;width:2px;height:2px;opacity:0;pointer-events:none}

/* —— 宽屏：楹联 —— */
@media (max-width:899px), (orientation:portrait){
  .pillar{display:none}
  .tassel.ll,.tassel.rr{display:none}
}
/* —— 窄屏 / 竖屏 —— */
@media (max-width:720px), (orientation:portrait) and (max-width:900px){
  .eave{height:62px}
  .eave::before{top:40px;height:8px}
  .plaque{font-size:25px;padding:4px 30px 6px;margin-top:5px}
  .tassel{top:30px;height:90px;width:24px}
  .tassel.l{left:12px}.tassel.r{right:58px}
  .stage{padding:12px 8px 0}
  .screen{border-width:8px}
  .tray{grid-template-columns:1fr 1fr;grid-template-areas:"cards cards" "tl tr";gap:8px 8px;padding:8px 8px calc(8px + var(--sb))}
  .cards{grid-area:cards;gap:6px}
  .tools.tl{grid-area:tl;justify-content:flex-start}.tools.tr{grid-area:tr;justify-content:flex-end}
  .tools{gap:6px}
  .tool{min-width:52px;font-size:15px;padding:6px 8px;letter-spacing:.06em}
  .card{width:calc((100vw - 16px - 24px) / 5);max-width:86px;height:92px}
  .card canvas{height:auto;aspect-ratio:172/148;top:6px}
  .card .gs{display:none}
  .card .nm{font-size:16px;bottom:7px}
  .lyric{writing-mode:horizontal-tb;left:10px;right:10px;top:10px;bottom:auto;max-width:none;flex-direction:column;gap:4px;padding:10px 12px}
  .lyric .lh{gap:8px}.lyric .no{padding:2px 6px}

  'tu|ying':    { a: 'tu',    v: '巧斗' },
  'tu|quan':    { a: 'tu',    v: '戏逗' },
  'tu|long':    { a: 'tu',    v: '夜会' },
  'tu|sheng':   { a: 'tu',    v: '伴读' },

  'ying|long':  { a: 'ying',  v: '云会' },
  'ying|sheng': { a: 'ying',  v: '指路' },
  'quan|long':  { a: 'quan',  v: '巧遇' },
  'quan|sheng': { a: 'quan',  v: '护送' },
  'long|sheng': { a: 'sheng', v: '夜访' },

const SAME = { tu: '双兔闹月', ying: '双鹰争天', quan: '二犬守门', long: '二龙戏珠', sheng: '同窗夜读' };

function mulberry32(seed) {
  let a = seed >>> 0;

    a = (a + 0x6D2B79F5) >>> 0;

function pick(arr, rng) { return arr[Math.min(arr.length - 1, Math.floor(rng() * arr.length))]; }

function pairTitle(A, B, nA, nB) {

}
function relTitle(rel, A, B, nA, nB) {
  if (rel === 'chase') return nA + '急追' + nB;

function compose(ctx, rng) {
  rng = rng || Math.random;
  const A = ctx.A, B = ctx.B, rel = ctx.rel;
  if (!CHARS[A] || !CHARS[B] || !REL_MOOD[rel]) throw new Error('compose: bad ctx');
  const dn = defaultNames(A, B);
  const nA = ctx.nA || dn[0], nB = ctx.nB || dn[1];

  if (rng() < 0.62) {
    const pool = MOOD[B][moods[1]].map(function (s) { return fillT(s, { o: CHARS[A].one }); }).filter(function (s) { return s !== l1; });

  const b = pick(BAI[rel], rng);
  const sp = b.who === 'A' ? A : B;
  const bai = fillT(b.t, { A: nA, B: nB, call: CHARS[sp].call });
  return {
    A: A, B: B, rel: rel, nA: nA, nB: nB, relName: REL_NAME[rel],
    title: relTitle(rel, A, B, nA, nB),
    lines: [
      { who: nA + '（唱）', kind: '唱', text: l1 },
      { who: who2, kind: '唱', text: l2 },

/* ---------- 手势：21 个关键点 → 五种手影 ---------- */
function _d(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

}

/* 时间平滑防抖：窗口内多数票 ≥ need，且候选持续 hold 毫秒才切换 */
function GestureSmoother(win, need, hold) {

    else if (t - this.candT >= this.hold) { this.value = best; this.cand = null; }

  },
  tick: function (now) {
    if (this.state !== 'on' || !this.lm || vid.readyState < 2) return;
    if (vid.currentTime === this.lastVT || now - this.lastT < 30) return;
    this.lastVT = vid.currentTime; this.lastT = now;
    let res;
    try { res = this.lm.detectForVideo(vid, now); } catch (e) { this.fail(e); return; }
    const lms = (res && res.landmarks) || [], hd = (res && (res.handedness || res.handednesses)) || [];
    const seen = new Set();
    for (let i = 0; i < lms.length; i++) {
      const key = (hd[i] && hd[i][0] && hd[i][0].categoryName) || ('h' + i);
      if (seen.has(key)) continue; seen.add(key);
      let s = this.slots.get(key);
      if (!s) { s = { sm: new GestureSmoother(450, 0.6, 260), pup: null, last: 0, lm: null, g: null }; this.slots.set(key, s); }
      s.lm = lms[i]; s.last = now;
      s.g = classifyGesture(lms[i]).g;
      const val = s.sm.push(s.g, now);
      const pose = handPose(lms[i], true);
      const X = clamp((pose.x - 0.5) * 1.35 + 0.5, 0.03, 0.97) * view.W, Y = clamp((pose.y - 0.5) * 1.35 + 0.5, 0.05, 0.95) * view.H;
      s.sx = X; s.sy = Y;
      if (val && mode === 'stage') {
        if (learn(val)) toast('学会了「' + CHARS[val].label + '」，这张卡点亮了。');
        if (lesson && !lesson.doneAt && lesson.queue[lesson.i] === val) lessonSuccess(val);
        if (!s.pup || s.pup.dying || s.pup.type !== val) {
          const old = s.pup && !s.pup.dying ? s.pup : null;
          if (old) retire(old);
          s.pup = summon(val, old ? old.x : X, old ? old.y : Y, { direct: true, ctrl: key });
        }
      }
      if (s.pup && !s.pup.dying) {
        const p = s.pup, k = p.k(), c = p.rig.center;
        p.ctrl = key;
        p.tx = X - c[0] * k * p.facing; p.ty = Y - c[1] * k; clampRoot(p);
        let th = pose.roll, resid = th;
        if (Math.abs(th) > 0.87) { p.wantFacing = th > 0 ? 1 : -1; resid = th - (th > 0 ? 1 : -1) * Math.PI / 2; } else p.wantFacing = null;
        p.bowT = clamp(resid * p.facing, -0.6, 0.6);
      }
    }
    const self = this;
    this.slots.forEach(function (s, key) {
      if (now - s.last > 1200) { if (s.pup) { s.pup.ctrl = null; s.pup.wantFacing = null; s.pup.bowT = 0; } self.slots.delete(key); }
    });
    this.drawWin(now);
  },
  drawWin: function (now) {
    const c = hwCtx, W = hwCv.width, H = hwCv.height;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
    let label = '等手入光';
    this.slots.forEach(function (s) {
      if (now - s.last > 300) return;
      const m = s.lm.map(function (p) { return { x: 1 - p.x, y: p.y * H / W }; });
      drawHandShadow(c, m, { x: 0, y: 0 }, { fit: false, s: W, color: 'rgba(30,10,4,0.9)', blur: 6 });
      const v = s.sm.value;
      label = v ? CHARS[v].label + ' · ' + CHARS[v].short : (s.g ? '认出了，稳住……' : '换个手势试试');
    });
    $('hwTx').textContent = label;
  },
};
bCam.addEventListener('click', function () { AU.init(); if (Cam.state === 'off') Cam.start(); else if (Cam.state === 'on') Cam.stop(); else { Cam.state = 'off'; Cam.stop(true); toast('已取消，继续用指尖演。'); } });

/* ============================================================ 入场 */
function enterStage(how) {
  AU.init();
  if (mode === 'stage') return;
  mode = 'stage';
  document.body.classList.remove('is-title');
  resize();
  if (titleRabbit && !titleRabbit.dying) { titleRabbit.tx = Math.max(titleRabbit.tx, view.W * 0.2); titleRabbit.ty = homeY('tu'); clampRoot(titleRabbit); }
  if (how === 'learn') startLesson(ORDER, true);
  else if (how === 'cam') Cam.start();
  else toast(learned.size ? '点下方手影卡请角色上台，按住拖动。两个角色一靠近，就会对上戏。' : '点一张手影卡，先把它点亮；两个角色一靠近，就会对上戏。', 5200);
}
$('goTouch').addEventListener('click', function () { enterStage('touch'); });
$('goCam').addEventListener('click', function () { enterStage('cam'); });
$('goLearn').addEventListener('click', function () { enterStage('learn'); });
$('bLesson').addEventListener('click', function () { AU.init(); if (lesson && lesson.seq) closeLesson(); else startLesson(ORDER, true); });
bPerf.addEventListener('click', startPerf);
$('bChest').addEventListener('click', function () { AU.init(); showChest(); });
$('bClear').addEventListener('click', function () { AU.init(); alive().forEach(retire); AU.seq([['才', .5], ['令', 1]]); });
const muteBtn = $('mute');
function syncMute() { muteBtn.classList.toggle('off', AU.muted); muteBtn.setAttribute('aria-pressed', AU.muted ? 'true' : 'false'); muteBtn.setAttribute('aria-label', AU.muted ? '打开声音' : '静音'); }
muteBtn.addEventListener('click', function () { AU.init(); AU.setMuted(!AU.muted); syncMute(); });
syncMute();
window.addEventListener('pointerdown', function () { AU.init(); }, { once: true });
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (!modal.hidden) closeModal(); else if (lesson) closeLesson(); return; }
  if (mode === 'stage' && modal.hidden && /^[1-5]$/.test(e.key)) tapCard(ORDER[+e.key - 1]);
});

/* ============================================================ 绘制 */
function drawBursts(c, now) {
  const d = view.dpr;
  c.setTransform(d, 0, 0, d, 0, 0);
  c.globalCompositeOperation = 'lighter';
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], p = (now - b.t0) / b.dur;
    if (p >= 1) { bursts.splice(i, 1); continue; }
    const r = (40 + 120 * p) * view.k * (b.big ? 1.5 : 1), a = (1 - p) * (b.big ? 0.5 : 0.32);
    const g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    g.addColorStop(0, 'rgba(255,230,170,' + a + ')'); g.addColorStop(1, 'rgba(255,160,60,0)');
    c.fillStyle = g; c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,220,150,' + (a * 0.9) + ')'; c.lineWidth = 2 * view.k;
    for (let k = 0; k < 10; k++) { const an = k / 10 * TAU + p; c.beginPath(); c.moveTo(b.x + Math.cos(an) * r * 0.35, b.y + Math.sin(an) * r * 0.35); c.lineTo(b.x + Math.cos(an) * r * 0.75, b.y + Math.sin(an) * r * 0.75); c.stroke(); }
  }
}
function drawTarget(c, now, glow) {
  if (!lesson || !lesson.target || lesson.doneAt) return;
  const d = view.dpr, T = lesson.target, k = view.k, t = (now - t0) / 1000;
  const r = Math.max(34, 52 * k) * (1 + (RM ? 0 : Math.sin(t * 3) * 0.06));
  c.setTransform(d, 0, 0, d, 0, 0);
  if (!glow) {
    c.globalCompositeOperation = 'multiply';
    c.strokeStyle = 'rgba(110,30,8,0.55)'; c.lineWidth = 2; c.setLineDash([6, 7]); c.lineDashOffset = -t * 20;
    c.beginPath(); c.arc(T.x, T.y, r, 0, TAU); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(150,40,10,0.5)';
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + t * 0.4; const x = T.x + Math.cos(a) * r * 0.6, y = T.y + Math.sin(a) * r * 0.6; c.beginPath(); c.ellipse(x, y, r * 0.2, r * 0.07, a, 0, TAU); c.fill(); }
  } else {
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(T.x, T.y, 0, T.x, T.y, r * 1.3);
    g.addColorStop(0, 'rgba(255,236,180,0.5)'); g.addColorStop(0.5, 'rgba(255,190,90,0.18)'); g.addColorStop(1, 'rgba(255,150,50,0)');
    c.fillStyle = g; c.beginPath(); c.arc(T.x, T.y, r * 1.3, 0, TAU); c.fill();
  }
}
function drawRods(c, list) {
  const d = view.dpr, H = view.H;
  c.setTransform(d, 0, 0, d, 0, 0);
  c.globalCompositeOperation = 'multiply'; c.lineCap = 'round';
  for (const p of list) {
    c.globalAlpha = p.alpha;
    for (const r of p.rodPts) {
      const ex = r[0] - p.facing * H * (r[2] ? 0.1 : 0.2) + (r[2] ? 0 : p.facing * H * 0.04), ey = H + 40;
      const g = c.createLinearGradient(r[0], r[1], ex, ey);
      g.addColorStop(0, 'rgba(46,20,6,0.62)'); g.addColorStop(1, 'rgba(70,32,10,0.12)');
      c.strokeStyle = g; c.lineWidth = (r[2] ? 4.2 : 2.4) * Math.max(0.7, view.k);
      c.beginPath(); c.moveTo(r[0], r[1]); c.lineTo(ex, ey); c.stroke();
      c.fillStyle = 'rgba(30,12,4,0.8)'; c.beginPath(); c.arc(r[0], r[1], 2.6 * Math.max(0.7, view.k), 0, TAU); c.fill();
    }
  }
  c.globalAlpha = 1;
}
function drawRivets(c, list) {
  const d = view.dpr;
  c.setTransform(d, 0, 0, d, 0, 0);
  for (const p of list) {
    const k = p.k();
    c.globalAlpha = p.alpha;
    for (const r of p.rivets) {
      c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgba(26,10,4,0.95)'; c.beginPath(); c.arc(r[0], r[1], 2.7 * k, 0, TAU); c.fill();
      c.globalCompositeOperation = 'source-over'; c.fillStyle = 'rgba(255,214,150,0.45)'; c.beginPath(); c.arc(r[0] - 0.6 * k, r[1] - 0.6 * k, 1 * k, 0, TAU); c.fill();
    }
  }
  c.globalAlpha = 1;
}
function drawHands(c, now) {
  if (Cam.state !== 'on') return;
  const d = view.dpr;
  c.setTransform(d, 0, 0, d, 0, 0);
  c.globalCompositeOperation = 'multiply'; c.globalAlpha = 0.16;
  Cam.slots.forEach(function (s) {
    if (now - s.last > 300) return;
    const m = s.lm.map(function (p) { return { x: clamp((1 - p.x - 0.5) * 1.35 + 0.5, -0.2, 1.2), y: clamp((p.y - 0.5) * 1.35 + 0.5, -0.2, 1.2) * view.H / view.W }; });
    drawHandShadow(c, m, { x: 0, y: 0 }, { fit: false, s: view.W, color: 'rgba(40,14,4,1)', blur: 24 });
  });
  c.globalAlpha = 1;
}
function render(now) {
  const c = ctx, d = view.dpr, W = view.W, H = view.H;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  if (bgCv) c.drawImage(bgCv, 0, 0); else { c.fillStyle = '#f0b866'; c.fillRect(0, 0, cv.width, cv.height); }
  drawHands(c, now);
  drawTarget(c, now, false);
  const list = puppets.slice().sort(function (a, b) { return a.born - b.born; });
  list.forEach(function (p) { p.pose(); });
  drawRods(c, list);
  c.globalCompositeOperation = 'multiply';
  for (const p of list) { c.globalAlpha = p.alpha; p.draw(c); }
  c.globalAlpha = 1;
  drawRivets(c, list);
  // 灯光
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'multiply';
  if (lightCv) c.drawImage(lightCv, 0, 0);
  const t = (now - t0) / 1000;
  const fl = RM ? 0 : (Math.sin(t * 7.1) * 0.5 + Math.sin(t * 12.7 + 1.3) * 0.3 + Math.sin(t * 2.9 + 0.4) * 0.6) / 1.4;
  const up = Math.min(1, (now - t0) / 1500), L = 0.42 + 0.58 * (1 - Math.pow(1 - up, 3));
  const B = (0.965 + 0.03 * fl) * L;
  c.fillStyle = 'rgb(' + Math.round(255 * B) + ',' + Math.round(255 * B * (0.9 + 0.1 * L)) + ',' + Math.round(255 * B * (0.78 + 0.22 * L)) + ')';
  c.fillRect(0, 0, cv.width, cv.height);
  // 灯芯的暖晕
  c.setTransform(d, 0, 0, d, 0, 0);
  c.globalCompositeOperation = 'lighter';
  const bg = c.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.5);
  bg.addColorStop(0, 'rgba(255,200,120,' + (0.11 * B).toFixed(3) + ')'); bg.addColorStop(1, 'rgba(255,160,60,0)');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  drawTarget(c, now, true);
  drawBursts(c, now);
  c.globalCompositeOperation = 'source-over';
}

/* ============================================================ 开场的兔子 */
function titleScript(now) {
  if (!titleRabbit) {
    titleRabbit = new Puppet('tu', -140 * view.k, homeY('tu'), '兔儿');
    titleRabbit.born = now - 500; titleRabbit.facing = titleRabbit.fa = 1;
    puppets.push(titleRabbit);
  }
  const p = titleRabbit, t = (now - t0) / 1000;
  const gx = view.W * (view.W < view.H ? 0.3 : 0.18);
  const enter = RM ? 1 : clamp((t - 0.4) / 2.6, 0, 1);
  p.tx = -140 * view.k + (gx + 140 * view.k) * enter; p.ty = homeY('tu');
  if (enter >= 1) {
    const cyc = (t - 3) % 6;
    if (cyc > 3.2 && cyc < 4.6) p.tx = gx + 70 * view.k;
    if (!p.act && cyc > 5.6 && cyc < 5.7) p.act = { kind: 'nod', t0: now, dur: 700 };
  }
}

/* ============================================================ 主循环 */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  if (mode === 'title') titleScript(now);
  Cam.tick(now);
  for (let i = puppets.length - 1; i >= 0; i--) {
    const p = puppets[i]; p.update(dt, now);
    if (p.dying && now - p.dying > 460) { puppets.splice(i, 1); if (p === titleRabbit) titleRabbit = null; }
  }
  if (mode === 'stage') {
    checkDuets(now); lessonTick(now);
    if (perf) { updatePerfHud(now); if (now - perf.t0 >= perf.dur) endPerf(); }
  }
  updateLyric(now);
  render(now);
  requestAnimationFrame(frame);
}
if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(screenEl);
window.addEventListener('resize', resize);
resize();
render(performance.now());
requestAnimationFrame(frame);

/* 调试钩子：仅当地址带 #debug 时暴露（供截图自检） */
if (location.hash.indexOf('debug') >= 0) {
  window.__zzpy = { frame: frame, summon: summon, enterStage: enterStage, startPerf: startPerf, endPerf: endPerf, startLesson: startLesson, showChest: showChest, puppets: puppets, view: view, perf: function () { return perf; }, learn: learn, trigger: trigger, Cam: Cam, toast: toast };
}
})();
</script>
