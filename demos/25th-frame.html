<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第二十五帧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Limelight&family=Poiret+One&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0d0a07; --bg2:#17110b; --wood:#3b2717; --wood2:#2a1b10; --brass:#c19a5b; --brass2:#8a6a3a;
  --paper:#ece2cb; --paper2:#d9caa6; --ink:#2b2117; --ink2:#5a4632; --silver:#d8d6cf; --dim:#9a8a72;
  --red:#a8432f; --glow:rgba(255,196,120,.18);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --deco:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif;
  --hand:"Ma Shan Zheng","Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --latin:"Limelight","Poiret One","Didot",serif;
  --cw: clamp(66px, 19vw, 112px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font-family:var(--serif);overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,190,110,.16), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(120,70,30,.25), transparent 70%);
  background-attachment:fixed}
button{font-family:var(--serif);color:inherit;cursor:pointer}
.hidden{display:none !important}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1240px;margin:0 auto;
  padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left))}
/* header */
.bar{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid rgba(193,154,91,.25)}
.brand{font-family:var(--deco);font-size:18px;letter-spacing:.12em;color:var(--brass);white-space:nowrap}
.brand small{font-family:var(--latin);font-size:10px;letter-spacing:.2em;margin-left:6px;opacity:.7}
.night{flex:1;text-align:center;font-family:var(--deco);color:var(--paper2);font-size:15px;letter-spacing:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:linear-gradient(#2a1d12,#1a120b);border:1px solid var(--brass2);border-radius:3px;padding:6px 10px;font-size:13px;color:var(--paper2);min-height:34px}
.tbtn:hover,.tbtn:focus-visible{border-color:var(--brass);color:var(--paper);outline:none}
/* layout */
.stage{flex:1;display:grid;grid-template-columns:1fr;gap:10px;padding:10px 0}
@media (min-width:960px){.stage{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.theatre{display:flex;flex-direction:column;gap:8px;min-width:0}
.brief{position:relative;background:linear-gradient(175deg,var(--paper),var(--paper2));color:var(--ink);
  padding:10px 14px 10px 44px;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 0 30px rgba(120,80,30,.25);
  transform:rotate(-.6deg)}
.brief::before{content:"";position:absolute;left:14px;top:-6px;width:18px;height:34px;border:3px solid #8f8f8f;border-bottom:none;border-radius:9px 9px 0 0;opacity:.8}
.brief .goal{font-family:var(--hand);font-size:clamp(20px,5.4vw,26px);line-height:1.25}
.brief .sub{font-family:var(--hand);font-size:clamp(14px,3.8vw,17px);color:var(--ink2);margin-top:2px}
.screenWrap{position:relative;width:100%;aspect-ratio:4/3.45;max-height:62vh;border-radius:4px;overflow:hidden;
  background:#050403;box-shadow:0 0 0 1px rgba(193,154,91,.35),0 0 0 5px #120d08,0 0 0 6px rgba(193,154,91,.25),0 18px 40px rgba(0,0,0,.6)}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block}
/* desk */
.desk{position:relative;border-radius:6px;padding:12px 10px 12px;min-width:0;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.0) 0 7px, rgba(0,0,0,.08) 7px 9px, rgba(255,220,170,.03) 9px 15px),
    radial-gradient(ellipse 70% 60% at 50% 0%, rgba(255,190,120,.22), transparent 70%),
    linear-gradient(180deg,var(--wood),var(--wood2));
  box-shadow:inset 0 1px 0 rgba(255,220,170,.15),inset 0 0 0 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.55);
  border:1px solid #1a1009}
.desk::before,.desk::after{content:"";position:absolute;top:8px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f3d79c,#8a6a3a 60%,#3d2c16)}
.desk::before{left:8px}.desk::after{right:8px}
.deskLabel{font-family:var(--deco);text-align:center;color:var(--brass);letter-spacing:.3em;font-size:13px;margin:0 0 8px}
.deskLabel span{font-family:var(--latin);letter-spacing:.2em;font-size:10px;opacity:.7;margin-left:6px}
.secLabel{font-size:12px;color:var(--dim);letter-spacing:.15em;margin:8px 2px 6px}
/* film strip timeline */
.strip{position:relative;background:#0b0907;border-radius:3px;padding:16px 8px;box-shadow:inset 0 0 12px #000, 0 3px 8px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;gap:0;overflow:hidden}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:7px;
  background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(236,226,203,.75) 7px 15px,transparent 15px 21px)}
.strip::before{top:4px}.strip::after{bottom:4px}
.slot{position:relative;width:var(--cw);flex:0 1 var(--cw);min-width:54px;aspect-ratio:4/3.9;border:1px dashed rgba(236,226,203,.28);border-radius:2px;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);transition:background .15s,border-color .15s}
.slot .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:22px;color:rgba(236,226,203,.18);pointer-events:none}
.slot.over{background:rgba(255,200,120,.15);border-color:var(--brass);border-style:solid}
.gap{position:relative;flex:0 0 14px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.gap.on{flex-basis:22px}
.gap.on::before{content:"";position:absolute;top:6%;bottom:6%;left:50%;border-left:1px dashed rgba(255,120,90,.55)}
.gap.on::after{content:"";position:absolute;inset:-10px -10px;}
.gap.over::before{border-left:2px solid #ff9070}
.gap .card{position:absolute;z-index:2;width:22px;min-width:0;padding:2px}
.gap .card .lbl,.gap .card .badge{display:none}
.gap .card canvas{aspect-ratio:1/2.4;object-fit:cover}
/* cards */
.card{position:relative;width:var(--cw);background:linear-gradient(#efe6d2,#d8cbac);border-radius:2px;padding:4px 4px 3px;color:var(--ink);
  box-shadow:0 3px 8px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.5)}
.card canvas{display:block;width:100%;aspect-ratio:4/3;background:#111;border-radius:1px;pointer-events:none}
.card .lbl{font-size:clamp(11px,2.9vw,13px);text-align:center;padding-top:3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.card .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff3e4;font-size:10px;padding:1px 5px;border-radius:8px;pointer-events:none;letter-spacing:.05em}
.slot .card{width:100%;box-shadow:none;background:#e4d9bf}
.card.used{opacity:.25;pointer-events:none}
.card.ghost{position:fixed;z-index:999;pointer-events:none;transform:rotate(-3deg) scale(1.06);box-shadow:0 16px 30px rgba(0,0,0,.6);transition:none;opacity:.95}
.card.lift{opacity:.35}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:10px;justify-items:center;padding:4px 2px;min-height:60px;border-radius:3px}
.pool.over{background:rgba(255,200,120,.08);outline:1px dashed var(--brass2)}
.flashpool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.flashpool .card{background:linear-gradient(#f0d6cc,#d6b3a4)}
.controls{display:flex;gap:10px;justify-content:center;margin-top:12px}
.btn{font-family:var(--deco);font-size:17px;letter-spacing:.3em;padding:10px 22px;min-height:46px;border-radius:3px;
  background:linear-gradient(#2c1e12,#1a110a);border:1px solid var(--brass2);color:var(--paper)}
.btn.primary{background:linear-gradient(#d1ab68,#8f6b36);color:#1d140b;border-color:#f1d49a;box-shadow:0 0 18px rgba(255,190,110,.25)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tip{min-height:1.4em;text-align:center;color:var(--dim);font-size:13px;margin:8px 4px 0;line-height:1.5}
.tip b{color:var(--brass);font-weight:400}
/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,4,3,.82);backdrop-filter:blur(2px)}
#title{background:#030202;z-index:80;flex-direction:column;padding:0}
#titleCanvas{position:absolute;inset:0;width:100%;height:100%}
#title .enter{position:absolute;left:50%;bottom:max(9vh,40px);transform:translateX(-50%);z-index:2}
#title .credit{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#6d6153;letter-spacing:.2em;z-index:2}
.letter{position:relative;width:min(520px,100%);max-height:88vh;overflow:auto;color:var(--ink);padding:28px 26px 22px;border-radius:2px;
  background:
    repeating-linear-gradient(180deg,transparent 0 33px,rgba(90,70,50,.18) 33px 34px),
    radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(140,95,40,.28),transparent 60%),
    linear-gradient(170deg,#efe5cd,#dccba4);
  box-shadow:0 30px 60px rgba(0,0,0,.7), inset 0 0 50px rgba(120,80,30,.3);transform:rotate(-.8deg);animation:drop .5s ease-out}
.letter::after{content:"";position:absolute;right:18px;top:16px;width:58px;height:58px;border:2px solid rgba(168,67,47,.6);border-radius:50%;
  background:radial-gradient(circle,transparent 55%,rgba(168,67,47,.08) 56%);transform:rotate(14deg)}
.letter .head{font-family:var(--deco);color:var(--ink2);letter-spacing:.3em;font-size:13px;margin-bottom:10px}
.letter .body{font-family:var(--hand);font-size:clamp(19px,4.8vw,23px);line-height:34px;white-space:pre-wrap}
.letter .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.letter .btn{color:var(--paper)}
@keyframes drop{from{opacity:0;transform:translateY(-20px) rotate(-3deg)}to{opacity:1;transform:rotate(-.8deg)}}
.drawer{width:min(560px,100%);max-height:86vh;overflow:auto;background:linear-gradient(#2d1e12,#1b120b);border:1px solid var(--brass2);border-radius:4px;padding:18px;
  box-shadow:0 30px 60px rgba(0,0,0,.7)}
.drawer h2{font-family:var(--deco);font-weight:400;color:var(--brass);letter-spacing:.3em;text-align:center;margin:0 0 4px;font-size:20px}
.drawer .en{font-family:var(--latin);text-align:center;font-size:10px;letter-spacing:.3em;color:var(--dim);margin-bottom:14px}
.drawer ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.drawer li{display:flex;gap:8px;align-items:center}
.drawer .slip{flex:1;text-align:left;background:linear-gradient(170deg,#e9dfc6,#cfbf98);color:var(--ink);border:none;border-radius:2px;padding:10px 12px;font-family:var(--hand);font-size:18px;min-height:44px}
.drawer .slip[disabled]{background:#2a2016;color:#6d5d48;font-family:var(--serif);font-size:13px}
.drawer .go{min-height:44px}
.drawer .foot{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* credits */
#credits{background:#000;z-index:90;padding:0;overflow:hidden;display:block}
#credits .roll{position:absolute;left:0;right:0;top:100%;text-align:center;padding:0 20px;animation:roll 70s linear forwards}
#credits .roll.static{position:relative;top:auto;animation:none;padding:40px 20px;height:100%;overflow:auto}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
#credits h1{font-family:var(--deco);font-weight:400;font-size:clamp(34px,9vw,56px);letter-spacing:.3em;color:#eee;margin:0}
#credits .en{font-family:var(--latin);letter-spacing:.4em;color:#999;font-size:12px;margin:6px 0 40px}
#credits h3{font-family:var(--latin);font-weight:400;letter-spacing:.35em;color:#8a8a8a;font-size:11px;margin:46px 0 4px}
#credits .role{font-family:var(--serif);color:#9a9a9a;font-size:13px;letter-spacing:.3em}
#credits .name{font-family:var(--deco);color:#f0f0f0;font-size:22px;letter-spacing:.2em;margin:4px 0 18px}
#credits .shot{font-family:var(--serif);color:#d0d0d0;font-size:15px;line-height:1.9;letter-spacing:.08em}
#credits .shot em{font-style:normal;color:#8c8c8c;font-size:12px;letter-spacing:.2em;display:block;margin-top:14px}
#credits .note{font-family:var(--hand);color:#e8e0cc;font-size:20px;line-height:1.8;max-width:520px;margin:30px auto}
#credits .deco{width:200px;height:20px;margin:30px auto;border-top:1px solid #777;border-bottom:1px solid #777;position:relative}
#credits .deco::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border:1px solid #aaa;transform:translate(-50%,-50%) rotate(45deg);background:#000}
#credits .end{font-family:var(--deco);font-size:40px;letter-spacing:.5em;color:#fff;margin:80px 0 20px}
#credits .ctl{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:3;display:flex;gap:8px}
@media (max-width:600px){
  .bar{flex-wrap:wrap;row-gap:2px}
  .brand{flex:1}
  .brand small{display:none}
  .night{order:3;flex:0 0 100%;font-size:13px;letter-spacing:.12em;text-align:left;padding-left:2px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition:none !important}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">第二十五帧<small>THE 25TH FRAME</small></div>
    <div class="night" id="nightLabel">第一夜</div>
    <button class="tbtn" id="btnDrawer" aria-label="打开抽屉，回看字条">抽屉</button>
    <button class="tbtn" id="btnMute" aria-pressed="false">声音 开</button>
  </header>
  <main class="stage">
    <section class="theatre">
      <div class="brief" id="brief"><div class="goal" id="goal"></div><div class="sub" id="goalSub"></div></div>
      <div class="screenWrap"><canvas id="screen" aria-label="放映窗"></canvas></div>
    </section>
    <section class="desk" aria-label="剪辑台">
      <div class="deskLabel" id="deskLabel">剪 辑 台<span>CUTTING ROOM</span></div>
      <div class="secLabel">时间线 · 把镜头拖进胶片带（可交换、可拖回）</div>
      <div class="strip" id="timeline"></div>
      <div id="flashWrap" class="hidden">
        <div class="secLabel">单帧 · 只闪一下的第二十五帧（拖到两格之间的红线上）</div>
        <div class="flashpool" id="flashPool"></div>
      </div>
      <div class="secLabel">镜头素材 · 沈先生留下的胶片</div>
      <div class="pool" id="pool"></div>
      <div class="controls">
        <button class="btn" id="btnClear">清空</button>
        <button class="btn primary" id="btnPlay">放 映</button>
      </div>
      <p class="tip" id="tip"></p>
    </section>
  </main>
</div>

<div class="overlay" id="title">
  <canvas id="titleCanvas"></canvas>
  <button class="btn primary enter" id="btnEnter">走进剪辑室</button>
  <div class="credit">上海 · 一九三九 · 天光影片公司 剪辑间</div>
</div>
<div class="overlay hidden" id="noteModal" role="dialog" aria-modal="true">
  <div class="letter"><div class="head" id="noteHead"></div><div class="body" id="noteBody"></div>
    <div class="actions" id="noteActions"></div></div>
</div>
<div class="overlay hidden" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer"><h2>抽 屉</h2><div class="en">LETTERS FROM MR. SHEN</div>
    <ul id="drawerList"></ul>
    <div class="foot"><button class="btn" id="btnCloseDrawer">合上</button><button class="btn" id="btnReset">清空进度</button></div></div>
</div>
<div class="overlay hidden" id="credits"><div class="ctl"><button class="tbtn" id="btnCreditsBack">回到剪辑台</button></div><div class="roll" id="roll"></div></div>
<script>
"use strict";
/* ============ 基础工具 ============ */
const TAU = Math.PI * 2;
const G = (v, a = 1) => `rgba(${v|0},${v|0},${v|0},${a})`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let s = seed >>> 0; return () => { s += 0x6D2B79F5; let r = Math.imul(s ^ s >>> 15, 1 | s); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
let REDUCED = false;
try { REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
/* 画布小工具：所有镜头在 320×240（学院比例 4:3）逻辑坐标中绘制 */
function E(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); c.fill(); }
function L(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); c.fill(); }
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(s[0], s[1])); return g; }
function hgrad(c, x0, x1, stops) { const g = c.createLinearGradient(x0, 0, x1, 0); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; }
function glow(c, x, y, r, a = .2, v = 255) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, G(v, a)); g.addColorStop(1, G(v, 0)); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }
/* 光束 + 光里的灰尘 */
function beam(c, pts, a, t, seed = 1, n = 26) {
  c.save();
  c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath();
  const g = c.createLinearGradient(pts[0], pts[1], (pts[4] + pts[6]) / 2, (pts[5] + pts[7]) / 2);
  g.addColorStop(0, G(255, a)); g.addColorStop(1, G(255, a * .15));
  c.fillStyle = g; c.fill(); c.clip();
  const R = rng(seed); const xs = Math.min(pts[0], pts[2], pts[4], pts[6]), xe = Math.max(pts[0], pts[2], pts[4], pts[6]);
  const ys = Math.min(pts[1], pts[3], pts[5], pts[7]), ye = Math.max(pts[1], pts[3], pts[5], pts[7]);
  for (let i = 0; i < n; i++) {
    const bx = R(), by = R(), sp = .3 + R(), ph = R() * TAU;
    const x = xs + ((bx * (xe - xs) + Math.sin(t * .4 * sp + ph) * 8 + t * 3 * sp) % (xe - xs + 1));
    const y = ys + ((by * (ye - ys) + t * 4 * sp) % (ye - ys + 1));
    c.fillStyle = G(255, .25 + .5 * Math.abs(Math.sin(t * sp + ph)));
    c.fillRect(x, y, 1.2, 1.2);
  }
  c.restore();
}
function grainWall(c, seed, v, a, n = 400) { const R = rng(seed); for (let i = 0; i < n; i++) { c.fillStyle = G(R() > .5 ? v + 30 : v - 30, a * R()); c.fillRect(R() * 320, R() * 240, 1 + R() * 2, 1 + R() * 2); } }

/* ============ 镜头绘制 ============ */
function eye(c, x, y, blink, light) {
  c.fillStyle = G(205 * light + 20); E(c, x, y, 8.5, 4.2);
  c.fillStyle = G(22); E(c, x + 1, y, 4.2, 4.2);

function thumb(id) {

    try { SHOTS[id].draw(c, THUMB_T[id] != null ? THUMB_T[id] : 1.2); const g = c.createRadialGradient(160, 120, 80, 160, 120, 220); g.addColorStop(0, G(0, 0)); g.addColorStop(1, G(0, .6)); c.fillStyle = g; c.fillRect(0, 0, 320, 240); } catch (e) {}
    thumbCache[id] = cv; }
  return thumbCache[id];
}
function makeCard(id, from, idx, isFlash) {
  const d = document.createElement('div'); d.className = 'card'; d.dataset.id = id; d.dataset.from = from; d.dataset.idx = idx; if (isFlash) d.dataset.flash = '1';
  d.tabIndex = 0; d.setAttribute('role', 'button'); d.setAttribute('aria-label', SHOTS[id].name + (isFlash ? '（单帧）' : ''));
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 192; cv.getContext('2d').drawImage(thumb(id), 0, 0);
  const lb = document.createElement('div'); lb.className = 'lbl'; lb.textContent = SHOTS[id].name;
  d.append(cv, lb); if (isFlash) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = '单帧'; d.append(b); }
  return d;
}
function render() {
  const L = lv();
  $('nightLabel').textContent = L.title + ' · ' + EN[cur].toLowerCase().replace(/\b\w/g, m => m.toUpperCase());
  $('goal').textContent = L.goal; $('goalSub').textContent = L.sub;
  $('deskLabel').innerHTML = `剪 辑 台 · 第${'一二三四五六七八'[cur]}盒<span>REEL ${cur + 1}</span>`;
  const T = $('timeline'); T.innerHTML = '';
  for (let i = 0; i < L.slots; i++) {
    const s = document.createElement('div'); s.className = 'slot'; s.dataset.slot = i; s.style.margin = L.flash ? '0' : '0 3px';
    s.innerHTML = `<span class="num">${i + 1}</span>`; if (tl[i]) s.append(makeCard(tl[i], 'slot', i, false)); T.append(s);
    if (L.flash && i < L.slots - 1) { const g = document.createElement('div'); g.className = 'gap on'; g.dataset.gap = i; g.title = '把单帧拖到这里';
      if (flash && flash.gap === i) g.append(makeCard(flash.id, 'gap', i, true)); T.append(g); }
  }
  const P = $('pool'); P.innerHTML = '';
  L.pool.forEach((id, i) => { const c = makeCard(id, 'pool', i, false); if (tl.includes(id)) c.classList.add('used'); P.append(c); });
  $('flashWrap').classList.toggle('hidden', !L.flash);
  const F = $('flashPool'); F.innerHTML = '';
  if (L.flash) L.flash.forEach((id, i) => { const c = makeCard(id, 'flashpool', i, true); if (flash && flash.id === id) c.classList.add('used'); F.append(c); });
  const pb = $('btnPlay'); pb.disabled = busy; pb.textContent = pendingLetter ? '读字条' : '放 映';
  pb.classList.toggle('primary', true); $('btnClear').disabled = busy;
}
function setTip(html) { $('tip').innerHTML = html; }
function levelCard() { thCard([lv().title, { text: EN[cur], small: true }, lv().goal], { size: 17 }); }
function goLevel(i) {
  cur = clamp(i, 0, LEVELS.length - 1); const L = lv();
  tl = new Array(L.slots).fill(null); flash = null; fails = 0; busy = false; pendingLetter = false;
  if (L.same && S.solved[L.same]) { const prev = S.solved[L.same].seq; if (prev && prev.length === L.slots) tl = prev.slice(); }
  S.cur = cur; save(); levelCard(); render();
  setTip(L.same && S.solved[L.same] ? '昨晚剪好的胶片还在时间线上。<b>不用换镜头，只换顺序。</b>' : cur === 0 ? '拖动或轻点镜头卡片放进时间线，然后按<b>放映</b>。轻按卡片可以在银幕上预览。' : L.flash ? '新机关：<b>单帧</b>。它只在银幕上闪一下，观众看不清，却会记得。' : '');
}

/* ---------- 拖拽（Pointer Events） ---------- */
let drag = null;
function targetAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('.slot,.gap.on,.pool,.flashpool,#flashWrap') : null; }
function clearOver() { document.querySelectorAll('.over').forEach(e => e.classList.remove('over')); }
document.addEventListener('pointerdown', e => {
  const card = e.target.closest && e.target.closest('.card'); if (!card || card.classList.contains('ghost') || busy || card.classList.contains('used')) return;
  if (!card.closest('#timeline,#pool,#flashPool')) return;
  e.preventDefault(); Snd.init();
  const r = card.getBoundingClientRect();
  drag = { card, id: card.dataset.id, from: card.dataset.from, idx: +card.dataset.idx, isFlash: card.dataset.flash === '1', x0: e.clientX, y0: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, w: r.width, started: false, ghost: null };
  thPreview(drag.id);
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) { if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    drag.started = true; const g = makeCard(drag.id, 'ghost', 0, drag.isFlash); g.classList.add('ghost'); g.style.width = Math.max(70, drag.w) + 'px'; document.body.append(g); drag.ghost = g; drag.card.classList.add('lift');
    if (drag.isFlash) drag.ox = Math.min(drag.ox, 35); }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px'; drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  clearOver(); const t = targetAt(e.clientX, e.clientY);
  if (t) { if (drag.isFlash ? t.matches('.gap.on') : t.matches('.slot')) t.classList.add('over'); else if (t.matches('.pool,.flashpool') && drag.from !== 'pool' && drag.from !== 'flashpool') t.classList.add('over'); }
}, { passive: false });
function endDrag(e, cancel) {
  if (!drag) return; const d = drag; drag = null; clearOver();
  if (d.ghost) d.ghost.remove(); d.card.classList.remove('lift');
  if (cancel) return;
  if (!d.started) { tapCard(d); return; }
  const t = targetAt(e.clientX, e.clientY); dropCard(d, t);
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));
function changed() { if (pendingLetter) return; if (TH.mode === 'result') { TH.mode = 'idle'; TH.react = null; levelCard(); } render(); }
function dropCard(d, t) {
  const L = lv();
  if (d.isFlash) {
    if (t && t.matches('.gap.on')) { flash = { gap: +t.dataset.gap, id: d.id }; setTip(`已在第 ${flash.gap + 1}、${flash.gap + 2} 格之间藏了一帧：<b>${SHOTS[d.id].name}</b>。`); }
    else if (d.from === 'gap') flash = null;
    else if (t && t.matches('.slot')) setTip('单帧要藏在<b>两格之间的红线</b>上，不能占一整格。');
    changed(); return;
  }
  if (t && t.matches('.slot')) { const j = +t.dataset.slot;
    if (d.from === 'slot') { const a = tl[d.idx]; tl[d.idx] = tl[j]; tl[j] = a; } else tl[j] = d.id; }
  else if (t && t.matches('.gap.on')) return;
  else if (d.from === 'slot') tl[d.idx] = null;
  changed();
}
function tapCard(d) {
  const L = lv();
  if (d.isFlash) { if (d.from === 'gap') flash = null; else { const g = flash ? flash.gap : Math.floor((L.slots - 2) / 2); flash = { gap: g, id: d.id }; setTip(`单帧<b>${SHOTS[d.id].name}</b>已藏进第 ${g + 1}、${g + 2} 格之间。拖动它可以换位置。`); } changed(); return; }
  if (d.from === 'slot') { tl[d.idx] = null; changed(); return; }
  const k = tl.indexOf(null); if (k < 0) { setTip('时间线接满了。把卡片<b>拖到某一格上</b>可以替换，轻点时间线上的卡片可以撤下。'); return; }
  tl[k] = d.id; changed();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAll(); return; }
  const card = e.target.closest && e.target.closest('.card'); if (card && (e.key === 'Enter' || e.key === ' ') && !busy && !card.classList.contains('used')) { e.preventDefault(); Snd.init(); thPreview(card.dataset.id); tapCard({ id: card.dataset.id, from: card.dataset.from, idx: +card.dataset.idx, isFlash: card.dataset.flash === '1' }); }
});

/* ---------- 放映与判定 ---------- */
function play() {
  if (busy) return; Snd.init();
  if (pendingLetter) { openLetter(cur, false); return; }
  const L = lv(); busy = true; render();
  const dur = REDUCED ? 1.6 : 1.85, items = [];
  for (let i = 0; i < L.slots; i++) { items.push({ id: tl[i] || null, dur }); if (flash && flash.gap === i) items.push({ id: flash.id, dur: .06, flash: true }); }
  const res = judge(L, tl, flash);
  setTip('放映中……嗒、嗒、嗒。');
  thPlay(items, () => showResult(res));
}
function showResult(res) {
  const L = lv();
  thCard([res.text, { text: res.ok ? 'THE AUDIENCE UNDERSTOOD' : 'A MISREADING', small: true }], { size: 14 });
  thReact(res.react);
  setTimeout(() => {
    busy = false;
    if (res.ok) {
      Snd.chime(); S.solved[L.id] = { seq: tl.slice(), flash: flash ? Object.assign({}, flash) : null, ending: res.ending || null };
      if (res.ending) { S.ending = res.ending; if (!S.endings.includes(res.ending)) S.endings.push(res.ending); }
      S.unlocked = Math.max(S.unlocked, Math.min(cur + 1, LEVELS.length - 1)); save();
      pendingLetter = true; setTip(cur === 7 ? `你剪出了<b>${res.ending === 'reunion' ? '重逢' : '离别'}</b>。抽屉里还压着最后一张字条。` : '观众读懂了。剪辑台上多了一张字条。');
    } else {
      Snd.fail(); fails++;
      if (!S.misreads.includes(res.text)) { S.misreads.push(res.text); save(); }
      setTip(`误读。<span style="opacity:.7">（已收集误读 ${S.misreads.length} 种）</span>` + (fails >= 2 ? `<br>沈先生在字条背面写着：<b>${L.hint}</b>` : ' 换个顺序，再剪一次。'));
    }
    render();
  }, 1100);
}

/* ---------- 字条、抽屉、片尾 ---------- */
let overlayOpen = null;
function show(id) { $(id).classList.remove('hidden'); overlayOpen = id; }
function hide(id) { $(id).classList.add('hidden'); if (overlayOpen === id) overlayOpen = null; }
function closeAll() { ['noteModal', 'drawer'].forEach(hide); }
function letterText(i) { if (i < 0) return PROLOGUE; if (i === 7) return (ENDINGS[S.ending] || ENDINGS.reunion).letter; return LEVELS[i].letter; }
function openLetter(i, fromDrawer, after) {
  $('noteHead').textContent = i < 0 ? '序 · 压在剪辑台上的字条' : (i === 7 ? (ENDINGS[S.ending] || ENDINGS.reunion).title : LEVELS[i].title + ' · 沈先生的字条');
  $('noteBody').textContent = letterText(i);
  const A = $('noteActions'); A.innerHTML = '';
  const btn = (txt, fn, primary) => { const b = document.createElement('button'); b.className = 'btn' + (primary ? ' primary' : ''); b.textContent = txt; b.onclick = fn; A.append(b); return b; };
  if (i >= 0 && !S.read.includes(i)) { S.read.push(i); save(); }
  if (fromDrawer) btn('收起', () => hide('noteModal'));
  else if (i < 0) btn('开始剪辑', () => { hide('noteModal'); if (after) after(); }, true);
  else if (i < 7) btn('下一夜', () => { hide('noteModal'); goLevel(i + 1); }, true);
  else { btn('留在剪辑台', () => { hide('noteModal'); pendingLetter = false; render(); }); btn('片尾字幕', () => { hide('noteModal'); pendingLetter = false; render(); showCredits(); }, true); }
  show('noteModal'); setTimeout(() => { const b = A.querySelector('.btn.primary') || A.querySelector('.btn'); if (b) b.focus(); }, 30);
}
function openDrawer() {
  const U = $('drawerList'); U.innerHTML = '';
  const li = (label, can, onRead, onGo) => { const l = document.createElement('li'); const a = document.createElement('button'); a.className = 'slip'; a.textContent = label; a.disabled = !can; a.onclick = onRead; l.append(a);
    if (onGo) { const g = document.createElement('button'); g.className = 'tbtn go'; g.textContent = '重剪'; g.onclick = onGo; l.append(g); } U.append(l); };
  li('序 · ' + PROLOGUE.split('\n')[1].slice(0, 14) + '…', true, () => openLetter(-1, true));
  LEVELS.forEach((L, i) => { const got = !!S.solved[L.id]; const txt = got ? L.title + ' · ' + letterText(i).split('\n').filter(x => x && x !== '小林：')[0].slice(0, 14) + '…' : L.title + ' · （字条还没来）';
    li(txt, got, () => openLetter(i, true), i <= S.unlocked ? () => { hide('drawer'); goLevel(i); } : null); });
  const foot = document.querySelector('#drawer .foot'); let cr = $('btnCredits');
  if (!cr) { cr = document.createElement('button'); cr.className = 'btn'; cr.id = 'btnCredits'; cr.textContent = '片尾字幕'; cr.onclick = () => { hide('drawer'); showCredits(); }; foot.insertBefore(cr, foot.firstChild); }
  cr.classList.toggle('hidden', !S.ending);
  let m = $('misreadCount'); if (!m) { m = document.createElement('p'); m.id = 'misreadCount'; m.style.cssText = 'text-align:center;color:var(--dim);font-size:12px;margin:12px 0 0'; U.after(m); }
  m.textContent = `已收集观众误读 ${S.misreads.length} 种 · 已剪出结局 ${S.endings.map(e => e === 'reunion' ? '重逢' : '离别').join('、') || '无'}`;
  $('btnReset').textContent = '清空进度'; $('btnReset').dataset.arm = '';
  show('drawer');
}
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
function showCredits() {
  const rows = LEVELS.map((L, i) => { const sv = S.solved[L.id]; if (!sv) return '';
    const seq = sv.seq.filter(Boolean).map((id, k) => esc(SHOTS[id].name) + (sv.flash && sv.flash.gap === k ? ` → <span style="color:#c98">［第二十五帧 · ${esc(SHOTS[sv.flash.id].name)}］</span>` : '')).join(' → ');
    return `<div class="shot"><em>镜头 ${i + 1} · ${esc(L.title)} · ${esc(L.goal.replace(/^让观众相信：|。$/g, ''))}</em>${seq}</div>`; }).join('');
  const end = S.ending === 'parting' ? '如实的离别' : '重逢';
  $('roll').className = 'roll' + (REDUCED ? ' static' : '');
  $('roll').innerHTML = `<div style="height:${REDUCED ? 10 : 30}vh"></div><h1>站 台</h1><div class="en">THE PLATFORM · RECUT ${S.ending === 'parting' ? '— AS IT WAS' : '— AS IT SHOULD HAVE BEEN'}</div>
  <div class="deco"></div>
  <div class="role">原 导 演</div><div class="name">沈先生</div>
  <div class="role">剪 辑</div><div class="name">你</div>
  <div class="role">主 演</div><div class="name">阿婉　·　沈先生（特写）</div>
  <div class="role">结 局</div><div class="name">${end}</div>
  <h3>SHOT LIST · 镜头表</h3>${rows}
  <div class="deco"></div>
  <div class="note">这部片子的镜头表，可以作为一部 AI 短片的分镜，交给叙事影像赛道。<br>每秒二十四格是拍下来的现实；第二十五格，是 AI 替人想象出来的那一帧。</div>
  <h3>WITH THANKS TO</h3><div class="shot">天光影片公司 道具间 · 北站 · 第三放映厅的所有观众<br>以及误读了这部电影 ${S.misreads.length} 次的人们</div>
  <h3>IN MEMORY</h3><div class="note" style="margin-top:6px">献给所有来不及过上的结局。</div>
  <div class="end">剧 终</div><div class="en">FIN</div><div style="height:${REDUCED ? 6 : 40}vh"></div>`;
  show('credits'); if (Snd.ok()) Snd.chime();
}

/* ---------- 启动 ---------- */
function init() {
  TH.cv = $('screen'); TH.c = TH.cv.getContext('2d'); TT.cv = $('titleCanvas'); TT.c = TT.cv.getContext('2d');
  thResize(); ttResize();
  if (window.ResizeObserver) new ResizeObserver(() => thResize()).observe(TH.cv);
  window.addEventListener('resize', () => { thResize(); if (TT.on) ttResize(); });
  requestAnimationFrame(thFrame); requestAnimationFrame(ttFrame);
  goLevel(Math.min(S.cur, S.unlocked));
  $('btnPlay').onclick = play;
  $('btnClear').onclick = () => { if (busy) return; tl = tl.map(() => null); flash = null; changed(); };
  $('btnMute').onclick = () => { Snd.init(); Snd.setMute(!Snd.muted); muteLabel(); };
  $('btnDrawer').onclick = () => { Snd.init(); openDrawer(); };
  $('btnCloseDrawer').onclick = () => hide('drawer');
  $('btnReset').onclick = e => { const b = e.currentTarget; if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = '再点一次，确认清空'; return; }
    store.del(SAVE); S = { cur: 0, unlocked: 0, solved: {}, endings: [], ending: null, read: [], misreads: [], prologue: false }; hide('drawer'); goLevel(0); };
  $('btnCreditsBack').onclick = () => hide('credits');
  ['noteModal', 'drawer'].forEach(id => $(id).addEventListener('click', e => { if (e.target.id === id && (id === 'drawer' || !$('noteActions').querySelector('.primary'))) hide(id); }));
  $('btnEnter').onclick = () => { Snd.init(); TT.on = false; hide('title'); $('app').removeAttribute('aria-hidden');
    if (!S.prologue) { S.prologue = true; save(); openLetter(-1, false, () => {}); } };
  muteLabel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in thumbCache) delete thumbCache[k]; render(); }).catch(() => {});
  window.addEventListener('pointerdown', () => Snd.init(), { once: true });
}
function muteLabel() { const b = $('btnMute'); b.textContent = Snd.muted ? '声音 关' : '声音 开'; b.setAttribute('aria-pressed', String(Snd.muted)); }
init();
</script>
