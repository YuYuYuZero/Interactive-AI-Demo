<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>末班车失物招领</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&family=Long+Cang&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --mint:#cfe7da; --mint2:#b9dccb; --mint3:#8fc4ad; --beige:#f3e9d3; --beige2:#e8dabb;
  --orange:#e9853b; --orange2:#c9692a; --wood:#c48a57; --wood2:#a8703f; --wood3:#8a5a31;
  --ink:#2c3936; --ink2:#55645f; --ink3:#8a9893; --paper:#fbf6ea; --paper2:#f4ecd8;
  --line9:#1f9d8b; --line9d:#167a6c; --red:#d9483b; --tube:#f7fbff; --yellow:#f2c14e;
  --shadow: 0 6px 18px rgba(60,70,60,.16), 0 1px 3px rgba(60,70,60,.12);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-title:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif;
  --f-hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#e4efe6; color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  background-image:
    linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px);
  background-size:28px 20px; background-color:#d6eadf;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.screen{position:fixed;inset:0;overflow:hidden}

/* ---------- 开始页 ---------- */
#title canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title-ui{position:absolute;left:0;right:0;bottom:0;padding:24px 16px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;pointer-events:none}
.title-ui > *{pointer-events:auto}
.title-ui h1{font-family:var(--f-title);font-weight:400;font-size:clamp(38px,8vw,72px);margin:0;letter-spacing:.08em;
  color:#fffdf6;text-shadow:0 3px 0 var(--line9d),0 8px 24px rgba(20,60,50,.35)}
.title-ui .sub{margin:0;color:#24443c;background:rgba(251,246,234,.86);padding:4px 14px;border-radius:999px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 26px;font-size:17px;font-weight:700;letter-spacing:.06em;
  background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange2),0 8px 20px rgba(160,80,20,.25);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange2)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--beige2)}
.btn.small{padding:8px 16px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.thumb:focus-visible{outline:3px solid var(--line9);outline-offset:2px}
.title-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- 主界面 ---------- */
#game{display:flex;flex-direction:column}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));
  background:#2a3b37;color:#f4f1e6;border-bottom:4px solid var(--line9)}
.badge9{width:30px;height:30px;border-radius:50%;background:var(--line9);display:grid;place-items:center;
  font-family:var(--f-mono);font-weight:600;font-size:16px;color:#fff;flex:0 0 auto;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.st-name{display:flex;flex-direction:column;line-height:1.15}
.st-name b{font-family:var(--f-title);font-weight:400;font-size:19px;letter-spacing:.12em}
.st-name small{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;opacity:.7}
.night-label{margin-left:auto;font-size:13px;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:999px;white-space:nowrap}
.icon-btn{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn svg{width:18px;height:18px}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:minmax(0,1fr);gap:14px;padding:14px}
.pane{min-height:0;display:flex;flex-direction:column}
.desk-pane{background:var(--wood);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.desk-wrap{position:relative;flex:1 1 auto;min-height:0;touch-action:none}
#deskCv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#deskCv.lensing{cursor:none}
.desk-tools{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:rgba(80,48,22,.22)}
.desk-tools .lbl{font-size:12px;color:#fff6e4;opacity:.85;margin-right:2px}
.chip{border:1.5px solid rgba(255,255,255,.0);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:13px;
  box-shadow:0 2px 0 rgba(0,0,0,.12)}
.chip.on{background:var(--line9);color:#fff}
.chip.sel{background:var(--orange);color:#fff}
.chip.ok{background:#dff1e6;border-color:var(--line9)}
.tray{flex:0 0 auto;display:flex;gap:10px;padding:10px 12px;background:var(--wood3);overflow-x:auto}
.thumb{flex:0 0 auto;width:104px;height:78px;border-radius:10px;border:2px solid transparent;background:#b98250;padding:0;position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.thumb canvas{width:100%;height:100%;display:block}
.thumb.on{border-color:var(--yellow);background:#cf9864}
.thumb .done{position:absolute;right:4px;top:4px;background:var(--line9);color:#fff;font-size:11px;border-radius:6px;padding:0 6px}
.desk-hint{position:absolute;left:12px;top:10px;right:12px;pointer-events:none;font-size:12.5px;color:#fff8ea;
  text-shadow:0 1px 2px rgba(60,30,10,.6)}
.item-name{position:absolute;left:12px;bottom:10px;pointer-events:none;background:rgba(251,246,234,.92);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
.prog{position:absolute;right:12px;bottom:10px;pointer-events:none;background:rgba(42,59,55,.82);color:#fff;border-radius:8px;padding:3px 10px;font-size:12px;font-family:var(--f-mono)}

.side-pane{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabs{flex:0 0 auto;display:flex;background:var(--beige2)}
.tab{flex:1;border:0;background:transparent;padding:11px 6px;font-size:15px;font-weight:700;color:var(--ink2);position:relative}
.tab.on{background:var(--paper);color:var(--ink)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;line-height:18px}
.tabbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.sec-h{font-family:var(--f-title);font-weight:400;font-size:18px;margin:4px 0 8px;color:var(--line9d);letter-spacing:.06em}
.notes-group{margin-bottom:14px}
.notes-group h4{margin:0 0 6px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.note{position:relative;background:#fffdf5;border-left:3px solid var(--yellow);padding:6px 10px 6px 12px;margin:0 0 6px;border-radius:0 8px 8px 0;font-size:13.5px;
  background-image:repeating-linear-gradient(transparent 0 21px, rgba(31,157,139,.13) 21px 22px)}
.note.fresh{animation:pop .6s ease}
@keyframes pop{0%{transform:translateX(10px);opacity:0}100%{transform:none;opacity:1}}
.empty{color:var(--ink3);font-size:13px}
.board{background:#e9f3ec;border-radius:10px;padding:10px 12px;margin-bottom:14px;border:1px dashed var(--mint3)}
.board .src{display:inline-block;font-size:11px;color:#fff;background:var(--ink2);border-radius:4px;padding:0 6px;margin-right:6px}
.board p{margin:0 0 7px;font-size:13px}
.board b{color:var(--ink)}
.ledger-item{background:#fffdf7;border:1px solid var(--beige2);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px;
  background-image:repeating-linear-gradient(transparent 0 25px, rgba(201,105,42,.10) 25px 26px)}
.ledger-item.solved{background-color:#eef7f1;border-color:var(--mint3)}
.ledger-item h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.ledger-item h4 .no{font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-weight:400}
.ledger-item .q{font-size:13px;color:var(--ink2);margin:8px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{border-color:var(--beige2)}
.ledger-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.hint{font-size:13px;color:#8a4a1d;background:#fbeadb;border-radius:8px;padding:6px 10px;margin-top:8px}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1.35;color:#24406a}
.stamp{font-family:var(--f-title);color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 8px;transform:rotate(-6deg);display:inline-block;font-size:14px}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(40,58,52,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.card{background:var(--paper);border-radius:18px;box-shadow:0 20px 60px rgba(20,40,30,.35);max-width:560px;width:100%;padding:22px 22px 20px;position:relative;margin:auto}
.memo{background:#fffbe9;transform:rotate(-1.2deg);max-width:420px;
  background-image:repeating-linear-gradient(transparent 0 33px, rgba(36,64,106,.14) 33px 34px);}
.memo .tape{position:absolute;top:-12px;left:50%;width:110px;height:26px;margin-left:-55px;background:rgba(242,193,78,.7);transform:rotate(2deg)}
.memo .hand{font-size:28px;margin:10px 0 14px;white-space:pre-line}
.memo .meta{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.story{max-width:980px;background:#fbf6ea}
.story h3{font-family:var(--f-title);font-weight:400;font-size:24px;margin:0 0 12px;color:var(--line9d);letter-spacing:.06em}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.panel{background:#fff;border:3px solid #2c3936;border-radius:6px;overflow:hidden;opacity:0;transform:translateY(10px);transition:opacity .6s, transform .6s}
.panel.in{opacity:1;transform:none}
.panel canvas{display:block;width:100%;aspect-ratio:4/3;background:#eee}
.panel p{margin:0;padding:8px 10px 10px;font-size:14px;border-top:2px solid #2c3936;min-height:64px}
.story .foot{display:flex;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);z-index:30;background:#2a3b37;color:#fff;padding:8px 16px;border-radius:999px;
  font-size:14px;opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--yellow)}

/* ---------- 结尾 ---------- */
#ending{overflow-y:auto;background:#eef4ec;z-index:15}
.end-wrap{max-width:980px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
.end-wrap h2{font-family:var(--f-title);font-weight:400;font-size:clamp(26px,5vw,40px);margin:8px 0 4px;color:var(--line9d);letter-spacing:.08em}
.end-wrap .lead{color:var(--ink2);margin:0 0 18px}
.sb{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:14px}
.sb th{background:#2a3b37;color:#fff;font-weight:500;text-align:left;padding:9px 10px;font-size:13px}
.sb td{padding:10px;border-top:1px solid #e6ebe5;vertical-align:top}
.sb td.n{font-family:var(--f-mono);color:var(--ink3);width:40px}
.sb td.k{white-space:nowrap;font-weight:700;color:var(--orange2)}
.tagline{display:inline-flex;align-items:center;gap:8px;background:var(--line9);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;margin:14px 0}
.ugc{margin-top:20px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;background:var(--paper);border:2px dashed var(--orange);border-radius:16px;padding:16px}
.ugc canvas{width:120px;height:90px}
.ugc h3{margin:0 0 4px;font-family:var(--f-title);font-weight:400;font-size:21px}
.ugc p{margin:0 0 8px;font-size:13.5px;color:var(--ink2)}
.end-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.mtabs{display:none}

@media (max-width:760px){
  .st-name small{display:none}
  .night-label{font-size:12px;padding-left:10px;padding-right:10px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .main{grid-template-columns:1fr;padding:8px 8px 0;gap:0}
  .pane{display:none}
  .pane.mshow{display:flex}
  .side-pane .tabs{display:none}
  .side-pane{border-radius:14px}
  .desk-pane{border-radius:14px}
  .mtabs{display:flex;flex:0 0 auto;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#2a3b37}
  .mtabs .tab{color:#cfe0d9;border-radius:10px;font-size:14px;padding:9px 4px}
  .mtabs .tab.on{background:var(--paper);color:var(--ink)}
  .thumb{width:84px;height:64px}
  .st-name b{font-size:16px}
  .night-label{font-size:12px;padding:2px 8px}
  .ugc{grid-template-columns:1fr}
  .sb th:nth-child(1),.sb td.n{display:none}
  .sb td,.sb th{padding:8px 7px;font-size:13px}
  .card{padding:18px 16px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<!-- 开始页 -->
<section id="title" class="screen" aria-label="开始页">
  <canvas id="titleCv" aria-hidden="true"></canvas>
  <div class="title-ui">
    <h1>末班车失物招领</h1>
    <p class="sub">9 号线终点站 · 青石桥 · 夜班管理员</p>
    <div class="title-row">
      <button class="btn" id="btnStart">开始值夜班</button>
      <button class="btn ghost hidden" id="btnContinue">继续上一班</button>
    </div>
  </div>
  <button class="icon-btn" id="btnMuteT" style="position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));background:rgba(42,59,55,.6)" aria-label="静音切换"></button>
</section>

<!-- 主界面 -->
<section id="game" class="screen hidden" aria-label="失物招领处">
  <header class="topbar">
    <div class="badge9">9</div>
    <div class="st-name"><b>青石桥</b><small>QINGSHIQIAO · 失物招领处</small></div>
    <span class="night-label" id="nightLabel">第一夜</span>
    <button class="icon-btn" id="btnMute" aria-label="静音切换"></button>
    <button class="icon-btn" id="btnHome" aria-label="回到站台">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </button>
  </header>
  <div class="main">
    <div class="pane desk-pane mshow" id="paneDesk">
      <div class="desk-wrap" id="deskWrap">
        <canvas id="deskCv" aria-label="检查台：拖动左右翻面，点击可疑之处放大查看"></canvas>
        <div class="desk-hint" id="deskHint">拖动物品左右翻面 · 点击可疑的地方放大 · 按住不放可以当放大镜</div>
        <div class="item-name" id="itemName"></div>
        <div class="prog" id="itemProg"></div>
      </div>
      <div class="desk-tools" id="faceBtns"></div>
      <div class="tray" id="tray" role="listbox" aria-label="今晚的失物筐"></div>
    </div>
    <div class="pane side-pane" id="paneSide">
      <div class="tabs">
        <button class="tab on" data-tab="notes">笔记 <span class="dot" id="dotNotes">0</span></button>
        <button class="tab" data-tab="ledger">登记簿</button>
      </div>
      <div class="tabbody" id="tabNotes"></div>
      <div class="tabbody hidden" id="tabLedger"></div>
    </div>
  </div>
  <nav class="mtabs" id="mtabs">
    <button class="tab on" data-m="desk">检查台</button>
    <button class="tab" data-m="notes">笔记 <span class="dot" id="dotNotesM">0</span></button>
    <button class="tab" data-m="ledger">登记簿</button>
  </nav>
</section>

<!-- 夜班开始的字条 -->
<div class="overlay hidden" id="memoOv">
  <div class="card memo">
    <div class="tape"></div>
    <div class="meta" id="memoMeta"></div>
    <div class="hand" id="memoText"></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn small" id="memoGo">打开失物筐</button></div>
  </div>
</div>

<!-- 归还分镜 -->
<div class="overlay hidden" id="storyOv">
  <div class="card story">
    <h3 id="storyTitle"></h3>
    <div class="panels" id="panels"></div>
    <div class="foot"><button class="btn small" id="storyNext">继续</button></div>
  </div>
</div>

<!-- 结尾 -->
<section id="ending" class="screen hidden" aria-label="本线路故事分镜单">
  <div class="end-wrap">
    <div class="stamp">值班结束</div>
    <h2>本线路故事分镜单</h2>
    <p class="lead">9 号线 · 青石桥站失物招领处 · 三个夜班整理。你在登记簿上写下的，是一家人互相等待的二十八年。</p>
    <span class="tagline">可作为 AI 短片分镜，提交叙事影像赛道</span>
    <table class="sb">
      <thead><tr><th>镜</th><th>景别</th><th>画面</th><th>声音</th></tr></thead>
      <tbody id="sbBody"></tbody>
    </table>
    <div class="ugc">
      <canvas id="ugcCv" width="240" height="180" aria-hidden="true"></canvas>
      <div>
        <h3>投递你的失物（即将开放）</h3>
        <p>拍一件你自己的旧物——一张车票、一把钥匙、一封没寄出的信。AI 会读出它身上的线索，为它写一个主人的故事，然后把它放进另一位夜班管理员的失物筐里。</p>
        <button class="btn small" disabled>即将开放</button>
      </div>
    </div>
    <div class="end-actions">
      <button class="btn" id="btnReplay">从第一夜重新值班</button>
      <button class="btn ghost" id="btnEndHome">回到站台</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>
<script>
"use strict";
/* =====================================================================
 *  《末班车失物招领》  剧情数据
 *  坐标系：每件物品在 400×280 的局部坐标中绘制，原点在中心。
 *  clue.face = 线索所在的面；x,y,r = 可点击放大区域。
 *  solution.needs = 判定为“有理有据”所需的线索（自检脚本会验证它们都存在）。
 * ===================================================================== */
/*DATA-START*/
const PEOPLE = {
  xutang:    { name: "许棠", tag: "师范大学 · 摄影系大三" },
  laozhou:   { name: "周守常", tag: "退休的 9 号线司机" },
  zhouyu:    { name: "周屿", tag: "梧桐里面包房 · 夜班面包师" },
  liuayi:    { name: "刘阿姨", tag: "青石桥站保洁员" },
  linxm:     { name: "林小满", tag: "高二学生" },
  sunayi:    { name: "孙阿姨", tag: "寻物电话" },
  wangxs:    { name: "王先生", tag: "寻物电话" },
  xiaoma:    { name: "小马", tag: "外卖骑手" },
  zhaoxs:    { name: "赵先生", tag: "寻物电话" }
};

const NIGHTS = [
{
  id: "n1", title: "第一夜", date: "11月3日 · 周一",

      c.moveTo(0, -s * 1.6); c.lineTo(s * 0.35, -s * 0.35); c.lineTo(s * 1.6, 0); c.lineTo(s * 0.35, s * 0.35); c.lineTo(0, s * 1.6); c.lineTo(-s * 0.35, s * 0.35); c.lineTo(-s * 1.6, 0); c.lineTo(-s * 0.35, -s * 0.35); c.closePath(); c.fill(); c.restore(); }
  });
  c.restore();
  // 放大镜
  let L = null;
  if (D.zoom) { const p = Math.min(1, (t - D.zoom.t0) / (reduced() ? 1 : 260)); const out = t - D.zoom.t0 > 1700; if (t - D.zoom.t0 > 1950) D.zoom = null; else L = { x: D.zoom.x, y: D.zoom.y, k: out ? Math.max(0, 1 - (t - D.zoom.t0 - 1700) / 250) : p, lx: D.zoom.lx, ly: D.zoom.ly }; }
  else if (D.lens) { const p = localPt(D.lens.px, D.lens.py); L = { x: D.lens.x, y: D.lens.y, k: 1, lx: p.x, ly: p.y }; }
  if (L && L.k > 0.01) drawLens(c, L);
}
function drawLens(c, L) {
  const R = Math.min(D.w, D.h) * 0.2 * (0.6 + 0.4 * L.k), zoom = 2.3;
  const x = Math.min(D.w - R - 4, Math.max(R + 4, L.x)), y = Math.min(D.h - R - 4, Math.max(R + 4, L.y));
  c.save(); c.globalAlpha = Math.min(1, L.k * 1.4);
  // 手柄
  c.save(); c.translate(x, y); c.rotate(0.75); c.fillStyle = "#6a4426"; rr(c, R * 0.95, -R * 0.13, R * 0.85, R * 0.26, R * 0.1); c.fill(); c.fillStyle = "#b8893a"; c.fillRect(R * 0.92, -R * 0.16, R * 0.14, R * 0.32); c.restore();
  c.save(); shadow(c, 18, 6, "rgba(40,20,5,.4)"); c.beginPath(); c.arc(x, y, R + 7, 0, 7); c.fillStyle = "#c79a45"; c.fill(); c.restore();
  c.save(); c.beginPath(); c.arc(x, y, R, 0, 7); c.clip();
  c.fillStyle = "#c48a57"; c.fillRect(x - R, y - R, R * 2, R * 2);
  const s = D.sc * zoom; c.translate(x, y); c.scale(s, s); c.translate(-L.lx, -L.ly);
  c.drawImage(D.off, -OFF_W / 2, -OFF_H / 2, OFF_W, OFF_H);
  c.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  const gg = c.createRadialGradient(x - R * 0.4, y - R * 0.5, 2, x, y, R); gg.addColorStop(0, "rgba(255,255,255,.28)"); gg.addColorStop(0.35, "rgba(255,255,255,0)"); gg.addColorStop(1, "rgba(80,60,30,.22)");
  c.fillStyle = gg; c.fillRect(x - R, y - R, R * 2, R * 2); c.restore();
  c.strokeStyle = "#8a6526"; c.lineWidth = 2; c.beginPath(); c.arc(x, y, R + 1, 0, 7); c.stroke();
  c.strokeStyle = "rgba(255,240,200,.7)"; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, R + 5, -2.6, -1.4); c.stroke();
  c.restore();
}
function startFlip(to) {
  if (to === D.face) return; const it = itemById(S.cur);
  (it && (it.id === "umbrella" || it.id === "wallet" || it.id === "notebook") ? SFX.cloth : SFX.paper)();
  if (reduced()) { D.face = to; D.offKey = ""; updateFaceBtns(); return; }
  D.flip = { t0: performance.now(), to };
}
function discover(cl, px, py) {
  const p = { x: cl.x, y: cl.y };
  D.zoom = { t0: performance.now(), x: px, y: py, lx: p.x, ly: p.y };
  if (!S.clues.includes(cl.id)) { S.clues.push(cl.id); save(); SFX.found(); toast("记入笔记：<b>" + esc(cl.short) + "</b>"); renderNotes(cl.id); renderTray(); updateProg(); }
  else { SFX.paper(); toast(esc(cl.text)); }
}
function bindDesk() {
  const cv = D.cv;
  cv.addEventListener("pointerdown", (e) => {
    audioInit(); cv.setPointerCapture(e.pointerId);
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    D.drag = { id: e.pointerId, x0: px, y0: py, px, py, dx: 0, t0: performance.now(), flipping: false, type: e.pointerType };
    clearTimeout(D.holdT);
    D.holdT = setTimeout(() => { if (D.drag && !D.drag.flipping) { D.lens = lensAt(px, py, e.pointerType); cv.classList.add("lensing"); } }, 260);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!D.drag || D.drag.id !== e.pointerId) return;
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    D.drag.dx = px - D.drag.x0; D.drag.px = px; D.drag.py = py;
    if (D.lens) { D.lens = lensAt(px, py, D.drag.type); return; }
    if (!D.drag.flipping && Math.abs(D.drag.dx) > 14 && Math.abs(D.drag.dx) > Math.abs(py - D.drag.y0)) { D.drag.flipping = true; clearTimeout(D.holdT); }
    else if (!D.drag.flipping && Math.hypot(px - D.drag.x0, py - D.drag.y0) > 14) clearTimeout(D.holdT);
  });
  const end = (e) => {
    if (!D.drag || D.drag.id !== e.pointerId) return; clearTimeout(D.holdT);
    const dr = D.drag; D.drag = null; cv.classList.remove("lensing");
    if (D.lens) { const L = D.lens; D.lens = null; const cl = hitClueLocal(L); if (cl) discover(cl, L.x, L.y); return; }
    if (e.type === "pointercancel") return;
    if (dr.flipping) { if (Math.abs(dr.dx) > 60) startFlip(D.face === "front" ? "back" : "front"); return; }
    if (Math.hypot(dr.px - dr.x0, dr.py - dr.y0) < 14) {
      const cl = hitClue(dr.px, dr.py);
      if (cl) discover(cl, dr.px, dr.py);
      else { const p = localPt(dr.px, dr.py); if (Math.abs(p.x) < 200 && Math.abs(p.y) < 140) { SFX.paper(); D.zoom = { t0: performance.now(), x: dr.px, y: dr.py, lx: p.x, ly: p.y }; } }
    }
  };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}
function lensAt(px, py, type) { const off = type === "touch" ? Math.min(D.w, D.h) * 0.24 : 0; return { px, py, x: px, y: py - off }; }
function hitClueLocal(L) { return hitClue(L.px, L.py); }

function updateFaceBtns() {
  const it = itemById(S.cur), box = $("faceBtns"); if (!it) { box.innerHTML = ""; return; }
  box.innerHTML = '<span class="lbl">查看：</span>' + it.faces.map(f => `<button class="chip ${f === (D.flip ? D.flip.to : D.face) ? "on" : ""}" data-face="${f}">${esc(it.faceLabels[f])}</button>`).join("");
  box.innerHTML += '<button class="chip" id="btnPeek" style="margin-left:auto" title="依次放大这一面上的可疑之处">细看下一处</button>';
  $("btnPeek").onclick = () => { audioInit(); const list = it.clues.filter(c => c.face === D.face); if (!list.length) { toast("这一面没有更多可疑之处了"); return; }
    const c = list.find(x => !S.clues.includes(x.id)) || list[(D.peek = ((D.peek || 0) + 1) % list.length)];
    discover(c, D.cx + c.x * D.sc, D.cy + c.y * D.sc); };
  box.querySelectorAll("[data-face]").forEach(b => b.onclick = () => { audioInit(); startFlip(b.dataset.face); setTimeout(updateFaceBtns, 0); });
}
function updateProg() {
  const it = itemById(S.cur); if (!it) return;
  const n = it.clues.filter(c => S.clues.includes(c.id)).length;
  $("itemName").textContent = it.name; $("itemProg").textContent = `线索 ${n}/${it.clues.length}`;
}
function selectItem(id) {
  S.cur = id; D.face = "front"; D.flip = null; D.offKey = ""; save();
  renderTray(); updateFaceBtns(); updateProg(); SFX.paper();
}
function renderTray() {
  const tray = $("tray"); tray.innerHTML = "";
  night().items.forEach(it => {
    const b = document.createElement("button"); b.className = "thumb" + (it.id === S.cur ? " on" : ""); b.setAttribute("role", "option"); b.setAttribute("aria-label", it.name);
    const cv = document.createElement("canvas"); b.appendChild(cv);
    if (S.solved[it.id]) { const s = document.createElement("span"); s.className = "done"; s.textContent = "已归还"; b.appendChild(s); }
    b.onclick = () => { audioInit(); selectItem(it.id); if (isMobile()) showMobile("desk"); };
    tray.appendChild(b);
    requestAnimationFrame(() => { const w = b.clientWidth, h = b.clientHeight; const c = sizeCanvas(cv, w, h); c.translate(w / 2, h / 2); const s = Math.min(w / 430, h / 300); c.scale(s, s); DRAW[it.id](c, "front"); });
  });
}

/* =====================================================================
 *  笔记 / 登记簿
 * ===================================================================== */
function renderNotes(freshId) {
  const n = night(); let html = '<div class="sec-h">今晚的寻物线索</div><div class="board">';
  n.owners.forEach(o => { html += `<p><span class="src">${esc(o.src)}</span><b>${esc(PEOPLE[o.id].name)}</b> · ${esc(o.text)}</p>`; });
  html += "</div>";
  let total = 0;
  for (let ni = S.night; ni >= 0; ni--) {
    const nn = NIGHTS[ni]; let block = "";
    nn.items.forEach(it => {
      const got = it.clues.filter(c => S.clues.includes(c.id)); total += ni === S.night ? got.length : 0;
      if (!got.length && ni !== S.night) return;
      block += `<div class="notes-group"><h4>${esc(it.name)} ${S.solved[it.id] ? '<span class="stamp" style="font-size:11px">已归还</span>' : ""}</h4>`;
      block += got.length ? got.map(c => `<div class="note ${c.id === freshId ? "fresh" : ""}">${esc(c.text)}</div>`).join("") : '<div class="empty">还没发现线索。翻面、打开、点一点可疑的地方。</div>';
      block += "</div>";
    });
    if (block) html += `<div class="sec-h">${ni === S.night ? "笔记" : esc(nn.title) + "的笔记"}</div>` + block;
  }
  $("tabNotes").innerHTML = html; $("dotNotes").textContent = total; $("dotNotesM").textContent = total;
}
const pick = {};
function renderLedger() {
  const n = night(); let html = `<div class="sec-h">登记簿 · ${esc(n.title)}</div><p class="empty" style="margin-top:-4px">为每件失物选出主人，并补全那个空格。答错没关系，登记簿会给你提示。</p>`;
  n.items.forEach((it, idx) => {
    const sol = it.solution, done = S.solved[it.id], pk = pick[it.id] || {};
    html += `<div class="ledger-item ${done ? "solved" : ""}" data-item="${it.id}"><h4><span class="no">No.${S.night + 1}-${idx + 1}</span>${esc(it.name)}</h4>`;
    if (done) {
      html += `<div>失主：<b>${esc(PEOPLE[sol.owner].name)}</b>（${esc(PEOPLE[sol.owner].tag)}）</div><div class="q">${esc(sol.question.replace("___", "「" + sol.options[sol.answer] + "」"))}</div>`;
      html += `<div class="ledger-foot"><span class="stamp">已归还</span><button class="btn small ghost" data-replay="${it.id}">重看归还</button></div>`;
    } else {
      html += `<div class="q">失主是：</div><div class="chips">` + n.owners.map(o => `<button class="chip ${pk.owner === o.id ? "sel" : ""}" data-owner="${o.id}">${esc(PEOPLE[o.id].name)}</button>`).join("") + "</div>";
      html += `<div class="q">${esc(sol.question)}</div><div class="chips">` + sol.options.map((op, i) => `<button class="chip ${pk.blank === i ? "sel" : ""}" data-blank="${i}">${esc(op)}</button>`).join("") + "</div>";
      html += `<div class="ledger-foot"><button class="btn small" data-submit="${it.id}" ${pk.owner == null || pk.blank == null ? "disabled" : ""}>登记并归还</button><button class="btn small ghost" data-look="${it.id}">去检查</button></div>`;
      if (pk.hint) html += `<div class="hint">${esc(pk.hint)}</div>`;
    }
    html += "</div>";
  });
  $("tabLedger").innerHTML = html;
  $("tabLedger").querySelectorAll(".ledger-item").forEach(card => {
    const id = card.dataset.item; pick[id] = pick[id] || {};
    card.querySelectorAll("[data-owner]").forEach(b => b.onclick = () => { pick[id].owner = b.dataset.owner; pick[id].hint = null; SFX.paper(); renderLedger(); });
    card.querySelectorAll("[data-blank]").forEach(b => b.onclick = () => { pick[id].blank = +b.dataset.blank; pick[id].hint = null; SFX.paper(); renderLedger(); });
    const sb = card.querySelector("[data-submit]"); if (sb) sb.onclick = () => submit(id);
    const lk = card.querySelector("[data-look]"); if (lk) lk.onclick = () => { selectItem(id); if (isMobile()) showMobile("desk"); };
    const rp = card.querySelector("[data-replay]"); if (rp) rp.onclick = () => playStory(itemById(id).ret, null);
  });
}
function submit(id) {
  audioInit(); const it = itemById(id), sol = it.solution, pk = pick[id];
  if (pk.owner !== sol.owner) { pk.hint = it.hints[pk.owner] || it.hints._owner; SFX.soft(); renderLedger(); return; }
  if (pk.blank !== sol.answer) { pk.hint = it.hints._blank; SFX.soft(); renderLedger(); return; }
  const need = [...new Set([...sol.needs, ...(sol.answerNeeds || [])])].filter(c => !S.clues.includes(c));
  if (need.length) { pk.hint = `你的直觉是对的。但登记簿要写依据——再仔细看看这件${it.name}，还有 ${need.length} 条关键线索没记下来。`; SFX.soft(); renderLedger(); return; }
  S.solved[id] = { owner: pk.owner, blank: pk.blank }; save(); SFX.chime();
  renderLedger(); renderTray(); renderNotes();
  playStory(it.ret, afterReturn);
}
function afterReturn() {
  const n = night();
  if (n.items.every(it => S.solved[it.id])) {
    if (S.night < NIGHTS.length - 1) { S.night++; S.cur = null; save(); enterNight(); }
    else { S.finale = true; save(); playStory(FINALE, () => { S.ended = true; save(); showEnding(); }); }
  } else {
    const next = n.items.find(it => !S.solved[it.id]); if (next) selectItem(next.id);
  }
}

/* =====================================================================
 *  弹层：字条 / 分镜
 * ===================================================================== */
function enterNight() {
  const n = night(); $("nightLabel").textContent = `${n.title} · ${n.date}`;
  if (!S.cur || !n.items.some(it => it.id === S.cur)) S.cur = (n.items.find(it => !S.solved[it.id]) || n.items[0]).id;
  D.face = "front"; D.offKey = "";
  renderTray(); renderNotes(); renderLedger(); updateFaceBtns(); updateProg();
  if (!S.memoSeen[n.id]) {
    $("memoMeta").textContent = `${n.title} · ${n.date} · 末班车 23:58 到站后`;
    $("memoText").textContent = n.memo; $("memoOv").classList.remove("hidden"); SFX.paper();
  }
}
function playStory(story, done) {
  $("storyTitle").textContent = story.title; const box = $("panels"); box.innerHTML = "";
  $("storyOv").classList.remove("hidden");
  story.panels.forEach((p, i) => {
    const el = document.createElement("div"); el.className = "panel"; const cv = document.createElement("canvas"); const tx = document.createElement("p"); tx.textContent = p.text;
    el.appendChild(cv); el.appendChild(tx); box.appendChild(el);
    requestAnimationFrame(() => {
      const w = cv.clientWidth || 260, h = w * 0.75; const c = sizeCanvas(cv, w, h); c.scale(w / 320, h / 240); drawPanel(c, 320, 240, p);
      if (reduced()) el.classList.add("in"); else setTimeout(() => { el.classList.add("in"); SFX.paper(); }, 250 + i * 650);
    });
  });
  $("storyNext").textContent = story === FINALE ? "整理本线路分镜单" : done === afterReturn && night().items.every(it => S.solved[it.id]) ? (S.night < NIGHTS.length - 1 ? "下班，迎接下一夜" : "零点零五分……") : "继续";
  $("storyNext").onclick = () => { $("storyOv").classList.add("hidden"); if (done) done(); };
  setTimeout(() => $("storyNext").focus({ preventScroll: true }), 50);
}

/* =====================================================================
 *  画面切换
 * ===================================================================== */
const isMobile = () => window.matchMedia("(max-width:760px)").matches;
function showMobile(which) {
  $("mtabs").querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.m === which));
  $("paneDesk").classList.toggle("mshow", which === "desk"); $("paneSide").classList.toggle("mshow", which !== "desk");
  if (which !== "desk") showSideTab(which); else requestAnimationFrame(() => { resizeDesk(); renderTray(); });
}
function showSideTab(which) {
  document.querySelectorAll(".side-pane .tabs .tab").forEach(t => t.classList.toggle("on", t.dataset.tab === which));
  $("tabNotes").classList.toggle("hidden", which !== "notes"); $("tabLedger").classList.toggle("hidden", which !== "ledger");
}
let view = "title";
function showTitle() {
  view = "title"; $("title").classList.remove("hidden"); $("game").classList.add("hidden"); $("ending").classList.add("hidden");
  const sv = load(); $("btnContinue").classList.toggle("hidden", !(sv && (sv.clues.length || sv.night > 0)));
  resizeTitle();
}
function startGame(cont) {
  audioInit();
  if (!cont) { S = freshState(); save(); } else { const sv = load(); if (sv) S = sv; }
  if (S.ended) { showEnding(); return; }
  view = "game"; $("title").classList.add("hidden"); $("ending").classList.add("hidden"); $("game").classList.remove("hidden");
  requestAnimationFrame(() => { resizeDesk(); enterNight(); if (S.finale) playStory(FINALE, () => { S.ended = true; save(); showEnding(); }); });
}
function showEnding() {
  view = "ending"; $("game").classList.add("hidden"); $("title").classList.add("hidden"); $("ending").classList.remove("hidden"); $("ending").scrollTop = 0;
  $("sbBody").innerHTML = STORYBOARD.map((r, i) => `<tr><td class="n">${String(i + 1).padStart(2, "0")}</td><td class="k">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("");
  const u = $("ugcCv"); const c = sizeCanvas(u, 120, 90); drawMystery(c, 120, 90);
}
let titleCtx = null, tW = 0, tH = 0;
function resizeTitle() { const cv = $("titleCv"); tW = window.innerWidth; tH = window.innerHeight; titleCtx = sizeCanvas(cv, tW, tH); }

function loop(t) {
  if (view === "title" && titleCtx && !document.hidden) { titleCtx.clearRect(0, 0, tW, tH); drawTitle(titleCtx, tW, tH, t, reduced()); }
  else if (view === "game" && !document.hidden) drawDesk(t);
  requestAnimationFrame(loop);
}

/* =====================================================================
 *  启动
 * ===================================================================== */
/* 中文 Google Fonts 按 unicode-range 分片加载，Canvas 里用到的字不会自动触发下载，这里主动预加载 */
const SRC_TEXT = (document.currentScript && document.currentScript.textContent) || "";
let fontGen = 0;
function preloadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const chars = [...new Set((SRC_TEXT.match(/[\u3000-\u9fff\uff00-\uffef]/g) || []))].join("") + "0123456789#:.-ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const fams = ['20px "Long Cang"', '20px "ZCOOL KuaiLe"', '400 20px "Noto Sans SC"', '700 20px "Noto Sans SC"', '400 20px "IBM Plex Mono"', '600 20px "IBM Plex Mono"'];
  const refresh = () => { fontGen++; D.offKey = ""; if (view === "game") renderTray(); };
  Promise.all(fams.map(f => document.fonts.load(f, chars).catch(() => null))).then(refresh, refresh);
  if (document.fonts.ready) document.fonts.ready.then(refresh, () => 0);
}
function init() {
  D.cv = $("deskCv"); bindDesk(); setMuted(AU.muted);
  $("btnStart").onclick = () => startGame(false);
  $("btnContinue").onclick = () => startGame(true);
  $("btnHome").onclick = () => { save(); showTitle(); };
  $("btnEndHome").onclick = () => showTitle();
  $("btnReplay").onclick = () => startGame(false);
  ["btnMute", "btnMuteT"].forEach(id => $(id).onclick = () => { audioInit(); setMuted(!AU.muted); });
  $("memoGo").onclick = () => { S.memoSeen[night().id] = true; save(); $("memoOv").classList.add("hidden"); SFX.cloth(); };
  document.querySelectorAll(".side-pane .tabs .tab").forEach(t => t.onclick = () => showSideTab(t.dataset.tab));
  $("mtabs").querySelectorAll(".tab").forEach(t => t.onclick = () => showMobile(t.dataset.m));
  document.addEventListener("pointerdown", () => audioInit(), { once: true });
  window.addEventListener("resize", () => { if (view === "title") resizeTitle(); else if (view === "game") resizeDesk(); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (view === "game") resizeDesk(); }).observe($("deskWrap"));
  preloadFonts();
  window.addEventListener("keydown", (e) => {
    if (view !== "game" || !$("memoOv").classList.contains("hidden") || !$("storyOv").classList.contains("hidden")) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") startFlip(D.face === "front" ? "back" : "front");
  });
  showTitle(); requestAnimationFrame(loop);
}
window.ItemGenerator = ItemGenerator;
init();
</script>
