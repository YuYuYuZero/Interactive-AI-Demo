<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16060d">
<title>灯会 · 光路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap">
<style>
:root{
  --bg:#16060d; --wine:#3b0d1f; --plum:#2a0f2e; --lac:#24080f;
  --gold:#f0c26a; --gold-hi:#ffe4a6; --gold-lo:#a8772f;
  --text:#f2e2c2; --muted:rgba(242,226,194,.62); --faint:rgba(242,226,194,.32);
  --f-title:"ZCOOL XiaoWei","Long Cang","STKaiti","KaiTi","Kaiti SC","Songti SC",serif;
  --f-hand:"Long Cang","ZCOOL XiaoWei","STKaiti","KaiTi","Kaiti SC",cursive;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);color-scheme:dark;
  font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{position:absolute;inset:0;pointer-events:none;transition:opacity .5s ease}
.screen.hidden{display:none}
.screen.fade{opacity:0}
.pe{pointer-events:auto}

/* 静音 */
#mute{position:fixed;top:calc(8px + var(--sat));right:calc(8px + var(--sar));width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(240,194,106,.35);background:rgba(30,8,16,.55);display:grid;place-items:center;pointer-events:auto;z-index:20;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#mute svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:inline}

/* 开始页 */
#scrTitle .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(92vw,640px);pointer-events:none;padding:28px 0 30px;
  background:radial-gradient(closest-side,rgba(18,3,9,.72),rgba(18,3,9,.45) 55%,rgba(18,3,9,0));}
.kicker{text-shadow:0 0 8px #1a0409,0 0 3px #1a0409;font-family:var(--f-body);font-size:13px;letter-spacing:.6em;color:var(--muted);margin:0 0 10px;padding-left:.6em}
h1.logo{margin:0;line-height:1;font-weight:400;display:flex;align-items:flex-end;justify-content:center;gap:.08em}
h1.logo .t1{font-family:var(--f-title);font-size:clamp(76px,15vw,148px);letter-spacing:.06em;
  background:linear-gradient(180deg,#fff3cf 0%,#ffd47e 45%,#e59a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,170,70,.45)) drop-shadow(0 2px 0 rgba(60,10,10,.6))}
h1.logo .dot{font-family:var(--f-title);font-size:clamp(30px,5vw,48px);color:var(--gold);opacity:.8;padding-bottom:.55em}
h1.logo .t2{font-family:var(--f-hand);font-size:clamp(54px,10vw,100px);color:#ffcf86;padding-bottom:.06em;
  text-shadow:0 0 22px rgba(255,140,60,.55),0 0 2px rgba(255,230,180,.8)}
.sub{font-size:clamp(15px,2.2vw,18px);color:var(--text);opacity:.86;margin:18px 0 28px;letter-spacing:.18em}
.btn-main{pointer-events:auto;position:relative;min-width:168px;height:58px;padding:0 34px;border-radius:30px;font-family:var(--f-title);font-size:26px;letter-spacing:.4em;text-indent:.4em;
  color:#fff3d6;border:1px solid rgba(255,214,140,.75);
  background:radial-gradient(120% 140% at 50% 30%,#d8432c 0%,#9c1c1e 55%,#5c0c14 100%);
  box-shadow:0 0 0 4px rgba(120,20,20,.35),0 0 30px rgba(255,120,60,.45),inset 0 1px 0 rgba(255,220,170,.5),inset 0 -6px 14px rgba(40,0,0,.5);
  transition:transform .15s ease, box-shadow .3s ease}
.btn-main:active{transform:scale(.97)}
.btn-main:hover{box-shadow:0 0 0 4px rgba(150,30,20,.45),0 0 44px rgba(255,150,70,.6),inset 0 1px 0 rgba(255,220,170,.5),inset 0 -6px 14px rgba(40,0,0,.5)}
.title-foot{position:absolute;left:0;right:0;bottom:calc(18px + var(--sab));text-align:center;font-size:12px;letter-spacing:.3em;color:var(--faint)}

/* 面板通用 */
.panel{pointer-events:auto;background:linear-gradient(180deg,rgba(40,10,20,.86),rgba(22,6,12,.9));border:1px solid rgba(240,194,106,.28);
  border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,160,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ghost-btn{pointer-events:auto;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(240,194,106,.4);background:rgba(50,14,22,.6);
  font-size:15px;letter-spacing:.12em;color:var(--text)}
.ghost-btn:active{transform:scale(.97)}
.gold-btn{pointer-events:auto;min-height:46px;padding:0 24px;border-radius:23px;border:1px solid rgba(255,220,150,.8);
  background:linear-gradient(180deg,#f6cf7a,#c98b34);color:#3a0e0a;font-size:16px;font-weight:700;letter-spacing:.2em;box-shadow:0 0 20px rgba(255,180,80,.35)}
.gold-btn:active{transform:scale(.97)}

/* 关卡选择 */
#scrSelect .panel{position:absolute;left:50%;top:calc(50% + var(--sat)/2);transform:translate(-50%,-50%);width:min(94vw,720px);max-height:calc(100% - 76px - var(--sat) - var(--sab));
  overflow:auto;padding:20px 20px 18px;scrollbar-width:none}
#scrSelect .panel::-webkit-scrollbar{display:none}
.sel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sel-head h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:30px;letter-spacing:.12em;color:var(--gold-hi);flex:1}
.sel-head h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:.2em;margin-left:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{min-height:56px;border-radius:12px;border:1px solid rgba(240,194,106,.22);background:rgba(255,220,160,.04);text-align:center;padding:6px 4px}
.tab b{display:block;font-family:var(--f-title);font-weight:400;font-size:22px;letter-spacing:.2em;color:var(--text)}
.tab span{display:block;font-size:11px;color:var(--faint);letter-spacing:.1em;margin-top:2px}
.tab.on{border-color:rgba(255,206,120,.8);background:linear-gradient(180deg,rgba(200,60,40,.35),rgba(120,20,30,.25));box-shadow:inset 0 0 18px rgba(255,150,70,.18)}
.tab.on b{color:var(--gold-hi)}
.ch-line{font-size:14px;color:var(--muted);letter-spacing:.12em;margin:2px 2px 14px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lv{position:relative;aspect-ratio:1/1.08;min-height:48px;border-radius:12px;border:1px solid rgba(240,194,106,.22);background:rgba(20,5,10,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.lv .n{font-family:var(--f-title);font-size:22px;line-height:1;color:var(--text)}
.lv .nm{font-size:10.5px;color:var(--faint);letter-spacing:.05em;white-space:nowrap;overflow:hidden;max-width:100%}
.lv .st{display:flex;gap:1px;height:10px}
.lv .st i{width:9px;height:9px;display:block;background:rgba(242,226,194,.16);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.lv .st i.on{background:var(--gold)}
.lv.done{border-color:rgba(255,206,120,.55);background:radial-gradient(90% 90% at 50% 40%,rgba(255,160,70,.28),rgba(60,12,18,.6))}
.lv.done .n{color:var(--gold-hi);text-shadow:0 0 10px rgba(255,170,70,.6)}
.lv.next{border-color:rgba(255,206,120,.9);animation:pulse 2.4s ease-in-out infinite}
.lv.lock{opacity:.38}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,180,90,0)}50%{box-shadow:0 0 16px 2px rgba(255,170,80,.35)}}
.sel-foot{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
@media (max-width:520px){ .hud-title b{font-size:18px;letter-spacing:.06em}  .lv .nm{display:none} .grid{gap:6px} #scrSelect .panel{padding:16px 12px 14px} .sel-head h2{font-size:26px} }

/* 游戏 HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--sat)) calc(60px + var(--sar)) 0 calc(8px + var(--sal));display:flex;align-items:center;gap:8px;pointer-events:none}
.icon-btn{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(240,194,106,.35);background:rgba(30,8,16,.6);display:grid;place-items:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.icon-btn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.94)}
.hud-title{flex:1;min-width:0;text-align:center;line-height:1.25}
.hud-title b{display:block;font-family:var(--f-title);font-weight:400;font-size:21px;letter-spacing:.14em;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-title span{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.12em;white-space:nowrap}
.hud-title span em{font-style:normal;color:var(--gold)}
#tip{position:absolute;left:50%;transform:translateX(-50%);top:calc(60px + var(--sat));width:min(92vw,620px);text-align:center;font-size:14px;line-height:1.6;letter-spacing:.06em;
  color:#f6dcae;padding:6px 14px;border-radius:12px;background:linear-gradient(90deg,transparent,rgba(60,14,22,.78) 14%,rgba(60,14,22,.78) 86%,transparent);transition:opacity .4s}
#tip:empty{display:none}
#tray{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .4s, transform .4s}
#tray.away{opacity:0;transform:translateY(20px)}
#tray.away *{pointer-events:none!important}
.tools{display:flex;gap:10px;align-items:center;justify-content:center;pointer-events:auto;min-height:62px;padding:6px 12px;border-radius:20px;
  background:linear-gradient(180deg,rgba(46,12,20,.82),rgba(24,6,12,.9));border:1px solid rgba(240,194,106,.25);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tool{position:relative;width:54px;height:54px;border-radius:14px;border:1px solid rgba(240,194,106,.25);background:rgba(255,220,160,.05);padding:0;touch-action:none}
.tool canvas{width:100%;height:100%;display:block;pointer-events:none}
.tool .c{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#b8301f;color:#fff0d0;font-size:12px;line-height:20px;text-align:center;border:1px solid rgba(255,210,150,.7);padding:0 4px}
.tool.sel{border-color:#ffd480;background:rgba(255,190,90,.18);box-shadow:0 0 16px rgba(255,170,70,.45)}
.tool.empty{opacity:.32}
.tools .none{font-size:13px;color:var(--faint);letter-spacing:.14em;padding:0 8px}
.ops{font-size:12.5px;color:var(--muted);letter-spacing:.16em}
.after{display:none;gap:10px;pointer-events:auto}
#tray.won .tools,#tray.won .ops{display:none}
#tray.won .after{display:flex}

/* 弹窗 */
.modal{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:rgba(10,2,6,.55);transition:opacity .45s;padding:16px}
.modal.hidden{display:none}
.modal.fade{opacity:0}
.card{position:relative;width:min(92vw,400px);max-height:calc(100% - 20px);overflow:auto;padding:18px 20px 18px;border-radius:20px;text-align:center;scrollbar-width:none;
  background:radial-gradient(120% 70% at 50% 0%,rgba(150,40,30,.5),transparent 60%),linear-gradient(180deg,#2e0b16,#1a050c);
  border:1px solid rgba(240,194,106,.45);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px rgba(20,4,8,.5),inset 0 0 0 7px rgba(240,194,106,.22)}
.card::-webkit-scrollbar{display:none}
.card .lbl{font-size:12px;letter-spacing:.5em;color:var(--muted);padding-left:.5em}
.card canvas{display:block;width:100%;height:210px;margin:6px 0 2px}
.card h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:40px;letter-spacing:.18em;color:var(--gold-hi);text-shadow:0 0 18px rgba(255,160,70,.45)}
.card p.desc{margin:10px 4px 6px;font-size:15px;line-height:1.85;color:var(--text);text-align:justify;letter-spacing:.04em}
.card .where{font-size:12.5px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.card .mine{font-size:13px;color:#ffd79a;margin:8px 0 0;letter-spacing:.06em}
.stars{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.stars i{width:26px;height:26px;display:block;background:rgba(242,226,194,.15);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:linear-gradient(180deg,#fff0c0,#f0b44e);filter:drop-shadow(0 0 6px rgba(255,190,90,.8))}
.card .btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.alb{border-radius:12px;border:1px solid rgba(240,194,106,.2);background:rgba(20,5,10,.5);padding:4px 2px 6px;min-height:44px}
.alb canvas{width:100%;height:86px;display:block}
.alb span{font-size:13px;letter-spacing:.1em;color:var(--text)}
.alb.lock span{color:var(--faint)}
.designer input{width:100%;height:48px;border-radius:12px;border:1px solid rgba(240,194,106,.45);background:rgba(10,2,6,.6);color:var(--text);
  font-family:var(--f-body);font-size:16px;padding:0 14px;outline:none;margin-top:10px;-webkit-user-select:text;user-select:text}
.designer input:focus{border-color:#ffd480;box-shadow:0 0 0 3px rgba(255,190,90,.18)}
.designer .hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7;letter-spacing:.04em}
</style>
</head>
<body>
<canvas id="cv" aria-label="灯会古街"></canvas>
<div id="ui">
  <button id="mute" aria-label="静音开关" title="声音">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
  </button>

  <section id="scrTitle" class="screen">
    <div class="wrap">
      <p class="kicker">元宵 · 七夕 · 中秋</p>
      <h1 class="logo"><span class="t1">灯会</span><span class="dot">·</span><span class="t2">光路</span></h1>
      <p class="sub">一束光，点亮一整条街。</p>
      <button id="btnStart" class="btn-main">点灯</button>
    </div>
    <div class="title-foot">铜镜折光 · 窗棂分光 · 琉璃染光</div>
  </section>

  <section id="scrSelect" class="screen hidden">
    <div class="panel">
      <div class="sel-head">
        <button class="icon-btn" id="selBack" aria-label="回到开始"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
        <h2>灯会<small id="selCount"></small></h2>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="ch-line" id="chLine"></div>
      <div class="grid" id="lvGrid"></div>
      <div class="sel-foot">
        <button class="ghost-btn" id="btnAlbum">翻灯谱</button>
        <button class="ghost-btn" id="btnDesign">扎一盏你的灯</button>
      </div>
    </div>
  </section>

  <section id="scrGame" class="screen hidden">
    <div id="hud">
      <button class="icon-btn" id="gBack" aria-label="回到街口"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
      <div class="hud-title"><b id="gTitle"></b><span id="gSub"></span></div>
      <button class="icon-btn" id="gHint" aria-label="提示" title="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
      <button class="icon-btn" id="gReset" aria-label="重来" title="重来"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
    </div>
    <div id="tip"></div>
    <div id="tray">
      <div class="tools" id="tools"></div>
      <div class="ops" id="ops"></div>
      <div class="after">
        <button class="ghost-btn" id="aCard">看灯谱</button>
        <button class="gold-btn" id="aNext">下一盏</button>
      </div>
    </div>
  </section>

  <div id="mCard" class="modal hidden">
    <div class="card">
      <div class="lbl" id="cLbl">灯谱</div>
      <canvas id="cCanvas"></canvas>
      <h3 id="cName"></h3>
      <div class="where" id="cWhere"></div>
      <div class="stars" id="cStars"><i></i><i></i><i></i></div>
      <p class="desc" id="cDesc"></p>
      <p class="mine" id="cMine"></p>
      <div class="btns">
        <button class="ghost-btn" id="cLook">再看一眼</button>
        <button class="ghost-btn" id="cList">回街口</button>
        <button class="gold-btn" id="cNext">下一盏</button>
      </div>
    </div>
  </div>

  <div id="mAlbum" class="modal hidden">
    <div class="card" style="width:min(94vw,560px)">
      <div class="lbl">灯谱</div>
      <h3 style="font-size:30px;margin-top:6px">满街的灯</h3>
      <div class="where" id="albCount"></div>
      <div class="album-grid" id="albGrid"></div>
      <div class="btns"><button class="ghost-btn" id="albClose">合上</button></div>
    </div>
  </div>

  <div id="mDesign" class="modal hidden">
    <div class="card designer">
      <div class="lbl">扎灯</div>
      <canvas id="dCanvas"></canvas>
      <h3 id="dName" style="font-size:30px">你的灯</h3>
      <input id="dInput" maxlength="30" placeholder="比如：一只金色的兔子，身上有云纹" autocomplete="off">
      <div class="hint">用一句话说说你想要的灯。认得这些字：兔、荷、莲、鱼、蝶、星、柚、球、宫、马、篮、纱、天；红、金、黄、绿、蓝、紫、白、粉；云、花、梅、鳞、月、格。扎好的灯会挂在街口，过关时一起亮。</div>
      <div class="btns">
        <button class="ghost-btn" id="dRemove">取下</button>
        <button class="ghost-btn" id="dClose">合上</button>
        <button class="gold-btn" id="dMake">扎灯</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ==LOGIC-START== 纯逻辑：光路追踪、关卡生成（node 测试会抽出这一段单独运行） */
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];          // 0上 1右 2下 3左
const REFL = [[1, 0, 3, 2], [3, 2, 1, 0]];              // o=0 「/」 o=1 「\」
const CI = { g: 0, r: 1, j: 2, b: 3 };                  // 光色：金(素) 朱 翠 蓝
const MAX_STEPS = 40000;                                // 光束总步数上限（防镜间死循环）

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 光路追踪：从所有灯芯出发，广度优先；花灯被同色(或素灯被任意色)光照到即亮，并向自己的方向再发光。
   seen 以 (格, 方向, 颜色) 去重，保证有限；另有 MAX_STEPS 兜底。 */
function trace(W, H, pieces) {

function placeFromTray(k, x, y) {
  const it = takeFromTray(k); if (!it) return false;
  const p = { t: it.t, x, y }; if (it.t === 'gls') p.c = it.c; else p.o = 0;
  G.pieces.push(p); G.ops++; tick('place');
  addSparks(...cellC(x, y), 'g', 8, G.cs * 0.8);
  if (!G.tray.find(t => t.t + (t.c || '') === k)) G.sel = -1;
  buildTools(); retrace();
  return true;
}
function returnToTray(p) {
  G.pieces = G.pieces.filter(q => q !== p);
  G.tray.push(p.t === 'gls' ? { t: 'gls', c: p.c } : { t: p.t });
  G.ops++; tick('back'); buildTools(); retrace();
}
function trayDown(e, k, n) {
  auInit();
  if (G.won || !n) return;
  e.preventDefault();
  G.drag = { fromTray: k, piece: Object.assign({ x: -1, y: -1, o: 0 }, (() => { const it = G.tray.find(t => t.t + (t.c || '') === k); return { t: it.t, c: it.c }; })()), sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, moved: false, id: e.pointerId };
}
function onDown(e) {
  auInit();
  if (curScreen !== 'game' || !G.L || G.won) return;
  const cell = cellFromPt(e.clientX, e.clientY);
  if (!cell) { if (G.sel >= 0) { G.sel = -1; buildTools(); } return; }
  const p = pieceAt(cell[0], cell[1]);
  if (!p) {
    if (G.sel >= 0) placeFromTray(G.selKey, cell[0], cell[1]);
    return;
  }
  G.drag = { piece: p, sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, moved: false, id: e.pointerId };
}
function onMove(e) {
  const d = G.drag; if (!d || e.pointerId !== d.id) return;
  d.px = e.clientX; d.py = e.clientY;
  if (!d.moved && Math.hypot(d.px - d.sx, d.py - d.sy) > 9) {
    if (d.fromTray || !d.piece.fixed && (d.piece.t === 'mir' || d.piece.t === 'spl' || d.piece.t === 'gls')) d.moved = true;
    else if (d.piece.fixed) { d.piece._wig = now(); G.drag = null; }
    else G.drag = null;
  }
}
function onUp(e) {
  const d = G.drag; if (!d || e.pointerId !== d.id) return;
  G.drag = null;
  if (G.won) return;
  const cell = cellFromPt(e.clientX, e.clientY);
  if (d.fromTray) {
    if (d.moved) { if (cell && !pieceAt(cell[0], cell[1])) placeFromTray(d.fromTray, cell[0], cell[1]); }
    else { // 轻点：选中/取消
      if (G.sel >= 0 && G.selKey === d.fromTray) G.sel = -1; else { G.sel = 1; G.selKey = d.fromTray; }
      tick('sel'); buildTools();
    }
    return;
  }
  const p = d.piece;
  if (d.moved) {
    if (!cell) { returnToTray(p); return; }
    const q = pieceAt(cell[0], cell[1]);
    if (!q && (cell[0] !== p.x || cell[1] !== p.y)) { p.x = cell[0]; p.y = cell[1]; G.ops++; tick('place'); retrace(); }
    return;
  }
  // 轻点
  if (p.t === 'mir' || p.t === 'spl') { p.o ^= 1; p._rotAt = now(); G.ops++; tick('rot'); retrace(); }
  else if (p.t === 'gls') { p._wig = now(); if (!p.fixed) toast('琉璃不用转，拖动可挪位，拖出街外即收回。'); }
  else if (p.t === 'lan' && p._lit) { pluck(pentaFreq(3 + (p.x + p.y) % 6), 0.16); addSparks(...cellC(p.x, p.y), p.main ? 'g' : p.c, 10, G.cs); }
  else if (p.t === 'src') { pluck(pentaFreq(0), 0.14); addSparks(...cellC(p.x, p.y), 'g', 8, G.cs * 0.6); }
}
let toastTimer = 0;
function toast(msg) {
  const tip = $('#tip'); const prev = G.L ? G.L.tip : '';
  tip.textContent = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { tip.textContent = prev; }, 2600);
}
function doHint() {
  if (G.won || !G.L) return;
  auInit();
  const L = G.L, key = p => p.x + ',' + p.y;
  const sol = new Map(L.sol.map(p => [key(p), p]));
  const same = (a, b) => a.t === b.t && (a.t !== 'gls' || a.c === b.c);
  const fl = (p) => { G.flash = { x: p.x, y: p.y, t: now() }; G.ops++; G.hints++; };
  // 1. 固定元件转错了
  for (const p of G.pieces) if (p.fixed && (p.t === 'mir' || p.t === 'spl')) { const s = sol.get(key(p)); if (s && s.o !== p.o) { p.o = s.o; p._rotAt = now(); fl(p); tick('rot'); retrace(); return; } }
  // 2. 该摆的元件
  const initKeys = new Set(L.init.map(key));
  for (const s of L.sol) {
    if (initKeys.has(key(s))) continue;
    const cur = pieceAt(s.x, s.y);
    if (cur && same(cur, s)) { if (s.o !== undefined && cur.o !== s.o) { cur.o = s.o; cur._rotAt = now(); fl(cur); tick('rot'); retrace(); return; } continue; }
    if (cur && !cur.fixed && cur.t !== 'lan' && cur.t !== 'src' && cur.t !== 'scr') { returnToTray(cur); G.flash = { x: s.x, y: s.y, t: now() }; G.hints++; return; }
    if (cur) continue;
    const k = s.t + (s.c || '');
    if (!G.tray.find(t => t.t + (t.c || '') === k)) {
      const stray = G.pieces.find(q => !q.fixed && same(q, s) && !(sol.get(key(q)) && same(sol.get(key(q)), q)));
      if (!stray) continue;
      G.pieces = G.pieces.filter(q => q !== stray); G.tray.push(stray.t === 'gls' ? { t: 'gls', c: stray.c } : { t: stray.t });
    }
    G.hints++;
    placeFromTray(k, s.x, s.y);
    const np = pieceAt(s.x, s.y); if (np && s.o !== undefined) np.o = s.o;
    G.flash = { x: s.x, y: s.y, t: now() }; retrace(); return;
  }
  // 3. 多余的元件收回
  for (const p of G.pieces.slice()) if (!p.fixed && (p.t === 'mir' || p.t === 'spl' || p.t === 'gls')) { const s = sol.get(key(p)); if (!s || !same(s, p)) { G.hints++; returnToTray(p); return; } }
}
function resetLevel() { if (G.L) { tick('back'); startLevel(G.L.id); } }

function celebrate() {
  const t = now(), L = G.L;
  G.won = true; G.celT = t; G.sel = -1;
  const st = starsFor(G.ops, L.par);
  G.stars = st;
  const prevStars = starsOf(L.id);
  Save.stars[L.id] = Math.max(prevStars, st);
  G.newLamp = !Save.seen[L.lamp]; Save.seen[L.lamp] = true;
  persist();
  $('#tray').classList.add('won');
  for (const l of SCENE.lamps) setLampOn(l, true, t, 200 + l.rank * (RM ? 8 : 45));
  // 收尾的一串旋律
  [0, 2, 4, 5, 7].forEach((s, k) => pluck(pentaFreq(s + 5), 0.12, 0.3 + k * 0.14));
  for (let k = 0; k < 6; k++) spawnWalker(t, k % 2 ? -1 : 1, { delay: 300 + k * 650 + Math.random() * 300 });
  if (!RM) for (let k = 0; k < 7; k++) launchFirework(t, 600 + k * 520 + Math.random() * 200);
  launchSkyLamps(t + 400, RM ? 4 : L.ch === 2 ? 14 : 8);
  addSparks(...cellC(L.mainXY[0], L.mainXY[1]), 'g', 30, G.cs * 2);
}
function showCard(mode, type) {
  const m = $('#mCard'); m.classList.remove('hidden', 'fade');
  const L = G.L, lt = type || L.lamp, info = LAMPS[lt];
  $('#cName').textContent = info.name;
  $('#cDesc').textContent = info.desc;
  const inGame = mode === 'win';
  $('#cLbl').textContent = inGame ? (G.newLamp ? '灯谱 · 新收一盏' : '灯谱') : '灯谱';
  $('#cWhere').textContent = inGame ? CH_NAME[L.ch] + ' · 第' + NUM[L.i] + '盏 · ' + L.name : '';
  $('#cStars').style.display = inGame ? '' : 'none';
  [...$('#cStars').children].forEach((el, i) => el.classList.toggle('on', i < (G.stars || 0)));
  $('#cMine').textContent = inGame && Save.custom ? '街口还挂着你的灯：「' + Save.custom.name + '」，也一起亮了。' : '';
  $('#cLook').style.display = inGame ? '' : 'none';
  $('#cList').style.display = inGame ? '' : 'none';
  $('#cNext').textContent = inGame ? (L.id + 1 < LEVELS.length ? '下一盏' : '回街口') : '合上';
  CARD.type = lt; CARD.mode = mode; CARD.t0 = now();
  sizeCardCanvas();
}
const CARD = { type: null, mode: null, t0: 0 };
function sizeCardCanvas() {
  const c = $('#cCanvas'), r = c.getBoundingClientRect();
  c.width = Math.max(1, r.width * DPR | 0); c.height = Math.max(1, r.height * DPR | 0);
}
function drawCard(t) {
  if ($('#mCard').classList.contains('hidden')) return;
  const c = $('#cCanvas'), g = c.getContext('2d'), w = c.width / DPR, h = c.height / DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
  const p = clamp((t - CARD.t0) / 900, 0, 1), info = LAMPS[CARD.type];
  const rg = g.createRadialGradient(w / 2, h * 0.5, 0, w / 2, h * 0.5, Math.min(w, h) * 0.5); rg.addColorStop(0, 'rgba(255,160,80,' + 0.18 * p + ')'); rg.addColorStop(1, 'rgba(255,160,80,0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
  const sw = RM ? 0 : Math.sin(t * 0.0012) * 0.04;
  const s = h * 0.56;
  const big = ['round', 'ball', 'gong', 'zouma', 'sha', 'kongming', 'pomelo'].indexOf(CARD.type) >= 0;
  drawLamp(g, CARD.type, w / 2, h * (big ? 0.44 : 0.5), s, easeOut(p), PAL[info.pal], t, { sway: sw, tsway: sw, string: big, stringLen: 1.3, glowR: 1.7, motif: true });
}

/* ================= 屏幕切换 ================= */
let curScreen = 'title';
const TITLE = { t0: 0 };
function showScreen(name) {
  curScreen = name;
  for (const [n, id] of [['title', '#scrTitle'], ['select', '#scrSelect'], ['game', '#scrGame']]) $(id).classList.toggle('hidden', n !== name);
  if (name !== 'game') { G.L = null; }
  if (name === 'title') { TITLE.t0 = now(); if (SCENE.ch !== 0 || !SCENE.cvs) renderScene(0); for (const l of SCENE.lamps) { l.on = false; l.tc = -1e9; } }
  if (name === 'select') { buildSelect(); }
}
let selCh = 0;
function nextOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!starsOf(i)) return i; return 0; }
function isOpen(id) { const i = id % 18; return i === 0 || starsOf(id) > 0 || starsOf(id - 1) > 0; }
function buildSelect() {
  if (SCENE.ch !== selCh || !SCENE.cvs) renderScene(selCh);
  const t = now();
  for (const l of SCENE.lamps) { if (!l.on) setLampOn(l, true, t, l.rank * (RM ? 5 : 25)); }
  let total = 0; for (let i = 0; i < LEVELS.length; i++) if (starsOf(i)) total++;
  $('#selCount').textContent = '已点亮 ' + total + ' / ' + LEVELS.length;
  const tabs = $('#tabs'); tabs.innerHTML = '';
  CH_NAME.forEach((n, ch) => {
    let done = 0; for (let i = 0; i < 18; i++) if (starsOf(ch * 18 + i)) done++;
    const b = document.createElement('button'); b.className = 'tab' + (ch === selCh ? ' on' : '');
    b.innerHTML = '<b>' + n + '</b><span>' + done + ' / 18</span>';
    b.addEventListener('click', () => { auInit(); tick('sel'); selCh = ch; buildSelect(); });
    tabs.appendChild(b);
  });
  $('#chLine').textContent = CH_LINE[selCh];
  const grid = $('#lvGrid'); grid.innerHTML = '';
  let nextMarked = false;
  for (let i = 0; i < 18; i++) {
    const id = selCh * 18 + i, st = starsOf(id), open = isOpen(id);
    const b = document.createElement('button');
    let cls = 'lv' + (st ? ' done' : '') + (open ? '' : ' lock');
    if (open && !st && !nextMarked) { cls += ' next'; nextMarked = true; }
    b.className = cls;
    b.setAttribute('aria-label', CH_NAME[selCh] + '第' + (i + 1) + '盏 ' + LEVELS[id].name);
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="nm">' + LEVELS[id].name + '</span><span class="st">' + [0, 1, 2].map(k => '<i class="' + (k < st ? 'on' : '') + '"></i>').join('') + '</span>';
    b.addEventListener('click', () => { auInit(); if (!open) { tick('back'); b.animate && b.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 260 }); return; } tick('sel'); startLevel(id); });
    grid.appendChild(b);
  }
}
function buildAlbum() {
  const grid = $('#albGrid'); grid.innerHTML = '';
  let n = 0;
  LAMP_ORDER.forEach(type => {
    const got = !!Save.seen[type]; if (got) n++;
    const d = document.createElement('button'); d.className = 'alb' + (got ? '' : ' lock');
    const c = document.createElement('canvas'); d.appendChild(c);
    const s = document.createElement('span'); s.textContent = got ? LAMPS[type].name : '未收'; d.appendChild(s);
    grid.appendChild(d);
    requestAnimationFrame(() => {
      const r = c.getBoundingClientRect(); c.width = Math.max(1, r.width * DPR | 0); c.height = Math.max(1, r.height * DPR | 0);
      const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (!got) g.globalAlpha = 0.35;
      drawLamp(g, type, r.width / 2, r.height * 0.5, r.height * 0.55, got ? 1 : 0, PAL[LAMPS[type].pal], 0, { glowR: 1.3, motif: true });
    });
    d.addEventListener('click', () => { if (!got) return; tick('sel'); $('#mAlbum').classList.add('hidden'); showCard('view', type); CARD.back = 'album'; });
  });
  $('#albCount').textContent = '已收 ' + n + ' / ' + LAMP_ORDER.length + ' 种';
}
const DES = { spec: null, t0: 0 };
function openDesigner() {
  $('#mDesign').classList.remove('hidden');
  DES.spec = Save.custom ? Object.assign({}, Save.custom) : null;
  $('#dInput').value = Save.custom ? Save.custom.text : '';
  $('#dName').textContent = Save.custom ? Save.custom.name : '你的灯';
  $('#dRemove').style.display = Save.custom ? '' : 'none';
  DES.t0 = now();
  const c = $('#dCanvas'), r = c.getBoundingClientRect(); c.width = Math.max(1, r.width * DPR | 0); c.height = Math.max(1, r.height * DPR | 0);
}
function drawDesigner(t) {
  if ($('#mDesign').classList.contains('hidden')) return;
  const c = $('#dCanvas'), g = c.getContext('2d'), w = c.width / DPR, h = c.height / DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
  const sp = DES.spec, p = sp ? easeOut(clamp((t - DES.t0) / 800, 0, 1)) : 0;
  const sw = RM ? 0 : Math.sin(t * 0.0012) * 0.04;
  if (sp) drawLamp(g, sp.type, w / 2, h * 0.47, h * 0.52, p, specPal(sp), t, { pattern: sp.pattern, sway: sw, tsway: sw, string: true, glowR: 1.7, motif: true });
  else { g.globalAlpha = 0.5; drawLamp(g, 'round', w / 2, h * 0.47, h * 0.52, 0, PAL.cream, t, { string: true }); g.globalAlpha = 1; }
}

/* ================= 主循环 ================= */
function resize() {
  VW = innerWidth; VH = innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  const keep = SCENE.lamps.map(l => [l.on, l.tc]);
  renderScene(curScreen === 'select' ? selCh : G.L ? G.L.ch : SCENE.ch);
  SCENE.lamps.forEach((l, i) => { if (keep[i]) { l.on = keep[i][0]; l.tc = keep[i][1]; } });
  if (G.L) { buildTools(); computeBoard(); }
  if (!$('#mCard').classList.contains('hidden')) sizeCardCanvas();
}
function frame() {
  const t = now();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(SCENE.cvs, 0, 0, VW, VH);
  if (curScreen === 'title') {
    // 一盏灯被点亮，光沿街一盏盏传开
    const el = t - TITLE.t0;
    for (const l of SCENE.lamps) { const at = (RM ? 200 : 700) + l.rank * (RM ? 10 : 95); if (el >= at && !l.on) setLampOn(l, true, t); }
    if (t > FX.nextWalker && !RM) { spawnWalker(t, Math.random() < 0.5 ? 1 : -1); FX.nextWalker = t + 3500 + Math.random() * 3000; }
  }
  drawSceneLamps(ctx, t, Save.custom);
  if (curScreen === 'title' && !RM) { // 传光的火星
    const el = t - TITLE.t0, ls = SCENE.lamps;
    for (let i = 1; i < ls.length; i++) {
      const at = 700 + i * 95, k = (el - (at - 95)) / 95;
      if (k > 0 && k < 1) { const a = ls[i - 1], b = ls[i]; glow(ctx, lerp(a.x, b.x, k), lerp(a.y, b.y, k) - Math.sin(k * Math.PI) * 20, 12, 'g', 0.9); }
    }
  }
  if (curScreen === 'game' && G.L) {
    ctx.fillStyle = 'rgba(14,3,8,.38)'; ctx.fillRect(0, 0, VW, VH);
    drawBoard(ctx, t);
    // 一盏一盏亮起时的音
    if (!G.won) {
      for (const p of G.pieces) if (p.t === 'lan' && p._lit && !p._sounded && t >= p._litAt) {
        p._sounded = true;
        if (t - G.lastLight > 1600) G.burst = 0;
        pluck(pentaFreq(MELODY[G.burst % MELODY.length] + (G.burst >= MELODY.length ? 2 : 0)), 0.2);
        G.burst++; G.lastLight = t;
        addSparks(...cellC(p.x, p.y), p.main ? 'g' : p.c, 14, G.cs * 0.9);
      }
      if (G.T && G.T.allLit && t >= G.winReadyAt && !G.drag) celebrate();
    } else if (!G.cardShown && t - G.celT > (RM ? 1500 : 3600)) { G.cardShown = true; showCard('win'); }
  }
  drawSparks(ctx, t);
  drawSkyLamps(ctx, t);
  drawFireworks(ctx, t);
  drawWalkers(ctx, t);
  drawCard(t);
  drawDesigner(t);
  requestAnimationFrame(frame);
}

/* ================= 事件 ================= */
cv.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, { passive: true });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', () => { G.drag = null; });
document.addEventListener('pointerdown', () => auInit(), { once: false, capture: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { for (const id of ['#mAlbum', '#mDesign']) $(id).classList.add('hidden'); } });
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });
$('#mute').addEventListener('click', () => { auInit(); setMute(!AU.muted); });
$('#btnStart').addEventListener('click', () => {
  auInit(); pluck(pentaFreq(0), 0.2); pluck(pentaFreq(2), 0.16, 0.12); pluck(pentaFreq(4), 0.14, 0.24);
  selCh = Math.floor(nextOpenLevel() / 18); showScreen('select');
});
$('#selBack').addEventListener('click', () => { tick('back'); showScreen('title'); });
$('#gBack').addEventListener('click', () => { tick('back'); const ch = G.L ? G.L.ch : 0; selCh = ch; showScreen('select'); });
$('#gHint').addEventListener('click', doHint);
$('#gReset').addEventListener('click', resetLevel);
$('#aCard').addEventListener('click', () => { tick('sel'); showCard('win'); });
const goNext = () => { const id = G.L ? G.L.id + 1 : 0; $('#mCard').classList.add('hidden'); if (id < LEVELS.length) startLevel(id); else { selCh = 2; showScreen('select'); } };
$('#aNext').addEventListener('click', () => { tick('sel'); goNext(); });
$('#cNext').addEventListener('click', () => {
  tick('sel');
  if (CARD.mode === 'win') goNext();
  else { $('#mCard').classList.add('hidden'); if (CARD.back === 'album') { CARD.back = null; $('#mAlbum').classList.remove('hidden'); } }
});
$('#cLook').addEventListener('click', () => { tick('sel'); $('#mCard').classList.add('hidden'); });
$('#cList').addEventListener('click', () => { tick('back'); $('#mCard').classList.add('hidden'); selCh = G.L ? G.L.ch : 0; showScreen('select'); });
$('#btnAlbum').addEventListener('click', () => { tick('sel'); $('#mAlbum').classList.remove('hidden'); buildAlbum(); });
$('#albClose').addEventListener('click', () => { tick('back'); $('#mAlbum').classList.add('hidden'); });
$('#mAlbum').addEventListener('click', e => { if (e.target.id === 'mAlbum') $('#mAlbum').classList.add('hidden'); });
$('#btnDesign').addEventListener('click', () => { tick('sel'); openDesigner(); });
$('#dClose').addEventListener('click', () => { tick('back'); $('#mDesign').classList.add('hidden'); });
$('#dMake').addEventListener('click', () => {
  const text = $('#dInput').value.trim();
  if (!text) { $('#dInput').focus(); $('#dInput').placeholder = '先写一句话，比如：粉色的荷花，带梅枝'; return; }
  LanternDesigner.design(text).then(spec => {
    DES.spec = spec; DES.t0 = now();
    Save.custom = spec; persist();
    $('#dName').textContent = spec.name; $('#dRemove').style.display = '';
    [0, 2, 4, 7].forEach((s, k) => pluck(pentaFreq(s + 2), 0.14, k * 0.1));
  });
});
$('#dInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#dMake').click(); });
$('#dRemove').addEventListener('click', () => { Save.custom = null; persist(); DES.spec = null; $('#dName').textContent = '你的灯'; $('#dInput').value = ''; $('#dRemove').style.display = 'none'; tick('back'); });
window.addEventListener('resize', resize);

$('#mute').classList.toggle('muted', AU.muted);
resize();
showScreen('title');
requestAnimationFrame(frame);
</script>
