<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>中国色 · 调色铺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F3EDE0; --paper-hi:#FAF6EC; --paper-lo:#E9E1CF;
  --ink:#2A231E; --ink2:#463D35; --ink3:#6B6157;
  --zhu:#C23B2E; --zhu-d:#9C2D23; --line:rgba(80,60,40,.16); --gold:#B4924A;
  --f-brush:"Ma Shan Zheng","ZCOOL XiaoWei","STXingkai","STKaiti","KaiTi",serif;
  --f-title:"ZCOOL XiaoWei","Ma Shan Zheng","STKaiti","KaiTi",serif;
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"Noto Sans SC",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --st: env(safe-area-inset-top,0px); --sb: env(safe-area-inset-bottom,0px);
  --lightA: rgba(255,240,232,.55); --lightB: rgba(255,248,236,.32);
  --wx: 20%; --wy: 15%;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#F6F2E8;}
body{color:var(--ink);font-family:var(--f-serif);background-color:#F6F2E8;background-size:512px 512px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid rgba(194,59,46,.55);outline-offset:2px}
#light{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(ellipse 55% 60% at var(--wx) var(--wy), var(--lightA), rgba(255,255,255,0) 72%),
   linear-gradient(122deg, rgba(255,255,255,0) 18%, var(--lightB) 36%, rgba(255,255,255,0) 52%, rgba(255,255,255,0) 60%, var(--lightB) 68%, rgba(255,255,255,0) 80%),
   radial-gradient(ellipse 90% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(110,85,55,.05) 100%);
  transition: background .8s}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex;animation:scrIn .5s ease both}
@keyframes scrIn{from{opacity:.35}to{opacity:1}}
#muteBtn{position:fixed;top:calc(var(--st) + 8px);right:10px;z-index:50;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:rgba(252,249,242,.7);border:1px solid var(--line)}
#muteBtn .x{display:none}
#muteBtn.muted .x{display:inline}
#muteBtn.muted .wave{display:none}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center}
#titleCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ti-center{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;pointer-events:none}
.ti-main{margin:0;font-family:var(--f-brush);font-weight:400;font-size:clamp(64px,18vw,156px);letter-spacing:.06em;color:#3A2A22;
  text-shadow:0 1px 0 rgba(120,25,15,.10);transition:color 1s ease,text-shadow 1s ease;line-height:1;animation:tiIn 1.2s ease both}
.ti-main.onred{color:#FBF5EA;text-shadow:0 1px 0 rgba(120,25,15,.22),0 0 18px rgba(150,30,20,.2)}
@keyframes tiIn{from{opacity:.6;transform:scale(.97)}to{opacity:1;transform:none}}
.ti-bottom{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 7vh);display:flex;flex-direction:column;align-items:center;gap:14px}
.ti-sub{font-family:var(--f-title);font-size:clamp(22px,6vw,34px);letter-spacing:.9em;padding-left:.9em;color:var(--ink);animation:tiIn 1.2s ease both;display:flex;align-items:center;gap:10px}
.ti-sub i{display:inline-block;width:26px;height:26px;background-size:cover;margin-left:-.4em}
.ti-start{font-family:var(--f-brush);font-size:28px;letter-spacing:.4em;padding:10px 26px 10px calc(26px + .4em);color:#FBF5EA;background:var(--zhu);border-radius:3px;
  box-shadow:0 0 0 3px rgba(194,59,46,.18),0 6px 16px rgba(150,40,25,.25);animation:tiIn 1.2s ease both;transition:transform .2s}
.ti-start:active{transform:scale(.97)}
.ti-links{display:flex;gap:10px;align-items:center;color:var(--ink2);font-size:15px}
.ti-links button{padding:6px 8px;color:var(--ink2);letter-spacing:.2em}
.ti-note{margin:0;font-size:12px;color:var(--ink2);letter-spacing:.3em}

/* ---------- game ---------- */
#game{padding:calc(var(--st) + 6px) 14px calc(var(--sb) + 10px)}
.topbar{display:flex;align-items:center;gap:8px;height:42px;flex:none;padding-right:44px}
.tb-btn{height:34px;padding:0 13px;border-radius:17px;font-size:14px;color:var(--ink2);border:1px solid var(--line);background:rgba(252,249,242,.6);letter-spacing:.12em;white-space:nowrap}
.tb-title{flex:1;text-align:center;font-family:var(--f-title);font-size:17px;letter-spacing:.25em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.left{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.win-slot{grid-row:1;grid-column:1;width:clamp(92px,29vw,140px);aspect-ratio:1/1;position:relative}
.win-slot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.target{grid-row:1;grid-column:2;display:flex;gap:12px;align-items:center;min-width:0}
.tg-card{flex:none;width:52px;height:74px;background:#FCF9F2;padding:4px 4px 13px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 5px 12px rgba(90,70,40,.14);transform:rotate(-1.5deg);position:relative;margin:4px 2px}
.tg-card::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--zhu);opacity:.75}
.tg-chip{width:100%;height:100%;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.tg-text{min-width:0;flex:1;position:relative;z-index:1}
.tg-lv{font-size:12px;color:var(--ink3);letter-spacing:.2em}
.tg-name{font-family:var(--f-brush);font-size:clamp(26px,7.6vw,42px);line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-quote{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:1px}
.tg-src{font-size:11px;color:var(--ink3);margin-top:1px}
.hintline{font-size:12px;color:var(--zhu-d);margin-top:4px;line-height:1.45;display:none}
.hintline.on{display:block}
.meter{grid-row:2;grid-column:1/3;display:flex;align-items:center;gap:10px;padding:4px 2px 0}
.mt-cmp{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;display:flex;box-shadow:0 0 0 2px #FCF9F2,0 2px 6px rgba(80,60,40,.2)}
.mt-cmp span{flex:1}
.mt-bar{position:relative;flex:1;height:22px}
.mt-track,.mt-fill{position:absolute;left:0;right:0;top:4px;height:14px;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.mt-track{background:rgba(70,55,40,.14)}
.mt-fill{background:var(--fillc,#8B8178);clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);transition:clip-path .45s ease,background-color .45s}
.mt-tick{position:absolute;top:-1px;bottom:-1px;width:1px;background:rgba(60,45,30,.35)}
.mt-tick b{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-weight:400;font-size:11.5px;color:var(--ink2);font-family:var(--f-title)}
.mt-tick.on b{color:var(--zhu)}
.mt-num{flex:none;min-width:58px;text-align:right;line-height:1}
.mt-num span{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}
.mt-num small{display:block;font-size:11px;color:var(--ink2);letter-spacing:.2em;margin-top:3px}
.mt-seal{flex:none;width:34px;height:34px;background-size:cover;opacity:.18;filter:grayscale(1);transition:opacity .5s,filter .5s,transform .3s;transform:rotate(4deg)}
.right{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.dish-wrap{flex:1;min-height:170px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#dish{display:block;touch-action:none;cursor:grab}
#dish:active{cursor:grabbing}
.dish-tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--ink2);font-size:13px;letter-spacing:.2em;pointer-events:none;transition:opacity .5s;line-height:1.9}
.dish-tip.off{opacity:0}
.dish-stat{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12.5px;color:var(--ink2);letter-spacing:.12em;pointer-events:none;font-family:var(--f-sans)}
.dish-stat b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.stir-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:var(--ink2);font-size:13px;letter-spacing:.3em;opacity:0;transition:opacity .6s}
.stir-hint.on{opacity:1}
.say{position:absolute;left:50%;top:0;transform:translate(-50%,-6px);max-width:min(92%,420px);padding:9px 14px;background:#FCF9F2;border:1px solid var(--line);box-shadow:0 6px 18px rgba(90,70,40,.14);
  font-size:13.5px;line-height:1.55;color:var(--ink);border-radius:3px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:5;text-align:center}
.say.on{opacity:1;transform:translate(-50%,2px)}
.jars{flex:none;display:flex;justify-content:center;gap:4px;padding:0 2px}
.jar{position:relative;display:flex;flex-direction:column;align-items:center;touch-action:none;border-radius:6px;padding:0 0 2px}
.jar canvas{display:block;pointer-events:none}
.jar .jn{font-size:12px;color:var(--ink2);letter-spacing:.1em;margin-top:-2px;font-family:var(--f-serif)}
.jar .jc{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--zhu);color:#fff;font-size:11px;line-height:18px;text-align:center;font-family:var(--f-sans);padding:0 4px;transform:scale(0);transition:transform .2s}
.jar .jc.on{transform:scale(1)}
.jar.new::after{content:"新";position:absolute;top:0;left:2px;font-size:10px;color:var(--zhu);border:1px solid var(--zhu);border-radius:2px;padding:0 2px;line-height:13px;background:#FCF9F2}
.actions{flex:none;display:flex;gap:10px;justify-content:center;padding-top:2px}
.act{min-width:84px;height:44px;padding:0 16px;border-radius:3px;font-size:16px;letter-spacing:.35em;padding-left:calc(16px + .35em);border:1px solid rgba(80,60,40,.28);background:rgba(252,249,242,.75);color:var(--ink);font-family:var(--f-title)}
.act.primary{background:var(--zhu);border-color:var(--zhu);color:#FBF5EA;box-shadow:0 4px 12px rgba(160,45,30,.22)}
.act.primary.ready{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 12px rgba(160,45,30,.22)}50%{box-shadow:0 4px 22px rgba(194,59,46,.5)}}
.act:active{transform:translateY(1px)}
.flybrush{position:fixed;left:0;top:0;width:30px;height:120px;z-index:40;pointer-events:none;transform-origin:15px 118px;will-change:transform}

@media (min-width:860px) and (min-aspect-ratio:1/1){
  #game{padding:calc(var(--st) + 14px) 28px 20px}
  .stage{flex-direction:row;gap:clamp(20px,4vw,60px);padding:0 2vw}
  .left{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:clamp(280px,30vw,390px);gap:22px}
  .win-slot{width:min(100%,36vh,310px);align-self:center}
  .target{gap:18px}
  .tg-card{width:74px;height:104px;padding:6px 6px 18px}
  .tg-name{font-size:54px}
  .tg-quote{font-size:15px}
  .tg-src{font-size:12.5px}
  .hintline{font-size:13.5px}
  .meter{padding-top:12px}
  .dish-wrap{min-height:300px}
  .act{min-width:110px;height:48px;font-size:18px}
}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s linear .45s}
.overlay.on{opacity:1;visibility:visible;transition:opacity .45s}
#book{background:rgba(243,237,224,.97);align-items:stretch}
.book-inner{position:relative;width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 10px) 34px}
.book-inner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:
  repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 46px, rgba(60,45,30,.55) 46px 49px, rgba(0,0,0,0) 49px 92px),
  linear-gradient(90deg,#3D4A5C,#2E3949);box-shadow:2px 0 6px rgba(0,0,0,.15)}
.book-inner::after{content:"";position:absolute;left:22px;top:0;bottom:0;width:1px;background:rgba(80,60,40,.25)}
.book-head{display:flex;align-items:center;gap:12px;height:48px;flex:none;padding-right:44px}
.book-head h2{margin:0;font-family:var(--f-brush);font-weight:400;font-size:30px;letter-spacing:.2em}
.book-head .sub{flex:1;font-size:13px;color:var(--ink3);letter-spacing:.15em}
.book-tabs{display:flex;gap:8px;flex:none;padding:6px 0 10px}
.book-tabs button{flex:1;max-width:140px;height:40px;border:1px solid var(--line);border-radius:3px;font-family:var(--f-title);font-size:17px;letter-spacing:.2em;color:var(--ink2);background:rgba(252,249,242,.6)}
.book-tabs button small{font-family:var(--f-sans);font-size:11px;letter-spacing:0;color:var(--ink3);margin-left:4px}
.book-tabs button.on{background:var(--zhu);border-color:var(--zhu);color:#FBF5EA}
.book-tabs button.on small{color:rgba(255,255,255,.8)}
.book-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 2px 30px}
.ch-line{font-size:13px;color:var(--ink2);margin:2px 0 12px;letter-spacing:.1em}
.ch-line cite{font-style:normal;color:var(--ink3);margin-left:6px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:3/4.2;background:#FBF8F0;border:1px solid var(--line);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 4px;overflow:hidden;text-align:center}
.tile .no{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.tile .nm{font-family:var(--f-brush);font-size:17px;line-height:1.1;writing-mode:vertical-rl;letter-spacing:.08em;max-height:70%}
.tile .sw{position:absolute;inset:0}
.tile.done .nm,.tile.done .no{position:relative;z-index:1}
.tile .st{position:relative;z-index:1;display:flex;gap:2px}
.tile .st i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.15)}
.tile .st i.on{background:var(--zhu)}
.tile.lock{opacity:.45}
.tile.lock .nm{color:var(--ink3)}
.tile.cur{box-shadow:0 0 0 2px var(--zhu)}
.ctile{aspect-ratio:3/4.4;border-radius:2px;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-end;padding:6px}
.ctile.empty{border:1px dashed rgba(80,60,40,.25);align-items:center;justify-content:center;color:var(--ink3);font-size:12px}
.ctile .nm{font-family:var(--f-brush);font-size:16px;writing-mode:vertical-rl;letter-spacing:.06em;position:relative;z-index:1}
.ctile .fx{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.06));}
.sec-h{font-family:var(--f-brush);font-size:24px;margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec-h small{font-family:var(--f-serif);font-size:12px;color:var(--ink3)}

#result{background:rgba(243,237,224,.86);flex-direction:column;gap:14px;padding:16px}
.card{position:relative;width:min(300px,76vw,52vh);aspect-ratio:3/4.15;perspective:1200px;cursor:pointer;flex:none}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,.1,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;overflow:hidden;box-shadow:0 14px 36px rgba(80,60,40,.22),0 2px 0 rgba(0,0,0,.04)}
.face.front canvas{width:100%;height:100%;display:block}
.face.back{transform:rotateY(180deg);background:#FBF7EE}
.stamp{position:absolute;right:9%;bottom:7%;width:22%;aspect-ratio:1;background-size:cover;opacity:0;transform:scale(1.8) rotate(-8deg)}
.stamp.on{animation:stampIn .42s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:scale(1.9) rotate(-10deg)}60%{opacity:1;transform:scale(.94) rotate(-5deg)}100%{opacity:.95;transform:scale(1) rotate(-6deg)}}
.rs-tip{font-size:12px;color:var(--ink3);letter-spacing:.3em}
.rs-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rs-actions .act{min-width:92px}
.cb{position:absolute;inset:0;display:flex;padding:7% 7% 6%;gap:6%;background:
   linear-gradient(90deg,rgba(0,0,0,0) 0 calc(100% - 1px),rgba(0,0,0,0) 0) ,#FBF7EE}
.cb-side{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-right:1px solid var(--line);padding-right:6%}
.cb-name{font-family:var(--f-brush);writing-mode:vertical-rl;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:.08em}
.cb-no{writing-mode:vertical-rl;font-size:11px;color:var(--ink3);letter-spacing:.3em}
.cb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2)}
.cb-cmp{display:flex;align-items:center;gap:6px}
.cb-cmp .sw{width:34px;height:34px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cb-cmp em{font-style:normal;font-size:11px;color:var(--ink3);margin-right:4px;writing-mode:vertical-rl;letter-spacing:.2em}
.cb-vals{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0;font-family:var(--f-mono);font-size:11.5px}
.cb-vals dt{color:var(--ink3)}
.cb-vals dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.cb-grade{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cb-grade b{font-family:var(--f-brush);font-weight:400;font-size:20px;color:var(--zhu)}
.cb-grade .dots{display:flex;gap:3px}
.cb-grade .dots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.12)}
.cb-grade .dots i.on{background:var(--zhu)}
.cb-grade small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.cb-q{margin:2px 0 0;font-size:13px;color:var(--ink);line-height:1.65}
.cb-src{font-size:11px;color:var(--ink3)}
.cb-rec{margin-top:auto;font-size:11px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:6px;line-height:1.5}
#detail{background:rgba(243,237,224,.88);flex-direction:column;gap:16px}
#detail .card{cursor:default}
#chap{background:rgba(246,241,231,.97);flex-direction:column;gap:18px;text-align:center;cursor:pointer}
#chap .big{font-family:var(--f-brush);font-size:clamp(120px,34vw,220px);line-height:1;color:var(--ink);opacity:.9}
#chap .nm{font-family:var(--f-title);font-size:20px;letter-spacing:.5em;color:var(--ink2)}
#chap .ln{font-size:15px;color:var(--ink);letter-spacing:.2em;line-height:1.8;padding:0 20px}
#chap .by{font-size:12px;color:var(--ink3);letter-spacing:.1em}
#chap .tap{font-size:12px;color:var(--ink3);letter-spacing:.3em;margin-top:18px}
.closeBtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px;color:var(--ink2);background:rgba(252,249,242,.7);line-height:1}
.toast{position:fixed;left:50%;top:calc(var(--st) + 54px);transform:translate(-50%,-12px);z-index:60;background:#2F2925;color:#F6EFE2;padding:10px 16px;border-radius:3px;font-size:13px;line-height:1.55;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;max-width:min(90vw,420px);text-align:center}

(function bindDish(){
  let st=null;
  D.cv.addEventListener('pointerdown',function(e){
    if(G.locked)return;e.preventDefault();try{D.cv.setPointerCapture(e.pointerId);}catch(_){}
    const p=clientToDish(e.clientX,e.clientY);st={id:e.pointerId,x:p[0],y:p[1],t:performance.now()};
  });

      let x=p[0],y=p[1];const dx=x-D.cx,dy=y-D.cy,d=Math.hypot(dx,dy);if(d>D.Rb*0.97){x=D.cx+dx/d*D.Rb*0.97;y=D.cy+dy/d*D.Rb*0.97;}

})();

function drawCardFront(cv,hex,seed){

  const rgb=hexToRgb(hex).map(function(v){return Math.round(v*255);});const dk=rgb.map(function(v){return Math.round(v*0.72);});

  for(let i=0;i<16;i++){const x=x0+rng()*(x1-x0),y=y0+rng()*(y1-y0),rr=20+rng()*90,light=rng()<0.5;const gr=g.createRadialGradient(x,y,0,x,y,rr);
    gr.addColorStop(0,light?'rgba(255,255,255,'+(0.05+rng()*0.06)+')':rgba(dk,0.05+rng()*0.06));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-rr,y-rr,rr*2,rr*2);}

  g.fillStyle='rgba(90,70,50,.55)';g.font='11px "Noto Serif SC",serif';g.textAlign='left';g.fillText('中国色 · 调色铺',m,h-m*0.35);
}

  const N=96,c=(N-1)/2;
  const D3=[[c,c,1.0,{dur:80,r0:3,r1:N*0.16,push:0.9,jets:8,jet:1.4}],[c-N*0.2,c+N*0.02,0.42,{dur:60,r0:2,r1:N*0.1,push:0.7,jets:6,jet:1.2}],[c+N*0.21,c-N*0.03,0.42,{dur:60,r0:2,r1:N*0.1,push:0.7,jets:6,jet:1.2}],[c+N*0.02,c+N*0.1,0.25,{dur:50,r0:2,r1:N*0.08,push:0.6,jets:5,jet:1}]];
  D3.forEach(function(d,k){if(all||which===k)T.fl.addDrop(d[0],d[1],0,d[2],d[3]);});
}
function showTitleText(){if(T.shown)return;T.shown=true;$('tiMain').classList.add('onred');}
function titleTick(){
  const now=performance.now(),el=(now-T.t0)/1000,g=T.ctx;
  // 按真实时间推进模拟（掉帧时追帧），整段开场在约 2.5 秒内完成
  const target=Math.floor(el*60);let n=0;const cap=el>2.2?400:40;
  while(T.steps<target&&n<cap){
    const st=T.steps/60;
    for(let k=0;k<4;k++){if(!T.d[k]&&st>=T_SCHED[k]){T.d[k]=true;titleDrops(false,k);const N=96,c=(N-1)/2;
      const pos=[[c,c],[c-N*0.2,c+N*0.02],[c+N*0.21,c-N*0.03],[c+N*0.02,c+N*0.1]][k];
      T.rip.push({x:T.ox+(pos[0]+0.5)/N*T.L,y:T.oy+(pos[1]+0.5)/N*T.L,t:now,r:k?40:90});}}
    if(st>=0.85)showTitleText();
    T.fl.step();T.steps++;n++;
    if(T.steps>150&&target-T.steps>2){T.steps=target;break;}
  }
  g.setTransform(T.dpr,0,0,T.dpr,0,0);g.clearRect(0,0,T.w,T.h);
  renderFluid(T.fl,T.img,96*96*0.2,2.6);T.offCtx.putImageData(T.img,0,0);
  g.imageSmoothingEnabled=true;try{g.imageSmoothingQuality='high';}catch(e){}
  g.drawImage(T.off,T.ox,T.oy,T.L,T.L);
  for(let i=T.rip.length-1;i>=0;i--){const r=T.rip[i],t=(now-r.t)/1600;if(t>=1){T.rip.splice(i,1);continue;}
    g.strokeStyle='rgba(150,110,80,'+(0.22*(1-t))+')';g.lineWidth=1;g.beginPath();g.ellipse(r.x,r.y,8+t*r.r*1.6,(8+t*r.r*1.6)*0.96,0,0,TAU);g.stroke();}
  if(!reduced&&!T.d[0]&&el<T_SCHED[0]){const t=el/T_SCHED[0],e=t*t;const x=T.w/2,y0=-20,y1=T.oy+T.L/2,y=y0+(y1-y0)*e;const st=1+e*1.4;
    g.fillStyle='#D63A2C';g.beginPath();g.moveTo(x,y-9*st);g.quadraticCurveTo(x+5.5,y,x,y+4.5);g.quadraticCurveTo(x-5.5,y,x,y-9*st);g.fill();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(x-1.5,y-1,1.3,0,TAU);g.fill();}
}
(function bindTitle(){
  let st=null;
  T.cv.addEventListener('pointerdown',function(e){st={id:e.pointerId,x:e.clientX,y:e.clientY};try{T.cv.setPointerCapture(e.pointerId);}catch(_){}});
  T.cv.addEventListener('pointermove',function(e){if(!st||st.id!==e.pointerId)return;const k=96/T.L;
    T.fl.stir((st.x-T.ox)*k-0.5,(st.y-T.oy)*k-0.5,(e.clientX-T.ox)*k-0.5,(e.clientY-T.oy)*k-0.5);st.x=e.clientX;st.y=e.clientY;});
  const end=function(e){if(st&&st.id===e.pointerId)st=null;};T.cv.addEventListener('pointerup',end);T.cv.addEventListener('pointercancel',end);
})();

// ---------------- 主循环 ----------------
function frame(now){
  requestAnimationFrame(frame);
  if(G.screen==='title'){titleTick();return;}
  if(G.screen!=='game'||$('book').classList.contains('on'))return;
  const fl=G.fluid;
  if(G.washing>0){G.washing--;fl.fade(0.86);if(G.washing===0){fl.clear();G.unif=1;updateDishStat();$('dishTip').classList.remove('off');}}
  fl.step();
  G.frame++;
  if(G.frame%8===0){const u=fl.emitters.length?Math.min(fl.uniformity(),0.5):fl.uniformity();G.unif=G.total===0?1:u;updateDishStat();}
  drawDish(now);
  if(G.frame%2===0)drawWindow(now);
  G.stirSpeed*=0.9;AudioFX.stir(G.stirSpeed);
}
let rzT=0;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){titleLayout();if(G.screen==='game')layoutGame();},120);});
titleInit();
requestAnimationFrame(frame);
})();
</script>
