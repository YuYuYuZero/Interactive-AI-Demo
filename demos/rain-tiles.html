<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雨落青瓦</title>
<meta name="description" content="雨落青瓦 —— 转动瓦槽，把一场雨引到花圃和水缸里。二十四节气，七十二候，七十二关。">
<meta name="theme-color" content="#263130">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#263130;
  --ink:#151c1b;
  --paper:#e9ece6;
  --paper2:#c9d1cc;
  --dim:#94a29d;
  --faint:#5f6d69;
  --line:rgba(225,233,228,.14);
  --panel:rgba(22,30,29,.78);
  --accent:#e7a0ad;
  --seal:#b5432f;
  --brush:"Ma Shan Zheng","Zhi Mang Xing","STXingkai","Xingkai SC","KaiTi","Kaiti SC","STKaiti",serif;
  --wild:"Zhi Mang Xing","Ma Shan Zheng","STXingkai","KaiTi","Kaiti SC",serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--paper);overflow:hidden;font-family:var(--serif);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#probe{position:absolute;visibility:hidden;pointer-events:none;padding-top:var(--st);padding-bottom:var(--sb)}

/* ---------- mute ---------- */
#mute{position:fixed;top:calc(var(--st) + 8px);right:10px;z-index:50;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(18,25,24,.55);display:grid;place-items:center;padding:0;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#mute svg{width:22px;height:22px;stroke:var(--paper2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:block}

/* ---------- title ---------- */
#title{position:absolute;inset:0;z-index:10;pointer-events:none}
#title .gate{position:absolute;left:0;right:0;text-align:center;transform:translateY(-50%)}
#title h1{margin:0;font-family:var(--brush);font-weight:400;font-size:clamp(58px,17vw,116px);line-height:1.05;letter-spacing:.06em;
  color:#eef1ea;text-shadow:0 2px 18px rgba(10,16,15,.55),0 0 2px rgba(10,16,15,.4)}
#title .sub{margin:.7em 0 0;font-size:clamp(13px,3.6vw,16px);letter-spacing:.22em;color:#d3dbd5;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#title .seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.55em;height:2.7em;margin-left:.35em;vertical-align:.6em;border:2px solid #c8573f;color:#d8684d;font-family:var(--brush);font-size:clamp(15px,3.8vw,20px);line-height:1.12;border-radius:3px;transform:rotate(-4deg);background:rgba(181,67,47,.12);letter-spacing:0;text-shadow:none}
#title .acts{position:absolute;left:0;right:0;display:flex;gap:14px;justify-content:center;pointer-events:auto}
.btn{min-height:48px;min-width:120px;padding:0 26px;border-radius:999px;border:1px solid rgba(235,240,234,.38);
  background:linear-gradient(180deg,rgba(54,68,66,.82),rgba(26,34,33,.9));color:#f1f3ee;font-size:17px;letter-spacing:.3em;
  box-shadow:0 6px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:transform .15s ease, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{font-family:var(--brush);font-size:24px;letter-spacing:.4em;padding:0 22px 0 32px;min-width:150px;
  background:linear-gradient(180deg,rgba(84,104,99,.9),rgba(38,52,50,.94));border-color:rgba(240,244,238,.55)}
.btn.ghost{background:rgba(20,27,26,.55)}
#title .foot{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 18px);text-align:center;font-size:12px;letter-spacing:.35em;color:rgba(214,222,217,.66)}

/* ---------- select ---------- */
#select{position:absolute;inset:0;z-index:12;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#select .wrap{max-width:980px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 40px)}
#select header{display:flex;align-items:center;gap:10px;padding-right:52px;min-height:48px}
#select h2{margin:0;font-family:var(--brush);font-weight:400;font-size:34px;letter-spacing:.12em;color:#eef1ea}
#select .prog{margin-left:auto;font-size:13px;color:var(--dim);letter-spacing:.12em;white-space:nowrap}
.iconbtn{min-width:44px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(18,25,24,.55);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 12px;font-size:14px;letter-spacing:.1em;color:var(--paper2)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#daily{margin:14px 0 6px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:12px;min-height:72px;
  border:1px solid rgba(235,240,234,.2);background:linear-gradient(110deg,rgba(60,76,72,.86),rgba(26,34,33,.86));color:var(--paper)}
#daily .dk{font-family:var(--brush);font-size:30px;line-height:1;color:#f2f1e8;min-width:2.2em}
#daily .dt{flex:1;min-width:0}
#daily .dt b{display:block;font-weight:600;font-size:15px;letter-spacing:.12em}
#daily .dt span{display:block;font-size:12.5px;color:var(--dim);margin-top:4px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#daily .go{font-size:13px;letter-spacing:.2em;color:var(--paper2);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 14px;position:sticky;top:0;z-index:2;padding:6px 0;
  background:linear-gradient(180deg,rgba(30,39,38,.92),rgba(30,39,38,.7));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px}
.tab{min-height:48px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.tab .tz{font-family:var(--brush);font-size:26px;line-height:1}
.tab .tw{font-size:12px;letter-spacing:.15em}
.tab.on{color:#f3f3ec;border-color:rgba(235,240,234,.28);background:rgba(255,255,255,.06)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.terms{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.term{border-radius:12px;padding:12px 10px 8px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(46,58,56,.86),rgba(22,29,28,.9));position:relative;overflow:hidden}
.term::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0,transparent 62%);opacity:.18;pointer-events:none}
.term .tn{font-family:var(--brush);font-size:30px;line-height:1.1;color:#eff0e8;padding-left:4px}
.term .td{font-size:11.5px;color:var(--dim);letter-spacing:.1em;margin:2px 0 8px 4px}
.lv{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;margin:0 0 4px;padding:6px 8px;border-radius:8px;border:1px solid rgba(230,236,232,.08);
  background:rgba(255,255,255,.035);text-align:left;color:var(--paper)}
.lv:active{background:rgba(255,255,255,.08)}
.lv .lk{font-size:11px;color:var(--dim);letter-spacing:.05em;white-space:nowrap}
.lv .lh{flex:1;min-width:0;font-size:13.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .ls{display:flex;gap:3px}
.lv .ls i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(230,236,232,.35)}
.lv .ls i.f{background:var(--c);border-color:var(--c);box-shadow:0 0 6px var(--c)}
.lv:disabled{opacity:.42;cursor:default}
.lv:disabled .lh{color:var(--dim)}
.lv.cur{border-color:rgba(235,240,234,.35);background:rgba(255,255,255,.07)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:8;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 62px 0 10px;display:flex;align-items:flex-start;gap:10px}
#hud .top .iconbtn{pointer-events:auto;flex:none}
#hud .ttl{flex:1;min-width:0;text-align:center;padding-top:2px}
#hud .ttl b{display:block;font-family:var(--brush);font-weight:400;font-size:24px;line-height:1.15;letter-spacing:.1em;color:#f0f1ea;text-shadow:0 1px 8px rgba(0,0,0,.5)}
#hud .ttl span{display:block;font-size:12px;color:#c3ccc7;letter-spacing:.14em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#hud .bot{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(var(--sb) + 10px);display:flex;align-items:center;gap:10px;justify-content:center}
#hud .bot .iconbtn{pointer-events:auto}
#hud .mv{font-size:13px;letter-spacing:.14em;color:#d3dad5;min-width:9em;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7);
  padding:8px 12px;border-radius:999px;background:rgba(18,25,24,.45)}
#hud .mv em{font-style:normal;font-size:17px;color:#f4f4ee;margin:0 .15em}
#nextBtn{border-color:rgba(240,244,238,.4)!important;color:#f3f3ec!important;background:rgba(70,88,84,.7)!important}
#side{position:absolute;z-index:7;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;pointer-events:none;
  font-family:var(--brush);color:rgba(236,240,233,.82);text-shadow:0 2px 14px rgba(0,0,0,.45);letter-spacing:.2em;line-height:1.5}
#side .s1{font-size:46px}
#side .s2{font-size:26px;margin-right:14px;color:rgba(226,232,226,.7)}
#side .s3{font-family:var(--serif);font-size:14px;margin-right:16px;letter-spacing:.3em;color:rgba(214,222,217,.6);max-height:420px}
#sideR{position:absolute;z-index:7;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;pointer-events:none;
  font-size:13.5px;letter-spacing:.32em;line-height:2;color:rgba(214,222,217,.62);max-height:60vh;text-shadow:0 1px 8px rgba(0,0,0,.5)}

/* ---------- modal ---------- */
#win{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at center,rgba(14,20,19,.35),rgba(14,20,19,.72));
  opacity:0;transition:opacity .5s ease}
#win.show{opacity:1}
#win .card{width:min(360px,100%);text-align:center;padding:26px 22px 20px;border-radius:16px;border:1px solid rgba(235,240,234,.2);
  background:linear-gradient(170deg,rgba(52,66,63,.94),rgba(22,29,28,.96));box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translateY(8px);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#win.show .card{transform:none}
#win .wk{font-size:12px;letter-spacing:.3em;color:var(--dim)}
#win .wh{font-family:var(--brush);font-size:44px;line-height:1.2;margin:10px 0 4px;color:#f2f2ea}
#win .ws{display:flex;justify-content:center;gap:12px;margin:12px 0 8px}
#win .ws svg{width:34px;height:34px}
#win .wm{font-size:13px;color:#c9d1cc;letter-spacing:.14em}
#win .wn{font-size:14px;line-height:1.9;color:#dfe5e0;margin:14px 2px 18px;text-align:left;text-indent:2em;letter-spacing:.04em}
#win .wb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#win .wb .btn{min-width:130px;font-size:15px;letter-spacing:.2em;padding:0 18px}

#toast{position:absolute;left:50%;z-index:25;transform:translate(-50%,8px);max-width:min(92vw,440px);padding:10px 18px;border-radius:12px;
  background:rgba(18,25,24,.86);border:1px solid rgba(235,240,234,.18);font-size:14px;line-height:1.7;letter-spacing:.06em;color:#e8ece6;
  opacity:0;transition:opacity .4s ease, transform .4s ease;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="cv" aria-label="雨落青瓦 游戏画面"></canvas>

<div id="title">
  <div class="gate" id="titleGate">
    <h1>雨落青瓦<span class="seal"><span>听</span><span>雨</span></span></h1>
    <p class="sub">把一场雨，好好引到它该去的地方</p>
  </div>
  <div class="acts" id="titleActs">
    <button class="btn primary" id="btnListen">听雨</button>
    <button class="btn ghost" id="btnBook">节气册</button>
  </div>
  <div class="foot">二十四节气 · 七十二候 · 七十二关</div>
</div>

<div id="select" class="hidden">
  <div class="wrap">
    <header>
      <button class="iconbtn" id="selBack" aria-label="回到屋檐"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>檐下</button>
      <h2>节气册</h2>
      <span class="prog" id="prog"></span>
    </header>
    <button id="daily"><span class="dk" id="dailyK"></span><span class="dt"><b id="dailyT"></b><span id="dailyS"></span></span><span class="go" id="dailyGo">今日一局</span></button>
    <div class="tabs" id="tabs"></div>
    <div class="terms" id="terms"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="top">
    <button class="iconbtn" id="hudBack" aria-label="回节气册"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>节气</button>
    <div class="ttl"><b id="hudT"></b><span id="hudS"></span></div>
  </div>
  <div class="bot">
    <button class="iconbtn" id="resetBtn" aria-label="重铺"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>重铺</button>
    <div class="mv" id="mv"></div>
    <button class="iconbtn hidden" id="nextBtn">下一关<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>
<div id="side" class="hidden"><span class="s1" id="sideA"></span><span class="s2" id="sideB"></span></div>
<div id="sideR" class="hidden"></div>

<div id="win" class="hidden">
  <div class="card">
    <div class="wk" id="winK"></div>
    <div class="wh" id="winH"></div>
    <div class="ws" id="winS"></div>
    <div class="wm" id="winM"></div>
    <div class="wn" id="winN"></div>
    <div class="wb">
      <button class="btn ghost" id="winStay">再听一会儿</button>
      <button class="btn" id="winNext">下一关</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<button id="mute" aria-label="静音开关">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<!-- ======================= 纯逻辑：节气数据 / 关卡生成 / 水流判定（node 测试会单独抽出这一段） ======================= -->
<script id="logic">
const RainLogic = (function () {
  'use strict';
  const N = 1, E = 2, S = 4, W = 8;
  const DIRS = [N, E, S, W];
  const DX = { 1: 0, 2: 1, 4: 0, 8: -1 };
  const DY = { 1: -1, 2: 0, 4: 1, 8: 0 };
  const OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };

  function rotCW(m, k) { k = ((k % 4) + 4) % 4; for (let i = 0; i < k; i++) m = ((m << 1) | (m >> 3)) & 15; return m; }
  function degree(m) { let c = 0; for (const d of DIRS) if (m & d) c++; return c; }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // 二十四节气与《逸周书·时训解》/《月令七十二候》的三候。note 为本作自拟的小记，非古籍原文。
  const SEASONS = [
    { name: '春', word: '细雨' }, { name: '夏', word: '骤雨' }, { name: '秋', word: '疏雨' }, { name: '冬', word: '雨雪' }
  ];
  const TERMS = [
    { name: '立春', date: '2月4日前后', hou: ['东风解冻', '蛰虫始振', '鱼陟负冰'], note: '檐角的冰凌开始滴水。屋里还冷，雨已经先暖了一点。' },
    { name: '雨水', date: '2月19日前后', hou: ['獭祭鱼', '候雁北', '草木萌动'], note: '从这时起，天上落下来的多半是雨，不再是雪。瓦缝里的青苔一夜绿了一层。' },
    { name: '惊蛰', date: '3月6日前后', hou: ['桃始华', '仓庚鸣', '鹰化为鸠'], note: '头一声春雷过后，墙根的泥土松了，院里的桃树先开了几朵。' },
    { name: '春分', date: '3月21日前后', hou: ['玄鸟至', '雷乃发声', '始电'], note: '昼夜一样长。燕子回来了，在檐下找去年的旧窝。' },
    { name: '清明', date: '4月5日前后', hou: ['桐始华', '田鼠化为鴽', '虹始见'], note: '雨细得像雾。石板缝里冒出新草，巷口有人撑着伞慢慢走过。' },
    { name: '谷雨', date: '4月20日前后', hou: ['萍始生', '鸣鸠拂其羽', '戴胜降于桑'], note: '雨水养着秧田。缸里浮起第一片浮萍，春天快走到头了。' },
    { name: '立夏', date: '5月6日前后', hou: ['蝼蝈鸣', '蚯蚓出', '王瓜生'], note: '雨势大了起来，瓦当下的水线连成一片帘子。' },
    { name: '小满', date: '5月21日前后', hou: ['苦菜秀', '靡草死', '麦秋至'], note: '麦粒渐满，还未全满。河里的水一阵一阵，涨到石阶第三级。' },
    { name: '芒种', date: '6月6日前后', hou: ['螳螂生', '鵙始鸣', '反舌无声'], note: '江南快要入梅。屋里的木头吸饱了潮气，闻得到一点松香。' },
    { name: '夏至', date: '6月21日前后', hou: ['鹿角解', '蜩始鸣', '半夏生'], note: '白天最长的一天。雷雨来得快，走得也快，荷叶上的水珠还在滚。' },
    { name: '小暑', date: '7月7日前后', hou: ['温风至', '蟋蟀居壁', '鹰始挚'], note: '闷热。午后一场急雨，檐下的竹帘被风掀起一角。' },
    { name: '大暑', date: '7月23日前后', hou: ['腐草为萤', '土润溽暑', '大雨时行'], note: '一年最热的时候。雨落在晒烫的石板上，冒起一层白气。' },
    { name: '立秋', date: '8月8日前后', hou: ['凉风至', '白露降', '寒蝉鸣'], note: '风里有了一丝凉。夜雨打在梧桐叶上，声音变脆了。' },

    { name: '秋分', date: '9月23日前后', hou: ['雷始收声', '蛰虫坯户', '水始涸'], note: '昼夜又一样长了。雷声收起来，雨也跟着安静。' },
    { name: '寒露', date: '10月8日前后', hou: ['鸿雁来宾', '雀入大水为蛤', '菊有黄华'], note: '露水更凉。雨打着黄菊，檐下晾的衣裳一整天也干不了。' },
    { name: '霜降', date: '10月23日前后', hou: ['豺乃祭兽', '草木黄落', '蛰虫咸俯'], note: '草木开始黄落。雨里夹着寒意，摸一摸屋顶的瓦，是冷的。' },
    { name: '立冬', date: '11月7日前后', hou: ['水始冰', '地始冻', '雉入大水为蜃'], note: '雨又冷又细。院里的水缸，早上浮着一层薄冰。' },
    { name: '小雪', date: '11月22日前后', hou: ['虹藏不见', '天气上升地气下降', '闭塞而成冬'], note: '雨里开始夹着雪粒，落在瓦上沙沙地响。' },
    { name: '大雪', date: '12月7日前后', hou: ['鹖鴠不鸣', '虎始交', '荔挺出'], note: '雪压在瓦垄上，一垄白，一垄青。' },
    { name: '冬至', date: '12月22日前后', hou: ['蚯蚓结', '麋角解', '水泉动'], note: '一年里夜最长。雪化成水，沿着瓦槽慢慢往下走。' },
    { name: '小寒', date: '1月6日前后', hou: ['雁北乡', '鹊始巢', '雉始雊'], note: '冷到骨子里。墙角的梅开了几朵，白得像没化的雪。' },
    { name: '大寒', date: '1月20日前后', hou: ['鸡始乳', '征鸟厉疾', '水泽腹坚'], note: '最后一个节气。雪水滴进缸里，再过些日子，又是立春。' }
  ];
  const HOU_NAME = ['初候', '二候', '三候'];
  const LEVEL_COUNT = 72;

  // 关卡参数：网格从 4×4 增长到 8×10；四季依次引入：双承雨口、固定瓦、漏瓦、分流
  function levelSpec(i) {
    const t = i / (LEVEL_COUNT - 1);
    const cols = Math.round(4 + 4 * t);
    const rows = Math.round(4 + 6 * t);
    const ch = Math.floor(i / 18), k = i % 18;
    let groups;
    if (ch === 0) groups = k < 12 ? [1] : [1, 1];
    else if (ch === 1) groups = (k % 3 === 1) ? [1] : [1, 1];
    else if (ch === 2) groups = (k % 3 === 0) ? [1] : [1, 1];
    else groups = k < 6 ? [2] : (k < 12 ? (k % 2 ? [2, 1] : [1, 2]) : (k % 3 === 0 ? [2] : (k % 2 ? [2, 1] : [1, 2])));
    return {
      index: i, cols, rows, groups,
      fixedFrac: ch >= 1 ? 0.14 + 0.04 * (ch - 1) : 0,
      leakFrac: ch >= 2 ? 0.10 + 0.02 * (ch - 2) : 0,
      decoyFrac: 0.42 + 0.48 * t,
      wander: i < 2 ? 0 : 1 + Math.floor(t * 5),
      jarRate: i < 3 ? 0 : 0.4
    };
  }

  function pickCols(cols, n, rng) {
    for (let tries = 0; tries < 200; tries++) {
      const all = shuffle([...Array(cols).keys()], rng).slice(0, n).sort((a, b) => a - b);
      let ok = true;
      for (let j = 1; j < all.length; j++) if (all[j] - all[j - 1] < 2) ok = false;
      if (ok) return all;
    }
    return null;
  }

  function findPath(a, b, cols, rows, blocked, rng, minLen, maxLen, budget) {
    const visited = new Uint8Array(cols * rows);
    const path = [a]; visited[a] = 1;
    const bx = b % cols, by = (b / cols) | 0;
    let left = budget;
    function dfs(c, depth) {
      if (c === b) return depth >= minLen;
      if (--left < 0) return false;
      const cx = c % cols, cy = (c / cols) | 0;
      if (depth + Math.abs(cx - bx) + Math.abs(cy - by) > maxLen) return false;
      const order = shuffle([0, 1, 2, 3], rng);
      for (const o of order) {
        const d = DIRS[o]; const nx = cx + DX[d], ny = cy + DY[d];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const n = ny * cols + nx;
        if (visited[n]) continue;
        if (n !== b && blocked(n)) continue;
        visited[n] = 1; path.push(n);
        if (dfs(n, depth + 1)) return true;
        path.pop(); visited[n] = 0;
      }
      return false;
    }
    return dfs(a, 0) ? path.slice() : null;
  }
  function dirBetween(p, q, cols) {
    const px = p % cols, py = (p / cols) | 0, qx = q % cols, qy = (q / cols) | 0;
    if (qx === px + 1) return E; if (qx === px - 1) return W; if (qy === py + 1) return S; return N;
  }

  function tryGen(spec, rng) {
    const { cols, rows, groups } = spec;
    const n = cols * rows;
    const nSink = groups.reduce((a, b) => a + b, 0);
    const srcCols = pickCols(cols, groups.length, rng);
    const sinkCols = pickCols(cols, nSink, rng);
    if (!srcCols || !sinkCols) return null;
    const occ = new Int8Array(n);      // 0 空；>0 第几条水网
    const mask = new Uint8Array(n);
    const reserved = new Uint8Array(n);
    srcCols.forEach(c => { reserved[c] = 1; });
    sinkCols.forEach(c => { reserved[(rows - 1) * cols + c] = 1; });
    const sinks = [];
    let si = 0;
    const paths = [];
    for (let s = 0; s < groups.length; s++) {
      const start = srcCols[s];
      occ[start] = s + 1; mask[start] |= N;
      const net = [start];
      for (let g = 0; g < groups[s]; g++) {
        const end = (rows - 1) * cols + sinkCols[si];
        const blocked = (c) => occ[c] !== 0 || reserved[c] === 1;
        let path = null, from = -1;
        if (g === 0) {
          const manh = (rows - 1) + Math.abs(sinkCols[si] - srcCols[s]);
          for (let extra = spec.wander; extra >= 0 && !path; extra--) {
            const ex = 2 * Math.floor(rng() * (extra + 1));
            path = findPath(start, end, cols, rows, blocked, rng, manh + ex, manh + ex + (spec.index < 6 ? 2 : 4), 2500);
          }
          if (!path) return null;
        } else {
          const cand = shuffle(net.slice(), rng);
          for (const p of cand) {
            if (degree(mask[p]) >= 3) continue;
            const px = p % cols, py = (p / cols) | 0;
            for (const d of shuffle(DIRS.slice(), rng)) {
              const qx = px + DX[d], qy = py + DY[d];
              if (qx < 0 || qy < 0 || qx >= cols || qy >= rows) continue;
              const q = qy * cols + qx;
              if (q !== end && (occ[q] || reserved[q])) continue;
              const ex = 2 * Math.floor(rng() * 3);
              const manh = Math.abs(qx - sinkCols[si]) + (rows - 1 - qy);
              const pp = q === end ? [q] : findPath(q, end, cols, rows, blocked, rng, manh + ex, manh + ex + 6, 2500);
              if (pp) { path = pp; from = p; break; }
            }
            if (path) break;
          }
          if (!path) return null;
          const d = dirBetween(from, path[0], cols);
          mask[from] |= d; mask[path[0]] |= OPP[d];
        }
        for (let j = 0; j < path.length; j++) {
          occ[path[j]] = s + 1;
          if (j > 0) { const d = dirBetween(path[j - 1], path[j], cols); mask[path[j - 1]] |= d; mask[path[j]] |= OPP[d]; }
          if (net.indexOf(path[j]) < 0) net.push(path[j]);
        }
        mask[end] |= S;
        sinks.push({ col: sinkCols[si], src: s, kind: 'bed' });
        paths.push(path);
        si++;
      }
    }
    // 路径太短（几乎是直线）的关卡不要
    let pathCells = 0, turns = 0;
    for (let c = 0; c < n; c++) if (occ[c]) { pathCells++; const m = mask[c]; if (m !== 5 && m !== 10) turns++; }
    if (turns < Math.min(2, pathCells - 1)) return null;

    const cells = [];
    for (let c = 0; c < n; c++) cells.push({ k: occ[c] ? 'pipe' : 'plain', base: occ[c] ? mask[c] : 0, rot: 0, fixed: false, path: !!occ[c], deco: Math.floor(rng() * 1e6) });
    // 漏瓦：贴着水路放，固定不转
    const free = [];
    for (let c = 0; c < n; c++) if (!occ[c]) free.push(c);
    const near = (c) => { const x = c % cols, y = (c / cols) | 0; return DIRS.some(d => { const nx = x + DX[d], ny = y + DY[d]; return nx >= 0 && ny >= 0 && nx < cols && ny < rows && occ[ny * cols + nx]; }); };
    shuffle(free, rng);
    free.sort((a, b) => (near(b) ? 1 : 0) - (near(a) ? 1 : 0));
    const leakN = Math.round(free.length * spec.leakFrac) + (spec.leakFrac > 0 ? 1 : 0);
    const LEAK_SHAPES = [5, 10, 3, 6, 12, 9];
    let used = 0;
    for (; used < Math.min(leakN, free.length); used++) {
      const c = free[used];
      cells[c].k = 'leak'; cells[c].base = LEAK_SHAPES[Math.floor(rng() * LEAK_SHAPES.length)]; cells[c].fixed = true;
    }
    // 干扰瓦
    const rest = shuffle(free.slice(used), rng);
    const decoyN = Math.round(rest.length * spec.decoyFrac);
    const DECOY = [5, 10, 5, 3, 6, 12, 9, 3, 7, 14, 13, 11, 15];
    for (let j = 0; j < decoyN; j++) { const c = rest[j]; cells[c].k = 'pipe'; cells[c].base = DECOY[Math.floor(rng() * DECOY.length)]; }
    // 固定瓦：水路中段的一部分，钉在正确朝向
    if (spec.fixedFrac > 0) {
      const ends = new Set(srcCols.concat(sinkCols.map(c => (rows - 1) * cols + c)));
      const mids = shuffle([...Array(n).keys()].filter(c => occ[c] && !ends.has(c)), rng);
      const fn = Math.max(1, Math.round(mids.length * spec.fixedFrac));
      for (let j = 0; j < Math.min(fn, mids.length); j++) cells[mids[j]].fixed = true;
    }
    // 花圃 / 水缸
    sinks.forEach((s, j) => { s.kind = (j > 0 || spec.index >= 6) && rng() < spec.jarRate ? 'jar' : 'bed'; });

    const lv = { index: spec.index, cols, rows, sources: srcCols, sinks, cells, spec };
    // 打乱：记录的解是每格 rot=0
    for (let tries = 0; tries < 40; tries++) {
      for (let c = 0; c < n; c++) {
        const cl = cells[c];
        if (cl.k !== 'pipe' || cl.fixed) continue;
        const easy = spec.index < 9;
        if (cl.path && easy) {
          // 前几关：大多一两下就能转对
          if (rng() < 0.22) { cl.rot = 0; continue; }
          const k = rng() < 0.7 ? 1 : 2;
          cl.rot = (4 - k) % 4;
          if (rotCW(cl.base, cl.rot) === cl.base) cl.rot = 3;
        } else if (cl.path && rng() > 0.12) {
          const opts = [1, 2, 3].filter(r => rotCW(cl.base, r) !== cl.base);
          cl.rot = opts.length ? opts[Math.floor(rng() * opts.length)] : 0;
        } else cl.rot = Math.floor(rng() * 4);
      }
      const f = computeFlow(lv);
      if (!f.sinkWet.some(Boolean)) {
        lv.par = parOf(lv);
        if (lv.par >= Math.min(3, pathCells)) return lv;
      }
    }
    return null;
  }

  function generate(i, opt) {
    opt = opt || {};
    const spec = opt.spec || levelSpec(i);
    const seed = opt.seed != null ? opt.seed : hashStr('rain-tiles#' + i);
    const rng = mulberry32(seed);
    for (let a = 0; a < 600; a++) {
      const lv = tryGen(spec, rng);
      if (lv) { lv.seed = seed; lv.attempts = a; return lv; }
    }
    throw new Error('level generation failed: ' + i);
  }

  function maskAt(lv, c, rots) {
    const cl = lv.cells[c];
    if (cl.k === 'plain') return 0;
    return rotCW(cl.base, rots ? rots[c] : cl.rot);
  }

  function computeFlow(lv, rots) {
    const { cols, rows } = lv; const n = cols * rows;
    const dist = new Int16Array(n).fill(-1);
    const entry = new Uint8Array(n);
    const parent = new Int16Array(n).fill(-1);
    const order = [], leaks = [], spills = [];
    const sinkAt = {}; lv.sinks.forEach((s, j) => { sinkAt[s.col] = j; });
    const srcAt = {}; lv.sources.forEach((c, j) => { srcAt[c] = j; });
    const q = [];
    lv.sources.forEach(c => {
      const m = maskAt(lv, c, rots);
      if (m & N) { dist[c] = 0; entry[c] = N; q.push(c); }
    });
    let h = 0;
    while (h < q.length) {
      const c = q[h++]; order.push(c);
      const m = maskAt(lv, c, rots);
      const x = c % cols, y = (c / cols) | 0;
      for (const d of DIRS) {
        if (!(m & d)) continue;
        const nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) {
          if (ny === rows && d === S && sinkAt[nx] != null) continue;
          if (ny < 0 && d === N && srcAt[nx] != null) continue;
          spills.push({ c, d }); continue;
        }
        const j = ny * cols + nx;
        const mj = maskAt(lv, j, rots);
        if (!(mj & OPP[d])) { spills.push({ c, d }); continue; }
        if (dist[j] >= 0) continue;
        dist[j] = dist[c] + 1; entry[j] = OPP[d]; parent[j] = c;
        if (lv.cells[j].k === 'leak') { leaks.push(j); continue; }
        q.push(j);
      }
    }
    const sinkWet = lv.sinks.map(s => {
      const c = (rows - 1) * cols + s.col;
      return dist[c] >= 0 && lv.cells[c].k !== 'leak' && !!(maskAt(lv, c, rots) & S);
    });
    const solved = sinkWet.every(Boolean) && leaks.length === 0;
    return { dist, entry, parent, order, leaks, spills, sinkWet, solved };
  }

  // 每格最少要点几下（只能顺时针转）
  function clicksNeeded(cl) {
    if (cl.k !== 'pipe' || cl.fixed) return 0;
    for (let k = 0; k < 4; k++) if (rotCW(cl.base, cl.rot + k) === cl.base) return k;
    return 0;
  }
  function parOf(lv) { let p = 0; lv.cells.forEach(cl => { if (cl.path) p += clicksNeeded(cl); }); return p; }
  function starsFor(moves, par) {
    if (moves <= par + Math.max(4, Math.ceil(par * 0.5))) return 3;
    if (moves <= par * 2 + 8) return 2;
    return 1;
  }

  // 节气按公历近似日期（逐年会差一两天，够每日关用了）
  const TERM_START = [[2, 4], [2, 19], [3, 6], [3, 21], [4, 5], [4, 20], [5, 6], [5, 21], [6, 6], [6, 21], [7, 7], [7, 23],
    [8, 8], [8, 23], [9, 8], [9, 23], [10, 8], [10, 23], [11, 7], [11, 22], [12, 7], [12, 22], [1, 6], [1, 20]];
  function termForDate(y, m, d) {
    const key = m * 100 + d;
    let best = -1, bestKey = -1;
    TERM_START.forEach((md, i) => { const k = md[0] * 100 + md[1]; if (k <= key && k > bestKey) { bestKey = k; best = i; } });
    let startY = y;
    if (best < 0) { best = 21; startY = y - 1; }
    const st = TERM_START[best];
    const t0 = Date.UTC(startY, st[0] - 1, st[1]), t1 = Date.UTC(y, m - 1, d);
    const days = Math.round((t1 - t0) / 86400000);
    return { term: best, hou: Math.max(0, Math.min(2, Math.floor(days / 5))) };
  }
  function dateKey(y, m, d) { return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
  function dailyLevel(y, m, d) {
    const td = termForDate(y, m, d);
    const base = td.term * 3 + td.hou;
    const spec = Object.assign({}, levelSpec(Math.min(71, base + 4)), { index: base });
    const lv = generate(base, { seed: hashStr('rain-daily#' + dateKey(y, m, d)), spec });
    lv.daily = dateKey(y, m, d); lv.term = td.term; lv.hou = td.hou;
    return lv;
  }

  return { N, E, S, W, DIRS, DX, DY, OPP, rotCW, degree, mulberry32, hashStr, SEASONS, TERMS, HOU_NAME, LEVEL_COUNT,
    levelSpec, generate, computeFlow, maskAt, clicksNeeded, parOf, starsFor, termForDate, dailyLevel, dateKey };
})();

function render(now) {
  const t = (now - T0) / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (screen === 'title') { drawTitle(t); return; }
  if (!bgCanvas) renderBackground();
  ctx.drawImage(bgCanvas, 0, 0, VW, VH);
  drawMist(t, VH * .34, VH * .3, .5, 10);
  if (screen === 'play' && game.lv) {
    drawBoard(now);
    drawMist(t, VH * .72, VH * .3, .28, -14);
  }
  drawRain(t, season, screen === 'select' ? .7 : 1);
  if (screen === 'select') { ctx.fillStyle = 'rgba(16,22,21,.42)'; ctx.fillRect(0, 0, VW, VH); }

}
function frame() { render(performance.now()); requestAnimationFrame(frame); }

function cellAt(px, py) {
  if (!game.lv) return -1;
  const c = Math.floor((px - B.x) / B.s), r = Math.floor((py - B.y) / B.s);

cv.addEventListener('pointerdown', (e) => {
  if (screen !== 'play' || !game.lv) return;
  Snd.init();
  const c = cellAt(e.clientX, e.clientY); if (c < 0) return;
  e.preventDefault();
  if (game.won) return;
  const cl = game.lv.cells[c];
  const now = performance.now();
  if (cl.k !== 'pipe' || cl.fixed) {
    Snd.thud();
    if (cl.fixed && cl.k === 'pipe' && !game.fixTold) { game.fixTold = true; toast('这块瓦钉了铜钉，转不动。顺着它铺。', 2800); }
    return;
  }
  const ccw = e.button === 2;
  cl.rot = (cl.rot + (ccw ? 3 : 1)) % 4;
  game.rotAnim[c] = ccw ? -1e9 : now;
  game.moves++;
  Snd.click();
  const x = B.x + (c % game.lv.cols + .5) * B.s, y = B.y + (((c / game.lv.cols) | 0) + .5) * B.s;
  if (!reduceMotion) for (let k = 0; k < 5; k++) { const a = h1(game.moves * 13 + k) * 7; game.parts.push({ x, y, vx: Math.cos(a) * B.s * .55, vy: Math.sin(a) * B.s * .45, g: B.s * .2, r: 1.2 + h1(k + game.moves) * 1.4, b: now, life: 380 }); }
  updateFlow(now, false);

});

muteBtn.addEventListener('click', () => { Snd.init(); Snd.setMuted(!Snd.muted); save.muted = Snd.muted; persist(); syncMute(); });
syncMute();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && screen === 'play') openSelect(); });

// 调试 / 截图用钩子（不影响游戏）
window.__rainTiles = { startLevel, startDaily, openSelect, solve() { if (!game.lv) return; game.lv.cells.forEach(c => { if (c.k === 'pipe' && !c.fixed) c.rot = 0; }); updateFlow(performance.now(), false); }, bloomAll() { game.sinkT = game.sinkT.map(v => v >= 0 ? 1 : v); game.sinkOn = game.sinkT.map(v => v >= 0); game.bloomT = game.sinkT.map(() => -1e6); }, dbg() { const f = game.flow; return { solved: f && f.solved, order: f && f.order.length, wet: f && f.sinkWet, now: performance.now(), t: Array.from(game.wetT).slice(0, 12).map(Math.round), won: game.won, bloomT: game.bloomT, sinkT: game.sinkT, sinkOn: game.sinkOn }; } };

resize();
requestAnimationFrame(frame);
})();
</script>
