<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦境当铺</title>
<meta name="description" content="梦境当铺 —— 你愿意拿哪段记忆，去换一个愿望？一间只在梦里开门的当铺，一夜五位客人。">
<meta name="theme-color" content="#061416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+XiaoWei&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#051214; --ink:#efe6d2; --dim:#a9bab4; --faint:#5f7470;
  --gold:#c9a45a; --gold-hi:#f2d896; --gold-dim:#6e5a32;
  --peacock:#0d3b40; --panel:rgba(5,19,20,.86); --line:rgba(201,164,90,.28);
  --cinnabar:#b23a2a; --paper:#e7d9bb; --paper-ink:#2b2018;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --title:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --deco:"ZCOOL XiaoWei","Noto Serif SC","Songti SC","STSong",serif;
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --stageH:340px; --sideW:420px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
[hidden]{display:none!important}

/* ---------- 按钮 ---------- */
.brass{min-height:50px;padding:0 30px;border:1px solid var(--gold);border-radius:3px;background:linear-gradient(#2c2414,#15110a);color:var(--gold-hi);font-family:var(--title);font-weight:900;font-size:22px;letter-spacing:.32em;text-indent:.32em;box-shadow:inset 0 1px 0 rgba(242,216,150,.25),0 0 0 3px rgba(5,18,20,.6),0 0 28px rgba(255,190,110,.18);transition:box-shadow .25s,transform .15s}
.brass:hover{box-shadow:inset 0 1px 0 rgba(242,216,150,.35),0 0 0 3px rgba(5,18,20,.6),0 0 40px rgba(255,190,110,.35)}
.brass:active{transform:translateY(1px)}
.brass:focus-visible,.ghost:focus-visible,.tab:focus-visible,.q:focus-visible,.choice:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.ghost{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:3px;background:rgba(6,20,21,.6);color:var(--gold-hi);font-size:15px;letter-spacing:.1em}
.ghost:hover{border-color:var(--gold)}

/* ---------- 开始页 ---------- */
#start{flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 5vh) 16px calc(env(safe-area-inset-bottom) + 5vh);text-align:center;pointer-events:none}
#start > *{pointer-events:auto}
.ttl h1{margin:0;font-family:var(--deco);font-weight:400;font-size:clamp(46px,8vw,84px);letter-spacing:.22em;text-indent:.22em;line-height:1.1;background:linear-gradient(180deg,#fff3cc,#e9c97f 55%,#9c7a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(255,190,110,.25))}
.ttl .en{margin-top:10px;font-size:11px;letter-spacing:.6em;color:var(--gold);opacity:.7}
.ttl p{margin:18px 0 0;font-size:clamp(15px,2.2vw,18px);color:var(--ink);letter-spacing:.12em;text-shadow:0 1px 8px #000}
.startBtns{display:flex;flex-direction:column;align-items:center;gap:12px}
.startBtns .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seenEnd{font-size:13px;color:var(--dim);letter-spacing:.1em;text-shadow:0 1px 6px #000}

/* ---------- 旁白 ---------- */
#narr{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(3,12,13,.72),rgba(2,7,8,.94));padding:24px 18px;cursor:pointer;z-index:6}
.narrBox{max-width:560px;width:100%}
.narrBox p{margin:0 0 18px;font-size:clamp(16px,2.2vw,19px);line-height:2;letter-spacing:.06em}
.narrBox p.hand{font-family:var(--hand);font-size:clamp(22px,3vw,28px);color:var(--gold-hi)}
.help{margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:3px;background:rgba(10,30,31,.7);font-size:14px;line-height:1.9;color:var(--dim)}
.help b{font-family:var(--title);font-weight:900;color:var(--gold-hi);font-size:17px;margin-right:4px}
.narrNext{margin-top:12px;display:flex;justify-content:flex-end}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 游戏界面 ---------- */
#game{pointer-events:none;z-index:3}
#game > *{pointer-events:auto}
#hud{position:absolute;left:0;top:0;height:52px;right:var(--sideW);padding:env(safe-area-inset-top) 70px 0 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(3,10,11,.75),rgba(3,10,11,0));pointer-events:none}
#hud > *{pointer-events:auto}
.who{font-family:var(--title);font-size:18px;color:var(--gold-hi);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who small{font-family:var(--serif);font-size:12px;color:var(--dim);letter-spacing:.1em;margin-right:8px}
.lampv{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);white-space:nowrap}
.lampv b{font-family:var(--title);font-weight:900;font-size:19px;color:#dfefff;text-shadow:0 0 10px rgba(180,220,255,.6)}
.lampv svg{width:14px;height:18px}
#side{position:absolute;right:14px;top:14px;bottom:14px;width:var(--sideW);display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(242,216,150,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#talk{padding:12px 16px 14px;min-height:104px;cursor:pointer;position:relative}
#talk .spk{display:flex;align-items:baseline;gap:10px;font-family:var(--title);color:var(--gold-hi);font-size:17px;letter-spacing:.12em}
#talk .spk span{white-space:nowrap;flex:0 0 auto}
#talk .spk small{font-family:var(--serif);font-size:12px;color:var(--faint);letter-spacing:.04em;min-width:0;line-height:1.5}
#talk .you{font-size:13px;color:var(--dim);margin-top:4px}
#line{margin:6px 0 0;font-size:16px;line-height:1.85;letter-spacing:.03em;min-height:2em}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:54px;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.tab b{font-family:var(--title);font-weight:900;font-size:23px;line-height:1;color:var(--ink)}
.tab span{font-size:11px;letter-spacing:.12em}
.tab.on b{color:var(--gold-hi);text-shadow:0 0 12px rgba(255,200,120,.5)}
.tab.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 22px);width:7px;height:7px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 6px var(--cinnabar)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 14px;-webkit-overflow-scrolling:touch}
.pane h4{margin:0 0 6px;font-family:var(--title);font-weight:900;color:var(--gold-hi);font-size:17px;letter-spacing:.1em}
.hint{font-size:13px;color:var(--dim);line-height:1.7;margin:0}
#lookCv{width:100%;height:250px;display:block;border-radius:3px;touch-action:manipulation;cursor:pointer;border:1px solid rgba(201,164,90,.15)}
.fragInfo{margin-top:10px;min-height:66px}
.fragInfo p{margin:0;font-size:15px;line-height:1.85}
.fragList{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fragList button{min-height:44px;padding:0 12px;border:1px solid var(--line);background:rgba(10,30,31,.6);border-radius:3px;font-size:13px;color:var(--dim)}
.fragList button.seen{color:var(--gold-hi);border-color:rgba(201,164,90,.6)}
.qs{display:flex;flex-direction:column;gap:8px}
.q{min-height:52px;text-align:left;border:1px solid var(--line);background:rgba(10,30,31,.55);border-radius:3px;padding:8px 12px;display:flex;gap:12px;align-items:center}
.q:hover{border-color:var(--gold)}
.q b{font-family:var(--title);font-weight:900;color:var(--gold-hi);font-size:16px;white-space:nowrap;min-width:3.6em}
.q span{font-size:14px;color:var(--ink);line-height:1.5}
.q.done{opacity:.62}
.q.done b::after{content:" · 已问";font-family:var(--serif);font-size:11px;color:var(--dim)}
.free{display:flex;gap:8px;margin-top:12px}
.free input{flex:1;min-width:0;min-height:48px;padding:0 12px;border:1px solid var(--line);background:rgba(2,10,11,.8);border-radius:3px;font-size:15px;color:var(--ink)}
.free input::placeholder{color:var(--faint)}
.free input:focus{outline:none;border-color:var(--gold)}
.free button{min-width:64px}
.freeNote{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.6}
.dealInfo{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;color:var(--dim);margin-bottom:8px}
.dealInfo div b{display:block;font-size:15px;color:var(--ink);font-weight:600;line-height:1.5}
.dealInfo .wide{grid-column:1/-1}
#abCv{width:100%;height:172px;display:block;touch-action:manipulation;cursor:pointer}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 10px}
.steps button{min-width:48px;min-height:44px;border:1px solid var(--line);background:rgba(10,30,31,.6);border-radius:3px;font-size:14px;color:var(--gold-hi)}
.steps .pv{min-width:92px;text-align:center;font-family:var(--title);font-size:26px;color:#dfefff;text-shadow:0 0 10px rgba(180,220,255,.5)}
.steps .pv small{font-family:var(--serif);font-size:12px;color:var(--dim)}
.offerRow{display:flex;gap:8px}
.hint.warn{color:#ffb39e;margin:0 0 8px}
.hint.warn:empty{display:none}
.offerRow .brass{flex:1;font-size:19px;letter-spacing:.2em;min-height:50px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:0 14px;border:1px solid rgba(178,58,42,.7);background:rgba(90,20,14,.35);color:#ffd8cc;border-radius:3px;font-size:14px}
.chip::before{content:"拆穿 ";color:#ff9c85;font-family:var(--title)}
.dealt{padding:10px 12px;border:1px solid rgba(201,164,90,.5);border-radius:3px;background:rgba(40,32,14,.5);color:var(--gold-hi);font-size:14px;line-height:1.7}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{min-height:62px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:3px;background:linear-gradient(90deg,rgba(20,40,40,.7),rgba(8,20,21,.6));display:flex;flex-direction:column;justify-content:center;gap:2px}
.choice b{font-family:var(--title);font-weight:900;font-size:20px;letter-spacing:.12em;color:var(--gold-hi)}
.choice span{font-size:12px;color:var(--dim)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.choice:not(:disabled):hover{border-color:var(--gold)}
.choice.hid{border-color:#f3e2b0;box-shadow:0 0 24px rgba(243,226,176,.25);animation:breath 2.6s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 34px rgba(243,226,176,.45)}}
.after p{margin:0 0 12px;font-size:15.5px;line-height:1.95}
.after .ledgerLine{font-family:var(--hand);font-size:21px;color:var(--gold-hi);margin:6px 0 14px}
.after .brass{width:100%}
#ledgerBtn{position:relative}
#ledgerBtn .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--cinnabar);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}

/* ---------- 账簿 ---------- */
#ledger{align-items:center;justify-content:center;background:rgba(2,8,9,.72);z-index:8;padding:16px}
.book{position:relative;width:min(600px,100%);max-height:min(84vh,760px);overflow-y:auto;background:radial-gradient(ellipse at 30% 20%,#efe3c6,#ddcba4 70%,#cdb88d);color:var(--paper-ink);border-radius:3px;padding:26px 26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(120,80,30,.25)}
.book::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 33px,rgba(120,80,40,.12) 33px 34px);pointer-events:none}
.book h3{margin:0 0 4px;font-family:var(--title);font-weight:900;font-size:26px;letter-spacing:.2em}
.book .bsub{font-size:12px;color:#6a5638;margin-bottom:16px}
.book section{margin-bottom:18px;position:relative}
.book h5{margin:0 0 6px;font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.08em;border-bottom:1px solid rgba(80,50,20,.3);padding-bottom:4px}
.book .e{font-family:var(--hand);font-size:21px;line-height:1.55;margin:2px 0}
.book .e.c{color:#7a1d12;display:flex;gap:10px;align-items:flex-start}
.seal{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid var(--cinnabar);color:var(--cinnabar);font-family:var(--title);font-size:17px;transform:rotate(-8deg);margin-top:4px;border-radius:2px}
.book .out{font-family:var(--hand);font-size:20px;color:#4a3420;margin-top:4px}
.book .close{position:sticky;top:0;float:right;margin:-10px -10px 0 0;min-width:44px;min-height:44px;border:1px solid rgba(80,50,20,.4);background:rgba(240,228,200,.9);border-radius:3px;color:var(--paper-ink);font-size:14px;z-index:2}
.book .empty{font-family:var(--hand);font-size:20px;color:#8a7350}

/* ---------- 结局 ---------- */
#ending{overflow-y:auto;z-index:7;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 40px) 16px 40px;background:linear-gradient(rgba(2,8,9,0),rgba(2,8,9,.3) 40%,rgba(2,8,9,.72))}
.endCard{width:min(780px,100%);margin-top:28vh;padding:26px 26px 30px}
.endCard .kick{font-size:12px;letter-spacing:.4em;color:var(--gold)}
.endCard h2{margin:6px 0 2px;font-family:var(--title);font-weight:900;font-size:clamp(44px,8vw,68px);letter-spacing:.3em;background:linear-gradient(180deg,#fff3cc,#e9c97f 60%,#9c7a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.endCard .sub{color:var(--dim);margin:0 0 18px;letter-spacing:.1em}
.endCard .txt p{font-size:16px;line-height:2.05;margin:0 0 10px}
.endCard h3{margin:26px 0 10px;font-family:var(--title);font-weight:900;font-size:20px;color:var(--gold-hi);letter-spacing:.16em;border-bottom:1px solid var(--line);padding-bottom:6px}
.shopNow{font-size:15px;line-height:1.9;color:var(--ink)}
.sb{display:grid;grid-template-columns:44px 64px 1fr 1fr;border:1px solid var(--line);border-radius:3px;overflow:hidden;font-size:14px}
.sb > div{padding:8px 10px;border-bottom:1px solid rgba(201,164,90,.14);line-height:1.6}
.sb .hd{background:rgba(201,164,90,.12);color:var(--gold-hi);font-family:var(--title);font-size:15px}
.sb .no{color:var(--gold);font-family:var(--title)}
.sb .sc{color:var(--gold-hi)}
.sb .so{color:var(--dim)}
.note{margin-top:12px;padding:10px 14px;border-left:3px solid var(--gold);background:rgba(201,164,90,.08);font-size:14px;line-height:1.8;color:var(--ink)}
.films{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.film{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7;color:var(--dim)}
.film i{flex:0 0 auto;width:12px;height:12px;border-radius:50%;margin-top:6px;box-shadow:0 0 10px currentColor}
.film b{color:var(--ink);font-weight:600}
.endGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.endGrid div{min-height:58px;border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--title);font-size:18px;color:var(--faint)}
.endGrid div.got{color:var(--gold-hi);border-color:rgba(201,164,90,.6);background:rgba(201,164,90,.08)}
.endGrid div.now{box-shadow:0 0 18px rgba(242,216,150,.35)}
.endGrid small{font-family:var(--serif);font-size:10px;color:var(--faint)}
.endBtns{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.endBtns .brass{flex:1}

/* ---------- 浮层 ---------- */
#mute{position:fixed;top:calc(env(safe-area-inset-top) + 4px);right:calc(env(safe-area-inset-right) + 4px);width:44px;height:44px;border:1px solid var(--line);border-radius:3px;background:rgba(4,14,15,.7);z-index:20;display:flex;align-items:center;justify-content:center;color:var(--gold-hi)}
#mute svg{width:20px;height:20px}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-10px);z-index:21;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;background:linear-gradient(#efe3c6,#dccaa2);color:#3a2214;padding:10px 18px;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:var(--hand);font-size:21px;max-width:min(92vw,460px);display:flex;gap:10px;align-items:center;line-height:1.4}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .seal{width:26px;height:26px;font-size:15px}

/* ---------- 手机竖屏 ---------- */
body.mob #hud{right:0;height:48px;padding-right:58px}
body.mob .who{font-size:15px}
body.mob .who small{display:none}
body.mob #side{left:0;right:0;top:var(--stageH);bottom:0;width:auto;padding:0 8px calc(env(safe-area-inset-bottom) + 8px);gap:6px}
body.mob #talk{min-height:84px;padding:8px 12px 10px}
body.mob #talk .spk{font-size:15px}
body.mob #line{font-size:14.5px;line-height:1.7;margin-top:3px}
body.mob .tab{min-height:48px}
body.mob .tab b{font-size:20px}
body.mob #lookCv{height:190px}
body.mob .pane{padding:10px 10px 12px}
body.mob #abCv{height:124px}
body.mob .dealInfo{margin-bottom:4px;font-size:12px}
body.mob .dealInfo div b{font-size:14px}
body.mob .steps{margin:4px 0 8px}
body.mob .sb{grid-template-columns:34px 50px 1fr;font-size:13px}
body.mob .sb .so{grid-column:2/-1;padding-top:0;border-bottom:1px solid rgba(201,164,90,.14)}
body.mob .sb .pic{border-bottom:0}
body.mob .sb .hd.so{display:none}
body.mob .endGrid{grid-template-columns:repeat(3,1fr)}
body.mob .endCard{padding:20px 16px 24px;margin-top:30vh}
body.mob .book{padding:22px 16px 26px}
body.mob #toast{top:52px;font-size:18px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="start" class="screen on">
  <div class="ttl">
    <h1>梦境当铺</h1>
    <div class="en">THE DREAM PAWNSHOP</div>
    <p>你愿意拿哪段记忆，去换一个愿望？</p>
  </div>
  <div class="startBtns">
    <div class="row">
      <button id="btnPush" class="brass" type="button">推门</button>
      <button id="btnCont" class="ghost" type="button" hidden>继续今夜</button>
    </div>
    <div class="seenEnd" id="seenEnd">一间只在梦里开门的当铺 · 一夜五位客人</div>
  </div>
</div>

<div id="narr" class="screen" role="dialog" aria-label="旁白">
  <div class="narrBox"><div id="narrLines"></div><div class="narrNext"><button id="narrBtn" class="ghost" type="button">继续 ›</button></div></div>
</div>

<div id="game" class="screen">
  <header id="hud">
    <div class="who" id="who"></div>
    <div class="lampv" title="灯里的月光：用来付给客人；收下的记忆会化成月光添回灯里">
      <svg viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1c2 3 4 5 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8z" fill="#ffd38a"/><path d="M7 7c1 1.5 2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 1-2.5 2-4z" fill="#fff6dd"/></svg>

const KEYWORDS = {
  origin: ['哪来', '哪儿来', '哪里来', '从哪', '来历', '来路', '怎么来', '怎么得', '出处', '谁的', '是你的吗', '你自己的', '什么时候', '哪一年', '几岁', '在哪', '哪里的'],
  detail: ['细节', '具体', '里面', '看到', '看见', '什么样', '颜色', '声音', '当时', '发生', '那天', '那晚', '怎么回事', '讲讲', '说说', '描述', '是谁', '谁在', '什么人', '名字', '口琴', '橘子', '车票', '窗', '手', '画面'],
  wish: ['愿望', '想要', '换什么', '为什么卖', '为什么要', '为何', '图什么', '需要', '目的', '打算', '干什么', '做什么', '用来', '拿去', '钱', '多少', '值', '为了'],
  silence: ['沉默', '不说话', '不作声', '……', '...', '。。。', '嗯', '安静', '看着', '发呆', '等'],
};
const Q_PRIORITY = ['origin', 'detail', 'wish', 'silence'];
function matchQuestion(text) {
  const s = String(text == null ? '' : text).trim();
  if (!s) return 'silence';
  let best = null, bestScore = 0;
  for (const q of Q_PRIORITY) {
    let sc = 0;
    for (const k of KEYWORDS[q]) if (s.indexOf(k) !== -1) sc += k.length;
    if (sc > bestScore) { bestScore = sc; best = q; }
  }
  if (!best && /^[\s.。…，,？?！!（）()]+$/.test(s)) return 'silence';
  return best;
}

const Rules = {
  cust(state) { return state.cs ? CUSTOMERS[state.cs.cid] : null; },
  enter(state, cid) {
    const c = CUSTOMERS[cid];
    state.cs = { cid, frags: [], asked: [], contra: [], exposed: [], want: c.ask, floor: c.floor, mood: c.mood, deal: null, offers: 0, deflects: 0, lastOffer: null };
    return state.cs;
  },
  sat(state, tok) {
    const cs = state.cs, [k, v] = tok.split(':');
    if (k === 'f') return cs.frags.includes(v);
    if (k === 'a') return cs.asked.includes(v);
    if (k === 'g') return !!state.seen[v];
    return false;
  },
  check(state) {
    const c = this.cust(state), cs = state.cs, found = [];
    for (const k of c.contra) {
      if (cs.contra.includes(k.id)) continue;
      if (k.needs.every(t => this.sat(state, t))) { cs.contra.push(k.id); found.push(k); }
    }
    return found;
  },
  look(state, fid) {
    const cs = state.cs, first = !cs.frags.includes(fid);
    if (first) { cs.frags.push(fid); state.seen[cs.cid + '.' + fid] = true; }
    return { first, found: this.check(state) };
  },
  ask(state, qid) {
    const c = this.cust(state), cs = state.cs, first = !cs.asked.includes(qid);
    if (first) { cs.asked.push(qid); cs.mood = Math.max(5, cs.mood + (c.answers[qid].mood || 0)); }
    return { first, found: this.check(state) };
  },
  // 出价：返回 accept / acceptHigh / counter / insult / walk
  offer(state, price) {
    const c = this.cust(state), cs = state.cs;
    price = Math.max(0, Math.round(price));
    if (c.noDeal || cs.deal != null) return { type: 'none', want: cs.want };
    cs.offers++; cs.lastOffer = price;
    if (price >= cs.want) { cs.deal = price; return { type: price > c.ask ? 'acceptHigh' : 'accept', want: cs.want, price }; }
    if (price >= cs.floor) {
      if (cs.want - price <= 1) { cs.deal = price; return { type: 'accept', want: cs.want, price }; }
      cs.want = Math.max(cs.floor, Math.ceil((cs.want + price) / 2));
      cs.mood -= 6;
      if (cs.mood <= 0) return { type: 'walk', want: cs.want };
      return { type: 'counter', want: cs.want, price };
    }
    cs.mood -= 14 + Math.min(20, (cs.floor - price) * 3);
    if (cs.mood <= 0) return { type: 'walk', want: cs.want };
    return { type: 'insult', want: cs.want, price };
  },
  // 拆穿：用账簿里的矛盾压价
  expose(state, kid) {
    const c = this.cust(state), cs = state.cs;
    const k = c.contra.find(x => x.id === kid);
    if (!k || !k.expose || !cs.contra.includes(kid) || cs.exposed.includes(kid) || cs.deal != null) return { ok: false };
    cs.exposed.push(kid);
    cs.floor = Math.min(cs.floor, k.expose.floor);
    cs.want = Math.max(cs.floor, Math.min(cs.want, k.expose.want));
    cs.mood += k.expose.mood;

  },
  moodWord(state) {
    const cs = state.cs, m = cs.mood, c = this.cust(state);
    if (c.noDeal) return '她很安静，像在等一个早就知道的答案';
    if (m > 70) return '神色平静';
    if (m > 45) return '指节有点发白';
    if (m > 20) return '眼睛开始往门口看';

  },
  appraise(state) {
    const c = this.cust(state), cs = state.cs, n = cs.frags.length, V = c.value;
    if (c.noDeal) return '估不出来。你越看，越觉得这瓶子在看你。';
    if (c.stolen && cs.contra.length) return '瓶身有接缝，是别人的东西，光会往外漏。最多值 ' + V + ' 盏。';
    if (n === 0) return '看不透——先举瓶对灯，看看里面。';
    if (n === 1) return '约 ' + Math.max(1, V - 6) + '–' + (V + 6) + ' 盏';
    if (n === 2) return '约 ' + Math.max(1, V - 3) + '–' + (V + 3) + ' 盏';

  },
  options(state) {
    const c = this.cust(state), cs = state.cs;
    if (c.noDeal) {
      const list = [
        { key: 'keep', label: c.dec.keep, sub: '她的下午上架，你替她忘掉', enabled: true },
        { key: 'persuade', label: c.dec.persuade, sub: '疼的那段，和不疼的那段', enabled: true },
        { key: 'refuse', label: c.dec.refuse, sub: '请她带着它离开', enabled: true },
      ];
      if (state.flags.confiscated && state.heart >= WARM && cs.contra.includes('gap')) list.push({ key: 'restore', label: c.dec.restore, sub: '灯边那只瓶子，一直在喊她的名字', enabled: true, hidden: true });
      return list;
    }
    const known = c.decKnown && cs.contra.length;
    return [
      { key: 'keep', label: c.dec.keep, sub: cs.deal != null ? '按谈妥的 ' + cs.deal + ' 盏月光' + (state.money + c.value - cs.deal < 0 ? '——付完灯就灭了' : '') : '先在「估」里谈妥价钱', enabled: cs.deal != null },
      { key: 'refuse', label: c.dec.refuse, sub: '本店不收，请回', enabled: true },
      { key: 'persuade', label: known ? c.decKnown.persuade : c.dec.persuade, sub: known ? '这不是他的东西' : (c.id === 'c2' ? '从灯里舀二十盏给他' + (state.money < 20 ? '——灯里只剩 ' + state.money + ' 盏，借了，灯会灭' : '') : '这段记忆，别当了'), enabled: true },
    ];
  },
  // 决定：应用效果，返回下一个剧本节点
  decide(state, key) {
    const c = this.cust(state), cs = state.cs;
    const node = SCRIPT.nodes[c.id];
    const outKey = c.resolve(key, cs, state);
    const target = node.out[outKey];
    if (!target) throw new Error('no outcome ' + c.id + '.' + outKey);
    const tn = SCRIPT.nodes[target];
    let price = cs.deal;
    if (tn && tn.type === 'outcome') this.apply(state, tn.fx, c, price);
    if (key === 'keep' && c.noDeal) state.flags.selfSold = true;
    state.log.push({ cid: c.id, out: outKey, node: target, price: key === 'keep' ? price : null });
    state.book[c.id] = { frags: cs.frags.slice(), asked: cs.asked.slice(), contra: cs.contra.slice(), exposed: cs.exposed.slice(), out: outKey, price: key === 'keep' ? price : null };
    state.cs = null;
    return { outKey, node: target };
  },
  apply(state, fx, c, price) {
    if (!fx) return;
    if (fx.heart) state.heart += fx.heart;
    if (fx.money === 'deal') state.money += c.value - (price || 0);
    else if (typeof fx.money === 'number') state.money += fx.money;
    if (fx.flag) state.flags[fx.flag] = true;
    if (fx.shelf === 'add') state.shelf.push({ old: false, gone: false, label: c.title, color: c.color, cid: c.id, key: c.id });
    if (fx.shelf === 'fade') { const o = state.shelf.find(b => b.old && !b.gone); if (o) o.gone = true; }
    if (fx.shelf === 'aside') state.aside = { label: c.title, color: c.color, cid: c.id };
  },
  next(state, id) {
    let guard = 0;
    while (SCRIPT.nodes[id] && SCRIPT.nodes[id].type === 'branch' && guard++ < 20) {
      const n = SCRIPT.nodes[id];
      const hit = n.cases.find(k => COND[k.cond](state));
      id = hit ? hit.go : n.else;
    }
    return id;
  },
};

function buildStoryboard(state, endingId) {
  const mid = state.log.map(l => SCRIPT.nodes[l.node]).filter(n => n && n.type === 'outcome').map(n => n.shot);
  const reached5 = state.log.some(l => l.cid === 'c5');
  const end = ENDINGS[endingId].shots;
  let rows = [SHOT_OPEN, SHOT_CLOCK].concat(mid, reached5 ? [SHOT_C5] : [], end);
  if (rows.length > 8) rows = rows.filter(r => r !== SHOT_CLOCK);
  if (rows.length > 8) rows = rows.filter(r => r !== SHOT_C5);

}
function shopSummary(state, endingId) {
  const fresh = state.shelf.filter(b => !b.old).length;
  const gone = state.shelf.filter(b => b.old && b.gone).length;
  const oldLeft = state.shelf.filter(b => b.old && !b.gone).length;
  const parts = [];
  if (endingId === 'full') parts.push('架子满到了顶，最上面一格，是你自己');
  else if (endingId === 'home') parts.push('门开着，架上的光一只只顺着楼梯飘出去了');
  else parts.push(fresh ? '架上新添了 ' + fresh + ' 只记忆瓶' : '今夜一只新瓶子也没上架');
  if (gone) parts.push(gone + ' 只蒙尘的旧瓶子悄悄空了');
  if (oldLeft && endingId !== 'home') parts.push('还剩 ' + oldLeft + ' 只旧瓶子');

  parts.push(state.money < 0 ? '灯里一盏月光也没有了' : '灯里余下 ' + state.money + ' 盏月光');

}

// ---------------- 客人引擎 ----------------
// CustomerEngine 只负责“客人说什么”；“数值怎么变、矛盾怎么判、结局怎么走”永远由 Rules 决定。
// 这样换成大模型扮演客人时，模型再会说，也改不了底线、改不了结局，比赛评审可复现。
class CustomerEngine {
  /** 客人进门的开场白 */ greet(c, state) { throw new Error('abstract'); }
  /** 预设问题（origin/detail/wish/silence）的回答 */ answer(c, qid, state) { throw new Error('abstract'); }
  /** 玩家自由输入：返回 {qid, text}；qid 为 null 时 text 是一句搪塞 */ freeAsk(c, text, state) { throw new Error('abstract'); }
  /** 对出价/拆穿等事件的情绪化台词（事件类型与数值由 Rules 给出） */ react(c, ev, data, state) { throw new Error('abstract'); }
}

// 默认：读剧本。
class ScriptedEngine extends CustomerEngine {
  greet(c) { return c.greet; }
  answer(c, qid) { return c.answers[qid].t; }
  freeAsk(c, text, state) {
    const qid = matchQuestion(text);
    if (qid) return { qid, text: null };
    const i = state.cs ? state.cs.deflects++ : 0;
    return { qid: null, text: c.deflect[i % c.deflect.length] };
  }
  react(c, ev, data) { return String(c.react[ev] || '').replace('{want}', data && data.want != null ? data.want : ''); }
}

// 大模型扮演客人的桩（demo 里未启用，接口与 ScriptedEngine 一致，方法返回 Promise）。
// 设计要点：
//  1. 人设 / 愿望 / 底线 / 秘密 / 已暴露的矛盾 全部由剧本数据拼进 system prompt；
//     底线数字只告诉模型“别说出口”，真正的成交判定仍走 Rules.offer。
//  2. 自由提问时要求模型输出 JSON：{"intent":"origin|detail|wish|silence|other","reply":"..."}。
//     intent 交回 Rules.ask 解锁线索（模型不能凭空解锁矛盾），reply 只是台词。
//  3. 网络失败 / 超时 / 输出不合法 → 回落到 ScriptedEngine，游戏永远可玩。
class LLMEngine extends CustomerEngine {
  constructor(opts) {
    super();
    this.endpoint = (opts && opts.endpoint) || '';   // 例如自建的 /api/customer 代理，密钥放服务端
    this.fallback = new ScriptedEngine();
    this.history = {};                                // 每位客人的对话历史
  }
  systemPrompt(c, state) {
    const cs = state.cs || { contra: [], exposed: [], mood: c.mood };
    return [
      '你在一个叫“梦当”的梦境当铺里扮演客人「' + c.name + '」。外貌：' + c.look,
      '你想典当的记忆：《' + c.title + '》。你的愿望：' + c.answers.wish.t,
      '你嘴上的说法（可以继续坚持）：来历——' + c.answers.origin.t + '；细节——' + c.answers.detail.t,
      '你心里的秘密（不要直接说破，只能被追问时露出破绽）：' + c.contra.map(k => k.text).join(' / '),
      '已被掌柜拆穿的事：' + (cs.exposed.join('、') || '无') + '。当前情绪值 ' + cs.mood + '/100，越低越想走。',
      '规则：不得报出你的心理底价；不得替掌柜做决定；一次只说一到两句，中文，克制，有画面感。',
      '输出 JSON：{"intent":"origin|detail|wish|silence|other","reply":"你的台词"}',
    ].join('\n');
  }
  async request(c, state, userText) {
    if (!this.endpoint) throw new Error('LLMEngine: 未配置 endpoint');
    const h = this.history[c.id] || (this.history[c.id] = []);
    h.push({ role: 'user', content: userText });
    const res = await fetch(this.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system: this.systemPrompt(c, state), messages: h.slice(-12) }) });
    const data = await res.json();
    const out = JSON.parse(data.text || '{}');
    h.push({ role: 'assistant', content: out.reply || '' });
    return out;
  }
  async greet(c, state) { return this.fallback.greet(c, state); }
  async answer(c, qid, state) {
    try { const o = await this.request(c, state, '[掌柜' + QUESTIONS.find(q => q.id === qid).tag + ']'); return o.reply || this.fallback.answer(c, qid, state); }
    catch (e) { return this.fallback.answer(c, qid, state); }
  }
  async freeAsk(c, text, state) {
    try {
      const o = await this.request(c, state, text);
      const qid = ['origin', 'detail', 'wish', 'silence'].includes(o.intent) ? o.intent : null;
      return { qid, text: o.reply || null };
    } catch (e) { return this.fallback.freeAsk(c, text, state); }
  }
  async react(c, ev, data, state) { return this.fallback.react(c, ev, data, state); }
}

function roundRectPath(c, x, y, w, h, r) {

    this.noiseBuf = nb;
    const ns = ac.createBufferSource(); ns.buffer = nb; ns.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.7;
    const ng = ac.createGain(); ng.gain.value = 0.012; ns.connect(bp); bp.connect(ng); ng.connect(this.master); ns.start();
    // 钟表滴答：时快时慢
    this.nextTick = ac.currentTime + 0.5;
    this.timer = setInterval(() => this.schedule(), 60);
  },
  schedule() {
    const ac = this.ac; if (!ac) return;
    while (this.nextTick < ac.currentTime + 0.2) {
      const t = this.nextTick, odd = (this.tickOn++) % 2;
      this.click(t, odd ? 2400 : 3100, 0.05);
      const delay = Math.max(0, (t - ac.currentTime) * 1000);
      setTimeout(() => { tickCount++; tickAt = performance.now(); }, delay);
      const k = ac.currentTime * 0.11;
      this.nextTick += 0.62 + 0.38 * Math.sin(k) + 0.18 * Math.sin(k * 3.7) + (Math.random() - 0.5) * 0.08;
    }
  },
  click(t, f, a) {
    const ac = this.ac; const s = ac.createBufferSource(); s.buffer = this.noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 6;
    const g = ac.createGain(); g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t, Math.random(), 0.05);
  },
  tone(f, t, dur, a, type) {
    const ac = this.ac; const o = ac.createOscillator(); o.type = type || 'sine'; o.frequency.value = f;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  bell() { if (!this.ac) return; const t = this.ac.currentTime + 0.02; [0, 0.24].forEach((dt, k) => [1, 2.76, 5.4, 8.93].forEach((m, i) => this.tone(640 * m * (k ? 1.012 : 1), t + dt, 1.6 / (i + 1), 0.07 / (i + 1)))); },
  glass() { if (!this.ac) return; const t = this.ac.currentTime + 0.01; for (let i = 0; i < 3; i++) this.tone(1800 + Math.random() * 1900, t + i * 0.07 + Math.random() * 0.05, 0.9 + Math.random() * 0.6, 0.018); },
  bead() { if (!this.ac) return; const t = this.ac.currentTime + 0.005; this.click(t, 1400, 0.18); this.tone(230, t, 0.06, 0.08, 'triangle'); },
  coin() { if (!this.ac) return; const t = this.ac.currentTime + 0.01; [880, 1108, 1320, 1760].forEach((f, i) => this.tone(f, t + i * 0.06, 0.9, 0.035)); },
  scratch() { if (!this.ac) return; const ac = this.ac, t = ac.currentTime + 0.01; for (let i = 0; i < 4; i++) this.click(t + i * 0.07 + Math.random() * 0.03, 3800 + Math.random() * 1200, 0.05); },
  thud() { if (!this.ac) return; const ac = this.ac, t = ac.currentTime + 0.01; const o = ac.createOscillator(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.3); const g = ac.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.5); },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ac.currentTime, 0.05); },
};

}

  el.width = Math.max(10, Math.round(r.width * DPR)); el.height = Math.max(10, Math.round(r.height * DPR));

function onLookDown(e) {

}

function doDecide(key) {

    const fx = tn.fx || {};

  if (state.money >= 0 && state.money <= 6) setTimeout(() => toast('<span class="seal">油</span><span>灯里只剩 ' + state.money + ' 盏月光了</span>'), 600);

function openLedger() {
  if (!state) return;
  let h = '<button class="close" id="bookClose" type="button">合上</button><h3>账 簿</h3><div class="bsub">梦当 · 今夜 · 灯里月光 ' + state.money + ' 盏</div>';
  if (state.money <= 8) h += '<div class="e c"><span class="seal">油</span><span>灯里的月光不多了。再往外借、往高里出价，灯会灭。</span></div>';
  h += '<section><h5>首页</h5><div class="e">新掌柜：今夜五位客人。记忆换愿望，童叟无欺。</div><div class="e" style="text-align:right">——小' + (state.flags.selfSold || state.log.some(l => l.cid === 'c5') || (state.cs && state.cs.cid === 'c5' && state.cs.contra.includes('gap')) ? '满' : '□') + '</div></section>';
  const ids = ORDER.filter(id => state.book[id] || (state.cs && state.cs.cid === id));
  if (!ids.length) h += '<div class="empty">还没有客人。</div>';
  for (const id of ids) {
    const c = CUSTOMERS[id], rec = state.book[id] || state.cs;
    h += '<section><h5>' + esc(c.name) + ' ·《' + esc(c.title) + '》</h5>';
    rec.frags.forEach(fid => { const f = c.frags.find(x => x.id === fid); h += '<div class="e">看见：' + esc(f.title) + '</div>'; });
    c.contra.forEach(k => k.needs.forEach(t => { if (t.startsWith('a:') && rec.asked.includes(t.slice(2))) h += '<div class="e">' + (id === 'c5' ? '她' : '他') + '说：「' + esc(c.answers[t.slice(2)].t.replace(/（[^）]*）/g, '').slice(0, 30)) + '……」</div>'; }));
    rec.contra.forEach(kid => { const k = c.contra.find(x => x.id === kid); h += '<div class="e c"><span class="seal">矛</span><span>「' + esc(k.name) + '」' + esc(k.text) + (rec.exposed.includes(kid) ? '（已拆穿）' : '') + '</span></div>'; });
    if (!rec.frags.length && !rec.asked.length) h += '<div class="empty">什么也没记。</div>';
    if (state.book[id]) { const lg = state.log.find(l => l.cid === id); h += '<div class="out">→ ' + esc(lg ? (SCRIPT.nodes[lg.node] && SCRIPT.nodes[lg.node].type === 'outcome' ? SCRIPT.nodes[lg.node].lines[0] : '（夜还没完）') : '') + '</div>'; }
    h += '</section>';
  }
  $('#book').innerHTML = h; $('#ledger').classList.add('on'); Sound.scratch();
  $('#bookClose').addEventListener('click', () => $('#ledger').classList.remove('on'));
}
$('#ledgerBtn').addEventListener('click', () => { Sound.init(); openLedger(); });
$('#ledger').addEventListener('click', e => { if (e.target.id === 'ledger') $('#ledger').classList.remove('on'); });

// ---------- 结局 ----------
function showEnding(n) {
  const id = n.ending, E = ENDINGS[id];
  addEnding(id); store.del(SAVE_KEY); $('#toast').classList.remove('on');
  view.mode = 'ending'; view.ending = id; view.endT = performance.now(); view.cid = null;
  if (id === 'dark') view.lampTarget = 0;
  show('#ending'); $('#narr').classList.remove('on');
  if (id === 'home' || id === 'dawn') Sound.bell(); else Sound.thud();
  const seen = seenEndings();
  const idx = ENDING_ORDER.indexOf(id) + 1;
  let h = '<div class="kick">' + (E.hidden ? '隐藏结局' : '结局 · 其' + CN[idx]) + '</div><h2>' + esc(E.name) + '</h2><p class="sub">' + esc(E.sub) + '</p><div class="txt">';
  E.text.forEach(s => h += '<p>' + esc(s) + '</p>');
  h += '</div><h3>当铺最终的样子</h3><p class="shopNow">' + esc(shopSummary(state, id)) + '</p>';
  h += '<h3>本夜分镜单</h3><div class="sb"><div class="hd">镜</div><div class="hd">景别</div><div class="hd">画面</div><div class="hd so">声音</div>';
  buildStoryboard(state, id).forEach((r, i) => { h += '<div class="no">' + String(i + 1).padStart(2, '0') + '</div><div class="sc">' + esc(r.scale) + '</div><div class="pic">' + esc(r.picture) + '</div><div class="so">' + esc(r.sound) + '</div>'; });
  h += '</div><div class="note">每段被典当的记忆都可以成为一支 AI 短片，提交叙事影像赛道。</div><div class="films">';
  const met = ORDER.filter(cid => state.book[cid]);
  met.forEach(cid => { const c = CUSTOMERS[cid], o = state.book[cid].out; const sold = /^keep/.test(o); h += '<div class="film" style="color:' + c.color + '"><i style="background:' + c.color + '"></i><span><b>《' + esc(c.title) + '》</b>' + (sold ? '（已典当）' : '（未典当）') + ' ' + esc(c.film) + '</span></div>'; });
  h += '</div><h3>已见结局 ' + seen.length + ' / ' + ENDING_ORDER.length + '</h3><div class="endGrid">';
  ENDING_ORDER.forEach(e => { const got = seen.includes(e); h += '<div class="' + (got ? 'got' : '') + (e === id ? ' now' : '') + '">' + (got ? esc(ENDINGS[e].name) : '？？') + '<small>' + (ENDINGS[e].hidden ? '隐藏' : '') + '</small></div>'; });
  h += '</div><div class="endBtns"><button class="brass" id="againBtn" type="button">再开一夜</button><button class="ghost" id="doorBtn" type="button">回到门口</button></div>';
  $('#endCard').innerHTML = h; $('#ending').scrollTop = 0;
  $('#againBtn').addEventListener('click', () => { newGame(); });
  $('#doorBtn').addEventListener('click', () => { toStart(); });
}

// ---------- 开始 ----------
function toStart() {
  view.mode = 'start'; view.openT = 0; view.cid = null; view.clockHands = false; state = null;
  show('#start');
  const sv = loadGame(); $('#btnCont').hidden = !sv;
  const se = seenEndings();
  $('#seenEnd').textContent = se.length ? '已见结局 ' + se.length + ' / ' + ENDING_ORDER.length : '一间只在梦里开门的当铺 · 一夜五位客人';
}
function pushDoor(cont) {
  Sound.init(); Sound.bell();
  if (view.openT) return;
  view.openT = performance.now();
  $('#start').style.opacity = '0'; $('#start').style.transition = 'opacity .6s';
  setTimeout(() => {
    $('#start').style.opacity = ''; $('#start').classList.remove('on');
    if (cont) { state = loadGame() || newState(); }
    else { state = newState(); store.del(SAVE_KEY); }
    view.shelfAnim = {}; view.lamp = view.lampTarget = 1; view.clockHands = false;
    gotoNode(state.node);
  }, RM ? 400 : 1200);
}
function newGame() { state = newState(); store.del(SAVE_KEY); view.mode = 'shop'; view.shelfAnim = {}; view.clockHands = false; view.openT = 0; $('#ending').classList.remove('on'); gotoNode(state.node); }
$('#btnPush').addEventListener('click', () => pushDoor(false));
$('#btnCont').addEventListener('click', () => pushDoor(true));

// ---------- 静音 ----------
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
function renderMute() { $('#mute').innerHTML = Sound.muted ? ICON_OFF : ICON_ON; $('#mute').setAttribute('aria-label', Sound.muted ? '打开声音' : '静音'); }
Sound.muted = store.get(MUTE_KEY) === '1'; renderMute();
$('#mute').addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); store.set(MUTE_KEY, Sound.muted ? '1' : '0'); renderMute(); });
document.addEventListener('pointerdown', () => Sound.init(), { once: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#ledger').classList.remove('on'); });

// 看瓶时，玻璃里的画面偶尔发出声响
setInterval(() => { if (state && state.cs && ui.tab === 'look' && $('#lookCv') && !document.hidden && Math.random() < 0.45) Sound.glass(); }, 1900);

// ---------- 主循环 ----------
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { layout(); if (state && state.cs && (ui.tab === 'look' || ui.tab === 'deal')) renderPane(); }, 120); });
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (view.mode === 'start') drawStart(now); else drawShop(now, state);
  tickLine(now);
  if ($('#narr').classList.contains('on')) document.querySelectorAll('#narrLines [data-t0]').forEach(el => { const k = ease((now - Number(el.dataset.t0)) / 800); el.style.opacity = k; el.style.transform = 'translateY(' + ((1 - k) * 8).toFixed(1) + 'px)'; if (k >= 1) el.removeAttribute('data-t0'); });
  if (state && state.cs) {
    const lc = ui.tab === 'look' && document.getElementById('lookCv');
    if (lc) { const c2 = lc.getContext('2d'); const w = lc.width / DPR, h = lc.height / DPR; c2.setTransform(DPR, 0, 0, DPR, 0, 0); drawLook(c2, w, h, now, CUSTOMERS[state.cs.cid], state.cs, ui.sel); }
    const ab = ui.tab === 'deal' && document.getElementById('abCv');
    if (ab) { const c3 = ab.getContext('2d'); c3.setTransform(DPR, 0, 0, DPR, 0, 0); drawAbacus(c3, ab.width / DPR, ab.height / DPR, now, ui.price, false); }
  }
}
layout(); toStart();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { /* 画布文字下一帧自动换成网络字体 */ });

// 调试 / 测试入口（单一命名空间）
window.DreamPawn = {
  get state() { return state; }, Rules, SCRIPT, CUSTOMERS,
  newGame, gotoNode, setTab, selectFrag, doAsk, doFree, doOffer, doExpose, doDecide, openLedger,
  setPrice(p) { ui.price = p; if (ui.tab === 'deal') renderPane(); },
  skipNarr() { while ($('#narr').classList.contains('on') && ui.narrStep) ui.narrStep(); },
};
})();
</script>
</body>
</html>
