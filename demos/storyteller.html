<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无限说书人</title>
<meta name="description" content="茶馆戏台上的 AI 说书人，台下每位观众都能用手机喊“且慢”改写剧情。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17110c; --ink2:#2b2119; --ink3:#43352a;
  --red:#b5321e; --red2:#87220f; --redHi:#d24a2c;
  --paper:#eee0c0; --paper2:#d8c49a; --paperHi:#f8efd9;
  --ui:#f4ead4; --uiCard:#fbf5e7; --uiLine:rgba(29,22,17,.13); --uiText:#1d1611; --uiSub:#6d5c4b;
  --f-brush:"Ma Shan Zheng","Zhi Mang Xing","STKaiti","KaiTi","Kaiti SC",serif;
  --f-cursive:"Zhi Mang Xing","Ma Shan Zheng","STXingkai","STKaiti","KaiTi",cursive;
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f-sans)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;display:flex;background:var(--ink)}
#app.shake{animation:shake .38s cubic-bezier(.3,.7,.4,1)}
#app.shake-s{animation:shake-s .26s ease-out}
@keyframes shake{0%{transform:translate(0,0)}15%{transform:translate(-7px,5px)}30%{transform:translate(6px,-4px)}48%{transform:translate(-4px,3px)}66%{transform:translate(3px,-2px)}100%{transform:translate(0,0)}}
@keyframes shake-s{0%{transform:translate(0,0)}30%{transform:translate(0,3px)}60%{transform:translate(0,-1px)}100%{transform:translate(0,0)}}

/* ---------- 戏台 ---------- */
#stageCol{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#stageWrap{flex:1;position:relative;min-height:0;overflow:hidden;background:#241a13;cursor:pointer}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#lyric{flex:0 0 auto;min-height:150px;position:relative;background:var(--ink);border-top:3px solid var(--red);padding:16px 30px 18px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;
  background-image:repeating-linear-gradient(-28deg,rgba(238,224,192,.035) 0 1px,transparent 1px 7px)}
#lyric::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:rgba(238,224,192,.18)}
#lyLabel{font:500 13px/1 var(--f-sans);letter-spacing:.18em;color:var(--redHi);display:flex;gap:12px;align-items:center;margin-bottom:10px}
#lyLabel .act{color:var(--paper2);letter-spacing:.1em}
#lyText{font:700 clamp(19px,2.15vw,27px)/1.6 var(--f-serif);color:var(--paperHi);min-height:3.2em;text-wrap:pretty;letter-spacing:.02em}
#lyText .cur{display:inline-block;width:.55em;height:1em;vertical-align:-.12em;border-bottom:3px solid var(--red);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#lyHint{position:absolute;right:20px;bottom:10px;font:400 12px var(--f-sans);color:rgba(238,224,192,.38);letter-spacing:.1em}
.overlayStamp{position:absolute;pointer-events:none;font-family:var(--f-cursive);color:var(--red);opacity:0;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3px 0 var(--ink)}
#stamp{left:6%;top:10%;font-size:clamp(46px,8vw,112px);transform:rotate(-9deg) scale(1.6)}
#stamp.on{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:rotate(-9deg) scale(1.9)}60%{opacity:1}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
#stamp.off{opacity:0;transition:opacity .4s}
#pa{left:50%;top:38%;font-size:clamp(60px,10vw,150px);transform:translate(-50%,-50%) rotate(6deg)}
#pa.on{animation:paIn .9s ease-out forwards}
@keyframes paIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(6deg) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) rotate(6deg) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(6deg) scale(1)}}

/* ---------- 观众手机 ---------- */
#phoneCol{flex:0 0 430px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 28px 26px;position:relative;
  background:#1d1510;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 46px),repeating-linear-gradient(-35deg,rgba(238,224,192,.03) 0 1px,transparent 1px 6px);
  border-left:1px solid rgba(238,224,192,.08)}
#phoneCap{position:absolute;top:22px;left:28px;font:500 12px var(--f-sans);letter-spacing:.22em;color:rgba(238,224,192,.55)}
#phoneCap b{color:var(--redHi);font-weight:700}
#phone{width:374px;height:min(760px,100%);border-radius:42px;background:var(--ui);color:var(--uiText);overflow:hidden;position:relative;display:flex;flex-direction:column;color-scheme:light;
  box-shadow:0 0 0 9px #0c0806,0 0 0 10px #4a392b,0 28px 60px rgba(0,0,0,.65)}
.ph-status{flex:0 0 auto;height:36px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 4px;font:600 13px var(--f-sans);color:var(--uiText)}
.ph-status i{display:inline-block;width:18px;height:9px;border:1.5px solid var(--uiText);border-radius:3px;position:relative;vertical-align:-1px;margin-left:6px}
.ph-status i::after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:65%;background:var(--uiText);border-radius:1px}
.ph-head{flex:0 0 auto;padding:10px 16px 10px;border-bottom:1px solid var(--uiLine);background:var(--ui)}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-venue{font:700 11px var(--f-sans);letter-spacing:.2em;color:var(--red)}
.ph-live{font:500 12px var(--f-sans);color:var(--uiSub);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ph-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(181,50,30,.18);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(181,50,30,.0)}}
.ph-book{font:900 21px/1.2 var(--f-serif);letter-spacing:.06em;margin-top:6px}
.ph-book small{display:block;font:500 12px var(--f-sans);color:var(--uiSub);letter-spacing:.08em;margin-top:2px}
.ph-btns{display:flex;gap:6px}
.pbtn{min-width:52px;height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--uiLine);background:var(--uiCard);font:600 13px var(--f-sans);color:var(--uiText);display:flex;align-items:center;justify-content:center;gap:5px}
.pbtn[aria-pressed="true"]{background:var(--uiText);color:var(--ui);border-color:var(--uiText)}
.pbtn:disabled{opacity:.4;cursor:default}
.ph-prog{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--uiLine);font:500 11px var(--f-sans);color:var(--uiSub);letter-spacing:.06em}
.ph-prog .st{display:flex;align-items:center;gap:4px;flex:1}
.ph-prog .st::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--uiSub);flex:0 0 auto}
.ph-prog .st.now{color:var(--red);font-weight:700}.ph-prog .st.now::before{border-color:var(--red);background:rgba(181,50,30,.2)}
.ph-prog .st.done{color:var(--uiText)}.ph-prog .st.done::before{background:var(--uiText);border-color:var(--uiText)}
.ph-log{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 24px;scroll-behavior:smooth;overscroll-behavior:contain}
.ph-log p{margin:0 0 10px;font:600 15px/1.75 var(--f-serif);color:var(--uiText)}
.ph-log p .tag{display:inline-block;font:700 10px/1 var(--f-sans);color:var(--red);border:1px solid rgba(181,50,30,.45);border-radius:3px;padding:3px 4px;margin-right:6px;vertical-align:2px;letter-spacing:.1em}
.ph-log .chap{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font:700 12px var(--f-sans);letter-spacing:.3em;color:var(--red)}
.ph-log .chap::before,.ph-log .chap::after{content:"";flex:1;height:1px;background:rgba(181,50,30,.35)}
.ph-log .dec{margin:4px 0 14px;padding:10px 12px;border-radius:12px;background:var(--uiText);color:var(--ui);font:500 13px/1.5 var(--f-sans)}
.ph-log .dec b{color:#f3a48c;font-weight:700}
.ph-log .dec small{display:block;opacity:.7;font-size:11.5px;margin-top:2px}
.ph-log .wait{font:500 13px var(--f-sans);color:var(--uiSub)}

/* 且慢面板 */
.sheet{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--ui);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);z-index:5}
.sheet.on{transform:none}
.sh-head{flex:0 0 auto;background:var(--red);color:var(--paperHi);padding:16px 16px 14px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(-35deg,rgba(0,0,0,.09) 0 2px,transparent 2px 7px)}
.sh-title{font:400 44px/1 var(--f-cursive);letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sh-sub{font:500 12px/1.4 var(--f-sans);letter-spacing:.12em;opacity:.9;margin-top:6px;padding-right:76px}
.sh-ring{position:absolute;right:14px;top:14px;width:62px;height:62px}
.sh-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sh-ring .bg{stroke:rgba(248,239,217,.25)}.sh-ring .fg{stroke:var(--paperHi);transition:stroke-dashoffset .12s linear}
.sh-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 24px var(--f-sans)}
.sh-prompt{flex:0 0 auto;padding:14px 16px 6px;font:700 17px/1.5 var(--f-serif);color:var(--uiText)}
.sh-opts{flex:0 1 auto;min-height:0;overflow-y:auto;padding:6px 14px 6px;display:flex;flex-direction:column;gap:10px}
.opt{position:relative;width:100%;min-height:68px;border-radius:14px;border:1.5px solid var(--uiLine);background:var(--uiCard);text-align:left;padding:10px 14px;display:flex;align-items:center;gap:10px;overflow:hidden;transition:border-color .2s, transform .12s}
.opt:active{transform:scale(.985)}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(181,50,30,.13);transition:width .25s ease-out}
.opt .mn{position:relative;flex:1;min-width:0}
.opt .mn b{display:block;font:700 16px/1.35 var(--f-serif);color:var(--uiText)}
.opt .mn small{display:block;font:400 12.5px/1.4 var(--f-sans);color:var(--uiSub);margin-top:2px}
.opt .num{position:relative;text-align:right;font:500 11px var(--f-sans);color:var(--uiSub);white-space:nowrap}
.opt .num em{display:block;font:700 19px/1.1 var(--f-sans);font-style:normal;color:var(--uiText)}
.opt .me{position:absolute;right:64px;top:-1px;font:700 10px var(--f-sans);background:var(--red);color:var(--paperHi);padding:3px 7px;border-radius:0 0 6px 6px;letter-spacing:.08em;display:none}
.opt.mine{border-color:var(--red);box-shadow:0 0 0 2px rgba(181,50,30,.18) inset}
.opt.mine .me{display:block}
.opt.mine .bar{background:rgba(181,50,30,.22)}
.opt.win{border-color:var(--uiText);background:var(--uiText)}
.opt.win .mn b,.opt.win .num em{color:var(--paperHi)}.opt.win .mn small,.opt.win .num{color:rgba(248,239,217,.7)}
.opt.win .bar{background:rgba(210,74,44,.55)}
.opt.lose{opacity:.45}
.sh-feed{flex:1;min-height:0;overflow:hidden;margin:4px 14px 0;padding:8px 2px 0;border-top:1px dashed var(--uiLine);display:flex;flex-direction:column;gap:5px;
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.sh-feed div{font:400 12px/1.45 var(--f-sans);color:var(--uiSub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:feedIn .3s ease-out}
.sh-feed div b{color:var(--uiText);font-weight:600}.sh-feed div.me b{color:var(--red)}
@keyframes feedIn{from{opacity:0;transform:translateY(-6px)}}
.sh-foot{flex:0 0 auto;padding:8px 16px 14px;font:500 12px/1.5 var(--f-sans);color:var(--uiSub);display:flex;justify-content:space-between;gap:10px}
.sh-foot b{color:var(--red)}
.toast{position:absolute;left:14px;right:14px;bottom:14px;z-index:6;background:var(--uiText);color:var(--ui);border-radius:14px;padding:12px 14px;font:500 13px/1.5 var(--f-sans);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.25,1),visibility .35s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:none;visibility:visible}
.toast b{color:#f3a48c}

/* ---------- 开场海报 ---------- */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#120d09;transition:opacity .7s ease, visibility .7s;
  background-image:repeating-linear-gradient(-32deg,rgba(238,224,192,.035) 0 1px,transparent 1px 6px)}
#intro.gone{opacity:0;visibility:hidden}
.poster{position:relative;height:min(94vh,860px);aspect-ratio:3/4.1;max-width:94vw;background:var(--paper);color:var(--ink);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#posterCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pz{position:absolute;left:0;right:0;text-align:center}
.pz-top{top:5.2%;display:flex;justify-content:center;align-items:center;gap:14px;font:700 clamp(11px,1.5vh,14px) var(--f-sans);letter-spacing:.4em;color:var(--ink)}
.pz-top .seal{font:400 clamp(20px,3.2vh,30px)/1 var(--f-brush);letter-spacing:.18em;color:var(--paperHi);background:var(--red);padding:7px 6px 7px 14px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.pz-title{top:11%;font:400 clamp(46px,min(11.5vh,16.5vw),108px)/1.05 var(--f-brush);letter-spacing:.04em;color:var(--ink);margin:0}
.pz-sub{top:24.6%;font:700 clamp(13px,1.9vh,17px)/1.5 var(--f-serif);letter-spacing:.28em;color:var(--red2)}
.pz-bot{bottom:4.5%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 7%}
.pz-tag{font:700 clamp(13px,1.8vh,16px)/1.6 var(--f-serif);color:var(--ink);letter-spacing:.08em}
.pz-enter{display:flex;align-items:center;gap:14px}
#qr{width:64px;height:64px;background:var(--paperHi);padding:4px;border:2px solid var(--ink);display:block}
#btnEnter{height:60px;padding:0 30px;border-radius:2px;border:2.5px solid var(--ink);background:var(--red);color:var(--paperHi);font:400 30px/1 var(--f-brush);letter-spacing:.18em;box-shadow:4px 4px 0 var(--ink);transition:transform .1s, box-shadow .1s}
#btnEnter:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pz-foot{font:500 11px var(--f-sans);color:var(--ink3);letter-spacing:.14em}

/* ---------- 散场回目 ---------- */
#finale{position:fixed;inset:0;z-index:15;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:26px 14px 30px;background:rgba(14,10,7,.88);opacity:0;visibility:hidden;transition:opacity .6s, visibility .6s}
#finale.on{opacity:1;visibility:visible}
.fin{position:relative;width:min(600px,100%);background:var(--paper);color:var(--ink);padding:30px 28px 26px;margin:auto 0;box-shadow:0 30px 80px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(-30deg,rgba(23,17,12,.05) 0 1px,transparent 1px 5px)}
.fin::before{content:"";position:absolute;inset:9px;border:2.5px solid var(--ink);pointer-events:none}
.fin::after{content:"";position:absolute;inset:15px;border:1px solid var(--ink);pointer-events:none}
.fin-top{display:flex;align-items:center;justify-content:center;gap:12px;font:700 13px var(--f-sans);letter-spacing:.42em}
.fin-top .seal{font:400 20px/1 var(--f-brush);color:var(--paperHi);background:var(--red);padding:6px 4px 6px 10px;border:2px solid var(--ink);letter-spacing:.2em}
.fin h2{margin:12px 0 4px;text-align:center;font:400 46px/1.1 var(--f-brush);letter-spacing:.08em}
.fin-hui{display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;margin:16px auto 8px;gap:0}
.fin-hui .col{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;margin:0 5px;font:900 27px/1.2 var(--f-serif);letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.fin-hui .col.n{font:700 15px/1 var(--f-sans);letter-spacing:.4em;color:var(--red);margin:0 6px;padding-top:4px}
.fin-hui .gap{align-self:stretch;width:1.5px;background:rgba(23,17,12,.3);margin:0 16px}
.fin-flat{text-align:center;font:600 13px/1.7 var(--f-serif);color:var(--ink3)}
.fin-end{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 18px}
.fin-end .seal{font:400 30px/1 var(--f-brush);color:var(--paperHi);background:var(--red);padding:10px 8px 10px 14px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);letter-spacing:.14em}
.fin-end div{font:700 15px/1.6 var(--f-serif)}
.fin-end small{display:block;font:500 12px var(--f-sans);color:var(--ink3);letter-spacing:.14em}
.fin-votes{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:10px 0 4px}
.fv{padding:8px 0 10px;border-bottom:1px dashed rgba(23,17,12,.28)}
.fv:last-child{border-bottom:0}
.fv-h{font:700 13px/1.5 var(--f-sans);margin-bottom:6px;display:flex;gap:8px}
.fv-h span{color:var(--red);white-space:nowrap}
.fv-r{display:grid;grid-template-columns:minmax(0,11em) 1fr 3.2em;align-items:center;gap:8px;font:500 12.5px/1.3 var(--f-sans);margin:3px 0}
.fv-r .lb{display:flex;align-items:center;min-width:0;white-space:nowrap}.fv-r .lb span.t{overflow:hidden;text-overflow:ellipsis}.fv-r .you{flex:0 0 auto}
.fv-r .tr{height:10px;background:rgba(23,17,12,.1);position:relative}
.fv-r .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3)}
.fv-r.w .tr i{background:var(--red)}
.fv-r.w .lb{font-weight:700}
.fv-r .pc{text-align:right;font-weight:700}
.fv-r .you{font:700 10px var(--f-sans);color:var(--paperHi);background:var(--ink);padding:1px 4px;margin-left:4px;border-radius:2px}
.fin-stats{margin:12px 0 6px;text-align:center;font:500 12.5px/1.7 var(--f-sans);color:var(--ink2)}
.fin-export{margin:8px 0 14px;font:500 12.5px/1.75 var(--f-sans);color:var(--ink3);text-align:center;padding:0 6px}
.fin-export b{color:var(--red2)}
.fin-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.fbtn{min-height:48px;padding:0 22px;border:2px solid var(--ink);background:var(--paperHi);color:var(--ink);font:700 15px var(--f-sans);letter-spacing:.12em;box-shadow:3px 3px 0 var(--ink)}
.fbtn.pri{background:var(--red);color:var(--paperHi)}
.fbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

#mute{position:fixed;top:10px;right:10px;z-index:30;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(238,224,192,.35);background:rgba(23,17,12,.78);color:var(--paper);display:flex;align-items:center;justify-content:center;padding:0}
#mute svg{width:22px;height:22px}
#mute .x{display:none}#mute.muted .x{display:inline}#mute.muted .w{display:none}

/* ---------- 手机竖屏：手机面板即主界面 ---------- */
@media (max-width:820px), (max-aspect-ratio:1/1){
  #app{flex-direction:column}
  #stageCol{flex:0 0 auto;height:calc(min(36vh,330px) + 92px)}
  #stageWrap{flex:1}
  #lyric{min-height:0;height:92px;padding:10px 16px 10px;border-top-width:2px}
  #lyLabel{font-size:11px;margin-bottom:5px}
  #lyText{font-size:16px;line-height:1.55;min-height:3.1em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #lyHint{display:none}
  #phoneCol{flex:1;min-height:0;padding:0;background:var(--ui);border:0}
  #phoneCap{display:none}
  #phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .ph-status{display:none}
  .ph-head{padding:8px 14px 8px}
  .ph-book{font-size:18px;margin-top:3px}
  .ph-book small{font-size:11px}
  .ph-prog{padding:6px 14px}
  .sh-head{padding:12px 14px 12px}

const ACT_NAMES = { slam: '醒木', fan: '摇扇', bow: '抱拳', point: '指点' };

// 解析一行：返回 { text, act, cond, chapter }
function parseLine(raw) {
  let s = String(raw), act = null, cond = null, chapter = null;
  if (s.charAt(0) === '#') return { text: '', act: null, cond: null, chapter: s.slice(1).trim() };
  let m;
  for (;;) {
    if ((m = /^\?(q\w+)=([A-Z|]+)\s*/.exec(s))) { cond = { q: m[1], any: m[2].split('|') }; s = s.slice(m[0].length); continue; }
    if ((m = /^@(slam|fan|bow|point)\s*/.exec(s))) { act = m[1]; s = s.slice(m[0].length); continue; }
    break;
  }
  return { text: s, act: act, cond: cond, chapter: chapter };
}
function condOk(cond, picks) {
  if (!cond) return true;
  const v = picks[cond.q];
  return v !== undefined && cond.any.indexOf(v) >= 0;
}

// ---- StoryEngine 抽象 ----
// Segment = { lines:[{text,act,chapter}], choice: {id,slot,prompt,options}|null, ending: {...}|null }
// Decision = { choiceId, optionId, label, tally:{A:n,...}, share, playerPick }
class StoryEngine {
  begin() { throw new Error('StoryEngine.begin 未实现'); }        // -> Promise<Segment>
  continue(decision) { throw new Error('StoryEngine.continue 未实现'); } // -> Promise<Segment>
}

// 默认引擎：读剧本树
class TreeEngine extends StoryEngine {
  constructor(script) { super(); this.s = script; this.picks = {}; this.trail = []; }
  begin() { this.picks = {}; this.trail = []; return Promise.resolve(this.segmentFrom(this.s.start)); }
  continue(decision) {
    const ch = this.s.choices[decision.choiceId];
    if (!ch) return Promise.reject(new Error('未知且慢点 ' + decision.choiceId));
    const opt = ch.options.find(o => o.id === decision.optionId);
    if (!opt) return Promise.reject(new Error('未知选项 ' + decision.optionId));
    this.picks[decision.choiceId] = opt.id;
    return Promise.resolve(this.segmentFrom(opt.to));
  }
  segmentFrom(id) {
    const lines = [];
    let node = null, guard = 0;
    for (;;) {
      node = this.s.nodes[id];
      if (!node) throw new Error('悬空节点 ' + id);
      this.trail.push(id);
      for (const raw of node.lines) {
        const L = parseLine(raw);
        if (condOk(L.cond, this.picks)) lines.push({ text: L.text, act: L.act, chapter: L.chapter });
      }
      if (node.next && ++guard < 50) { id = node.next; continue; }
      break;
    }
    let choice = null, ending = null;
    if (node.q) {
      const c = this.s.choices[node.q];
      choice = { id: node.q, slot: c.slot, prompt: c.prompt, options: c.options.map(o => ({ id: o.id, label: o.label, desc: o.desc, hui: o.hui, tags: o.tags })) };
    } else if (node.end) {
      const L = parseLine(this.s.closing);
      lines.push({ text: L.text, act: L.act, chapter: null });
      ending = Object.assign({}, node.end);
    }
    return { lines: lines, choice: choice, ending: ending };
  }
}

/* ---------------------------------------------------------------------------
 * LocalLLMEngine —— 参赛版接口桩（本 demo 默认不启用，走 TreeEngine）
 *
 * 部署：在 NVIDIA DGX Spark（GB10，128GB 统一内存）上本地起一个 OpenAI 兼容服务，例如
 *     vllm serve Qwen/Qwen3-32B --max-model-len 16384 --enable-prefix-caching
 *   或 llama.cpp：
 *     llama-server -m qwen2.5-14b-instruct-q5_k_m.gguf -c 16384 --parallel 8 --port 8000
 *   页面加 ?engine=llm&endpoint=http://spark.local:8000 即切到本引擎。
 *
 * 为什么非得本地：
 *   1) 低延迟：醒木一落，说书人得马上开口。局域网 + 前缀缓存（定场诗、人物表、风格约束都是固定前缀），
 *      首 token 约 200ms，流式出字，比云端往返稳。
 *   2) 多人并发：一场五十部手机同时投票、展台上几场书同时开，vLLM 的 continuous batching 一台机器扛得住。
 *   3) 展台离线：会场网络靠不住，故事不能断在半句上；模型、语音、剧本都在一台机器里。
 *
 * 提示词结构：
 *   system：评书风格约束——每句不超过 40 字；口头禅「列位看官」「说时迟那时快」「欲知后事如何」；
 *           每句可带动作标记 @slam/@fan/@bow/@point；人物表（沈三更、阿豆、柳十娘、书生、卖炭老汉）；
 *           禁止出现任何现有作品的人物和情节；节奏有张有弛，关键处停在悬念上。
 *   user：  已发生剧情摘要（每段一句）+ 最近两段原文 + 本次「且慢」的观众投票合并结果：
 *           「得票最高：X（52%）」作为本段必须执行的走向；「次高：Y（31%）」作为可选伏笔。
 *   输出：  JSON { lines:[{text,act}], choice:{prompt, options:[{id,label,desc,hui}]} | null, ending:{name,line}|null }
 *           hui 是七字回目短语，散场时拼成章回体标题。
 *
 * 安全阀：返回不合 schema、超时（2.5s）或断网，就回落到 TreeEngine 的对应节点，台上不冷场。
 * ------------------------------------------------------------------------- */
class LocalLLMEngine extends StoryEngine {
  constructor(opts) {
    super();
    this.endpoint = (opts && opts.endpoint) || 'http://localhost:8000';
    this.model = (opts && opts.model) || 'Qwen/Qwen3-32B';
    this.fallback = new TreeEngine(SCRIPT);   // 兜底：与剧本树保持同一套 Segment 结构
    this.history = [];                         // 已说过的段落原文
    this.summary = [];                         // 每段一句的剧情摘要（参赛版由模型自己产出）
  }
  systemPrompt() {
    return [
      '你是茶馆里的评书艺人，正在现场说一部原创短篇评书《雪夜追镖》。',
      '口吻：评书腔，节奏有张有弛；常用「列位看官」「说时迟那时快」「欲知后事如何」。',
      '每句不超过40字，可在句首加动作标记 @slam(拍醒木) @fan(摇扇) @bow(抱拳) @point(指点)。',
      '人物：镖头沈三更、徒弟阿豆、掌柜柳十娘、背书箱的书生、卖炭老汉；不得出现任何现有作品的人物与情节。',
      '只输出 JSON：{"lines":[{"text":"","act":""}],"choice":{"prompt":"","options":[{"id":"A","label":"","desc":"","hui":"七字回目"}]}|null,"ending":{"name":"","line":""}|null}'
    ].join('\n');
  }
  userPrompt(decision) {
    const t = decision && decision.tally ? decision.tally : {};
    const ranked = Object.keys(t).sort((a, b) => t[b] - t[a]);
    return [
      '【前情】' + this.summary.join(' / '),
      '【最近原文】' + this.history.slice(-2).join('\n'),
      decision ? '【台下且慢】得票最高：' + decision.label + '（' + Math.round((decision.share || 0) * 100) + '%），本段必须顺着它说；' +
        (ranked[1] ? '次高的选项可以埋成伏笔。' : '') : '【开书】从定场诗开始。',
      '续写下一段 6–10 句，停在下一个悬念上，给出 2–3 个且慢选项。'
    ].join('\n');
  }
  async ask(decision) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 2500);
    try {
      const res = await fetch(this.endpoint + '/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl ? ctrl.signal : undefined,

// ---- 模拟现场观众与投票 ----
const TAGS = ['thrill', 'mystery', 'warm', 'humor', 'justice'];
const TAG_CN = { thrill: '爱看打', mystery: '爱猜谜', warm: '爱听情', humor: '爱逗乐', justice: '爱讲理' };
function makeCrowd(rng, n) {
  const crowd = [];
  for (let i = 0; i < n; i++) {
    const pref = {};
    TAGS.forEach(t => { pref[t] = rng() * 0.45; });
    pref[TAGS[Math.floor(rng() * TAGS.length)]] += 0.75;
    crowd.push({ id: i, pref: pref, conform: 0.15 + rng() * 0.85, lazy: rng() < 0.1 });
  }
  return crowd;
}
const PLAYER_WEIGHT = 3;
function gumbel(rng) { return -Math.log(-Math.log(Math.max(1e-9, rng()))); }

class VoteSim {
  constructor(choice, crowd, rng, duration) {
    this.rng = rng; this.dur = duration || 8000;
    this.opts = choice.options.map(o => ({ id: o.id, tags: o.tags || {}, n: 0 }));
    this.player = -1; this.playerAt = -1;
    this.queue = [];
    crowd.forEach(c => {
      if (c.lazy && rng() < 0.7) return;
      // 越往后喊的人越多：先少后多，最后两秒最热闹
      const at = 500 + Math.pow(rng(), 0.75) * (this.dur - 900);
      this.queue.push({ c: c, at: at });
    });
    this.queue.sort((a, b) => a.at - b.at);
    this.voted = 0; this.events = [];
  }
  setPlayer(optId, t) {
    const i = this.opts.findIndex(o => o.id === optId);
    if (i < 0) return;
    if (this.player < 0) this.playerAt = t;
    this.player = i;
  }
  totals() { return this.opts.map((o, i) => o.n + (this.player === i ? PLAYER_WEIGHT : 0)); }
  cast(c) {
    const tot = this.totals(), sum = tot.reduce((a, b) => a + b, 0);
    let best = -1, bestS = -1e9;
    for (let i = 0; i < this.opts.length; i++) {
      const o = this.opts[i];
      let base = 0;
      for (const k in o.tags) base += (c.pref[k] || 0) * o.tags[k];
      const share = sum ? tot[i] / sum : 1 / this.opts.length;
      const pull = this.player === i ? 0.22 * c.conform : 0;       // 有人带头喊，旁边的人容易跟
      const s = 1.6 * base + 0.8 * c.conform * share + pull + gumbel(this.rng) * 0.5;
      if (s > bestS) { bestS = s; best = i; }
    }
    this.opts[best].n++; this.voted++;
    return best;
  }
  advance(t) {            // 推进到第 t 毫秒，返回这期间新投的票（选项下标数组）
    const out = [];
    while (this.queue.length && this.queue[0].at <= t) { const c = this.queue.shift().c, i = this.cast(c); out.push(i); this.events.push({ c: c, i: i }); }
    return out;
  }
  finish() { this.advance(Infinity); return this.result(); }
  result() {
    const tot = this.totals(), sum = tot.reduce((a, b) => a + b, 0) || 1;
    let w = 0;
    for (let i = 1; i < tot.length; i++) {
      if (tot[i] > tot[w] || (tot[i] === tot[w] && i === this.player)) w = i;
    }
    const tally = {};
    this.opts.forEach((o, i) => { tally[o.id] = tot[i]; });
    return { winner: this.opts[w].id, tally: tally, share: tot[w] / sum, total: sum, playerPick: this.player >= 0 ? this.opts[this.player].id : null };
  }
}

const HUI_NUM = ['第一回', '第二回'];
function buildHuimu(script, decisions, ending) {
  const bySlot = [];
  decisions.forEach(d => {
    const ch = script.choices[d.choiceId];
    const opt = ch && ch.options.find(o => o.id === d.optionId);
    const slot = ch ? ch.slot : bySlot.length;
    bySlot[slot] = opt ? opt.hui : (d.hui || d.label || '');

    const a = bySlot[k * 2], b = bySlot[k * 2 + 1];
    hui.push({ num: HUI_NUM[k], a: a || '', b: b || '' });
  }
  return { book: script.title, hui: hui, ending: ending ? ending.name : '', endingLine: ending ? ending.line : '' };
}

// ===================== 木刻笔触工具 =====================
function wob(g, x1, y1, x2, y2, rng, amp) {
  const n = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 26));
  g.moveTo(x1, y1);
  for (let i = 1; i <= n; i++) { const t = i / n, j = i < n ? 1 : 0; g.lineTo(x1 + (x2 - x1) * t + (rng() - .5) * amp * j, y1 + (y2 - y1) * t + (rng() - .5) * amp * j); }
}
// 排线：在当前裁剪区内画平行刻线
function hatch(g, rng, bx, by, bw, bh, ang, gap, lw, col, amp) {
  g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
  const cx = bx + bw / 2, cy = by + bh / 2, R = Math.hypot(bw, bh) / 2 + 4;
  g.translate(cx, cy); g.rotate(ang); g.beginPath();
  for (let y = -R; y <= R; y += gap) { const j = (rng() - .5) * gap * .35; wob(g, -R, y + j, R, y + j + (rng() - .5) * gap * .4, rng, amp == null ? .9 : amp); }
  g.stroke(); g.restore();
}
// 刀痕：两头尖、中间鼓的一刀
function knife(g, x1, y1, x2, y2, w, bend) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, b = bend || 0;
  const mx = (x1 + x2) / 2 + nx * b, my = (y1 + y2) / 2 + ny * b;
  g.beginPath(); g.moveTo(x1, y1);
  g.quadraticCurveTo(mx + nx * w, my + ny * w, x2, y2);
  g.quadraticCurveTo(mx - nx * w * .25, my - ny * w * .25, x1, y1); g.fill();
}
// 刀口碎屑：黑地上随机挑掉的小块
function chips(g, rng, bx, by, bw, bh, n, len, col) {
  g.fillStyle = col;
  for (let i = 0; i < n; i++) { const x = bx + rng() * bw, y = by + rng() * bh, a = rng() * Math.PI, l = len * (.4 + rng()); knife(g, x, y, x + Math.cos(a) * l, y + Math.sin(a) * l, l * .18, 0); }
}
function meander(g, x0, y0, x1, h, lw, col) { // 回纹
  g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'square'; g.beginPath();
  const u = h; for (let x = x0; x < x1 - u * .5; x += u * 1.15) {
    const a = x, b = y0, s = u;
    g.moveTo(a, b + s); g.lineTo(a, b); g.lineTo(a + s, b); g.lineTo(a + s, b + s * .78); g.lineTo(a + s * .25, b + s * .78); g.lineTo(a + s * .25, b + s * .25); g.lineTo(a + s * .72, b + s * .25); g.lineTo(a + s * .72, b + s * .52);
  }
  g.stroke();
}

(function initVoiceBtn() {
  const b = $('btnVoice');
  if (!Voice.ok) { b.disabled = true; b.title = '这台设备不支持朗读，字幕照常'; return; }
  b.addEventListener('click', () => {
    Voice.on = !Voice.on; b.setAttribute('aria-pressed', String(Voice.on)); b.textContent = Voice.on ? '声开' : '开声';
    if (!Voice.on) { Voice.stop(); if (show.typing) show.typing.speechDone = true; }
    else { Voice.pick(); toast('说书人<b>开口</b>了。设备没有中文语音时，会静静地只出字幕。', 2600); }
  });
})();
$('btnSpeed').addEventListener('click', () => {
  show.speed = show.speed === 1 ? 2 : 1; const b = $('btnSpeed'); b.textContent = show.speed + '×'; b.setAttribute('aria-pressed', String(show.speed > 1));
});
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; skip(); e.preventDefault(); }
  if (show.vote && /^[1-3]$/.test(e.key)) { const o = show.vote.choice.options[+e.key - 1]; if (o) playerVote(o.id); }
});

// ===================== 尺寸与主循环 =====================
let rsTimer = 0;
function onResize() { clearTimeout(rsTimer); rsTimer = setTimeout(() => { resizeStage(); if (poster.running) resizePoster(); }, 60); }
window.addEventListener('resize', onResize);
try { if (window.ResizeObserver) new ResizeObserver(onResize).observe($('stageWrap')); } catch (e) {}
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { stage.bg = null; resizeStage(); poster.bg = null; if (poster.running) resizePoster(); }); } catch (e) {}

let lastFrame = 0;
function tick(now) {
  lastFrame = now;
  if (poster.running) drawPoster(now);
  updateTyping(now);
  updateVote(now);
  teller.update(now, talking());
  drawStage(now);
}
function frame(now) { tick(nowMs()); requestAnimationFrame(frame); }
// rAF 被节流（后台页、无头浏览器）时，用定时器兜底；一切都按 performance.now 计时，不按帧累加
setInterval(() => { const n = nowMs(); if (n - lastFrame > 120) tick(n); }, 100);
resizeStage(); resizePoster(); drawPoster(nowMs()); drawStage(nowMs());
requestAnimationFrame(frame);

// 测试钩子（仅供自动截图）：跳到某个节点开说
window.__wuxian = {
  jump(nodeId, picks, decisions) {
    const token = ++show.token; show.engine = new TreeEngine(SCRIPT); show.engine.picks = Object.assign({}, picks || {});
    show.rng = mulberry32(7); show.crowd = makeCrowd(show.rng, 47); show.decisions = decisions || []; show.lines = []; show.chars = 0; show.t0 = nowMs() - 8 * 60000;
    $('phLive').textContent = '在场 48 人'; ui.log.innerHTML = ''; ui.lyChap.textContent = /^(n[0-3]|n1)/.test(nodeId) ? '第一回' : '第二回';
    const seg = show.engine.segmentFrom(nodeId);
    (async () => {
      let s = seg;
      for (;;) {
        for (const L of s.lines) { await playLine(L, token); if (token !== show.token) return; }
        if (!s.choice) break;
        const d = await runVote(s.choice, token); if (token !== show.token) return;
        s = await show.engine.continue(d);
      }
      showFinale(s.ending);
    })();
  },
  speed(x) { show.speed = x; },
  vote(i) { if (show.vote) playerVote(show.vote.choice.options[i].id); },
  finale(ending, decisions) { show.decisions = decisions; showFinale(ending); }
};
})();
</script>
