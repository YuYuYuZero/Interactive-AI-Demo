<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月下红线</title>
<meta name="theme-color" content="#0a0f2c">
<meta name="description" content="替月老理红线：拖动线结，让所有红线不再交叉。120 段小故事，收进姻缘簿。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#f3e4c4; --ink2:rgba(243,228,196,.68);
  --red:#c62a27; --red-d:#8c171c; --gold:#e6b65c; --gold-d:#a77a2c;
  --paper:#f2e6ca; --paper-ink:#3a1f15;
  --fh:"ZCOOL XiaoWei","Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC","Songti SC",serif;
  --fb:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --fl:"Ma Shan Zheng","ZCOOL XiaoWei","STKaiti","KaiTi","Kaiti SC",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --tex:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0a0f2c}
body{font-family:var(--fb);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;opacity:0;transition:opacity .45s ease}
.screen.on{display:flex}
.screen.vis{opacity:1}

/* ---------- buttons ---------- */
.btn{position:relative;min-height:44px;padding:10px 28px;border:none;border-radius:6px;cursor:pointer;font-family:var(--fh);font-size:20px;letter-spacing:.18em;color:#fff2dc;
  background:linear-gradient(180deg,#d1342e,#99191e);
  box-shadow:0 0 0 1px #e6b65c,0 0 0 4px rgba(153,25,30,.35),0 8px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,180,.35);transition:transform .15s ease,filter .2s}
.btn::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(255,222,170,.5);border-radius:3px;pointer-events:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.big{font-size:26px;padding:14px 50px;letter-spacing:.3em}
.btn.ghost{background:rgba(10,14,40,.55);box-shadow:0 0 0 1px rgba(230,182,92,.6),0 6px 14px rgba(0,0,0,.3)}
.btn.ghost::after{border-color:rgba(230,182,92,.25)}
.btn.sm{font-size:16px;padding:8px 14px;letter-spacing:.12em}
.btn.line{background:transparent;color:#8c171c;box-shadow:0 0 0 1px #b8862f}
.btn.line::after{border-color:rgba(184,134,47,.35)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(230,182,92,.55);background:rgba(10,14,40,.55);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.icon-btn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.lv:focus-visible{outline:2px solid #ffd88a;outline-offset:3px}
#mute{position:fixed;top:calc(var(--st) + 10px);right:12px;z-index:40}

/* ---------- title ---------- */
#s-title{justify-content:flex-end;padding:0 20px calc(var(--sb) + 5vh);text-align:center;pointer-events:none}
#s-title .wrap{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{font-family:var(--fl);font-weight:400;font-size:clamp(60px,16vw,120px);line-height:1;margin:0;letter-spacing:.06em;color:#f8e9c8;text-shadow:0 3px 0 #6e1216,0 0 30px rgba(255,140,90,.35);position:relative;padding-right:.1em}
.seal{position:absolute;right:-.5em;top:.02em;font-style:normal;font-size:.19em;line-height:1.15;writing-mode:vertical-rl;background:#b8231f;color:#fbe9d0;padding:.4em .3em;border-radius:3px;transform:rotate(6deg);box-shadow:inset 0 0 0 2px #b8231f,inset 0 0 0 3px #f2c5a0;letter-spacing:.12em;text-shadow:none}
.sub{margin:0 0 10px;font-size:15px;letter-spacing:.24em;color:var(--ink2);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.prog{margin:6px 0 0;font-size:13px;color:var(--ink2);letter-spacing:.1em;min-height:1.2em;text-shadow:0 1px 4px rgba(0,0,0,.8)}

/* ---------- select / book ---------- */
#s-select,#s-book{padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 24px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(rgba(6,8,26,.6),rgba(6,8,26,.25) 34%,rgba(6,8,26,.55))}
.bar{width:100%;max-width:720px;display:flex;align-items:center;gap:12px;min-height:48px;padding-right:56px;flex:none}
.bar h2{font-family:var(--fh);font-weight:400;font-size:26px;margin:0;letter-spacing:.14em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.bar .cnt{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.tabs{display:flex;gap:6px;width:100%;max-width:720px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none;flex:none;touch-action:pan-x pan-y}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:62px;min-height:48px;padding:6px 8px;border:1px solid rgba(230,182,92,.35);background:rgba(10,14,40,.55);border-radius:6px;font-family:var(--fh);font-size:19px;cursor:pointer;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tab small{font-family:var(--fb);font-size:11px;opacity:.75;margin-top:2px}
.tab.on{background:linear-gradient(#c42b27,#8d181d);color:#fff0d8;border-color:var(--gold)}
.ch-info{width:100%;max-width:480px;text-align:center;margin:8px 0 6px;flex:none}
.ch-info h3{font-family:var(--fh);font-weight:400;font-size:30px;margin:4px 0 2px;letter-spacing:.2em;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.ch-info p{margin:2px 0;font-size:13px;color:var(--ink2);letter-spacing:.08em}
.ch-info .new{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;border:1px solid rgba(230,182,92,.5);color:#ffd88a;font-size:12px;background:rgba(10,14,40,.5)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:26px 12px;width:100%;max-width:470px;padding:16px 6px 30px;flex:none}
.lv{position:relative;aspect-ratio:1/1;width:100%;max-width:70px;min-width:44px;justify-self:center;border-radius:50%;border:none;cursor:pointer;font-family:var(--fh);font-size:22px;color:#fff1da;padding:0;
  background:radial-gradient(circle at 36% 30%,#ef6a52,#c62a27 45%,#7c1218 100%);
  box-shadow:0 0 0 2px rgba(230,182,92,.9),0 0 0 5px rgba(140,23,28,.35),0 6px 14px rgba(0,0,0,.45)}
.lv::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(255,215,170,.55);pointer-events:none}
.lv .stars{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);display:flex;gap:2px}
.lv.lock{background:rgba(255,255,255,.04);box-shadow:0 0 0 1px rgba(230,182,92,.32);color:rgba(243,228,196,.3);cursor:default}
.lv.lock::before{border-color:rgba(230,182,92,.15)}
.lv.next{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px #ffd88a,0 0 0 9px rgba(255,190,100,.22),0 6px 14px rgba(0,0,0,.45)}}
.star{display:inline-block;width:11px;height:11px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.off{background:rgba(230,182,92,.22)}
.star.lg{width:26px;height:26px}
.paper{background-color:var(--paper);background-image:var(--tex),radial-gradient(ellipse at 50% 0%,rgba(255,250,235,.7),rgba(255,250,235,0) 60%),linear-gradient(#f4e9cf,#ead9b4);color:var(--paper-ink)}
.book{width:100%;max-width:640px;padding:18px 20px 30px;border-radius:4px;margin-top:10px;box-shadow:0 16px 40px rgba(0,0,0,.45);position:relative;flex:none}
.book::before{content:"";position:absolute;inset:7px;border:1px solid rgba(140,23,28,.3);border-radius:2px;pointer-events:none}
.book .intro{font-size:14px;color:rgba(58,31,21,.7);text-align:center;margin:6px 0 4px;line-height:1.8}
.book h4{font-family:var(--fh);font-weight:400;font-size:22px;color:#8c171c;margin:22px 0 6px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid rgba(140,23,28,.25);padding-bottom:6px}
.book h4 small{font-family:var(--fb);font-size:12px;color:rgba(58,31,21,.55)}
.entry{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(58,31,21,.15);line-height:1.8;font-size:15.5px;align-items:flex-start}
.entry .no{flex:none;width:34px;height:34px;border-radius:50%;background:#b8231f;color:#fbe9d0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:15px;margin-top:2px;box-shadow:inset 0 0 0 2px #b8231f,inset 0 0 0 3px rgba(255,220,190,.6)}
.entry.lock{color:rgba(58,31,21,.38)}
.entry.lock .no{background:transparent;box-shadow:none;border:1px dashed rgba(140,23,28,.35);color:rgba(140,23,28,.45)}

/* ---------- game hud ---------- */
#s-game{pointer-events:none}
.hud{position:absolute;top:calc(var(--st) + 10px);left:12px;right:64px;display:flex;align-items:center;gap:10px}
.hud > *{pointer-events:auto}
.hud-title{flex:1;min-width:0;text-align:center;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.hud-title b{display:block;font-family:var(--fh);font-weight:400;font-size:21px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-title small{font-size:12px;color:var(--ink2);white-space:nowrap}
.pill{position:absolute;top:calc(var(--st) + 64px);left:50%;transform:translateX(-50%);padding:6px 18px;border-radius:999px;background:rgba(8,10,30,.6);border:1px solid rgba(230,182,92,.35);font-size:15px;white-space:nowrap;letter-spacing:.08em;transition:background .35s,color .35s,border-color .35s}
.pill b{color:#ff8a70;font-weight:700;font-size:19px;margin:0 6px;font-family:var(--fh)}
.pill.done{background:rgba(198,42,39,.88);color:#fff3dc;border-color:var(--gold)}
.foot{position:absolute;bottom:calc(var(--sb) + 12px);left:0;right:0;text-align:center;font-size:13px;color:var(--ink2);letter-spacing:.08em;text-shadow:0 1px 4px rgba(0,0,0,.9)}

/* ---------- card ---------- */
#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:30;background:radial-gradient(ellipse at center,rgba(5,6,20,.15),rgba(5,6,20,.55))}
#card.on{display:flex}
.card{width:min(100%,420px);padding:30px 24px 22px;border-radius:4px;position:relative;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.55);animation:cardIn .7s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(140,23,28,.35);border-radius:2px;pointer-events:none}
.card::after{content:"";position:absolute;inset:11px;border:1px dashed rgba(140,23,28,.2);border-radius:2px;pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.card .stamp{position:absolute;right:18px;top:16px;width:46px;height:46px;background:#b8231f;color:#fbe9d0;font-family:var(--fl);font-size:17px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);border-radius:3px;box-shadow:inset 0 0 0 2px #b8231f,inset 0 0 0 3px rgba(255,220,190,.7);opacity:.9}
.card h3{font-family:var(--fh);font-weight:400;font-size:22px;color:#8c171c;margin:0 0 8px;letter-spacing:.14em}
.card .stars{display:flex;gap:6px;justify-content:center;margin:4px 0 2px}
.card .stars .star{background:#c9902e}
.card .stars .star.off{background:rgba(140,23,28,.15)}
.card .meta{font-size:12.5px;color:rgba(58,31,21,.6);margin:6px 0 0}
.story{font-size:18px;line-height:1.95;margin:16px 6px 20px;text-align:justify;text-indent:2em;color:#2e1a12}
.fin{font-family:var(--fh);font-size:18px;color:#8c171c;margin:-6px 0 16px;letter-spacing:.1em}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 46px);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;width:max-content;max-width:min(92vw,440px);padding:12px 18px;border-radius:6px;font-size:15px;line-height:1.7;z-index:35;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #c9a45a}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast i{font-style:normal;color:#9a1b1f;font-weight:700}

@media (max-height:620px){ .logo{font-size:clamp(48px,11vh,90px)} .btn.big{padding:10px 40px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="c" aria-label="月下红线游戏画面"></canvas>
<div id="safe"></div>

<button id="mute" class="icon-btn" aria-label="静音" title="声音">
  <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g id="mw"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g id="mx" style="display:none"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
</button>

<section id="s-title" class="screen">
  <div class="wrap">
    <h1 class="logo">月下红线<i class="seal">月老</i></h1>
    <p class="sub">替月老，理一理人间缠住的红线</p>
    <div class="row"><button class="btn big" id="b-start">去解开</button></div>
    <div class="row"><button class="btn ghost sm" id="b-select">选择章节</button><button class="btn ghost sm" id="b-book">姻缘簿</button></div>
    <p class="prog" id="t-prog"></p>
  </div>
</section>

<section id="s-select" class="screen">
  <header class="bar">
    <button class="icon-btn" id="sel-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>选择红线</h2><span class="cnt" id="sel-cnt"></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="ch-info" id="ch-info"></div>
  <div class="grid" id="grid"></div>
</section>

<section id="s-book" class="screen">
  <header class="bar">
    <button class="icon-btn" id="book-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>姻缘簿</h2><span class="cnt" id="book-cnt"></span>
  </header>
  <div class="book paper" id="book"></div>
</section>

<section id="s-game" class="screen">
  <header class="hud">
    <button class="icon-btn" id="g-back" aria-label="返回选关"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="hud-title"><b id="h-title"></b><small id="h-sub"></small></div>
    <button class="icon-btn" id="g-reset" aria-label="重来" title="重来"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M5 4.5v4h4"/></svg></button>
  </header>
  <div class="pill" id="h-count"></div>
  <div class="foot" id="h-foot"></div>
</section>

<div id="card" role="dialog" aria-modal="true" aria-labelledby="c-ch">
  <div class="card paper">
    <div class="stamp">已<br>解</div>
    <h3 id="c-ch"></h3>
    <div class="stars" id="c-stars"></div>
    <p class="meta" id="c-meta"></p>
    <p class="story" id="c-story"></p>
    <p class="fin" id="c-fin" style="display:none">一百二十段红线，都理顺了。</p>
    <div class="acts">
      <button class="btn" id="c-next">下一段</button>
      <button class="btn line sm" id="c-again">再理一次</button>
      <button class="btn line sm" id="c-sel">选关</button>
    </div>
  </div>
</div>
<div id="toast" class="toast paper" role="status"></div>

<script>
(function(){
'use strict';
/*GEN-START*/
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const LEVEL_COUNT=120, PER_CH=20;
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function orient(ax,ay,bx,by,cx,cy){return (bx-ax)*(cy-ay)-(by-ay)*(cx-ax);}
function segX(ax,ay,bx,by,cx,cy,dx,dy){
  const d1=orient(cx,cy,dx,dy,ax,ay), d2=orient(cx,cy,dx,dy,bx,by);
  if(!((d1>0&&d2<0)||(d1<0&&d2>0))) return false;
  const d3=orient(ax,ay,bx,by,cx,cy), d4=orient(ax,ay,bx,by,dx,dy);
  return (d3>0&&d4<0)||(d3<0&&d4>0);
}
/* P: [{x,y}], E: [[a,b,w]]  ->  total weighted crossings, per-edge hit flags, optional intersection points */
function crossInfo(P,E,wantPts){
  const m=E.length; let total=0; const hit=new Uint8Array(m); const pts=wantPts?[]:null;
  for(let i=0;i<m;i++){
    const a=E[i][0],b=E[i][1],A=P[a],B=P[b];
    for(let j=i+1;j<m;j++){
      const c=E[j][0],d=E[j][1];
      if(c===a||c===b||d===a||d===b) continue;
      const C=P[c],D=P[d];
      if(segX(A.x,A.y,B.x,B.y,C.x,C.y,D.x,D.y)){
        total+=E[i][2]*E[j][2]; hit[i]=1; hit[j]=1;
        if(pts){const d3=orient(A.x,A.y,B.x,B.y,C.x,C.y),d4=orient(A.x,A.y,B.x,B.y,D.x,D.y);const u=d3/(d3-d4);pts.push({x:C.x+(D.x-C.x)*u,y:C.y+(D.y-C.y)*u,w:E[i][2]*E[j][2]});}
      }
    }
  }
  return {total,hit,pts};
}
function levelParams(i){
  const ch=Math.floor(i/PER_CH), k=i%PER_CH, t=i/(LEVEL_COUNT-1);
  const n=4+Math.round(18*t);                       // 4 .. 22 nodes
  const dens=1.24+0.56*t+(k%5===4?0.1:0);            // edges per node
  let pins=0,dbl=0;
  if(ch===2) pins=k<10?1:2;                          // 中秋：金色钉结
  if(ch===3){dbl=1+Math.floor(k/7);pins=k%2;}        // 重阳：双股线
  if(ch===4){pins=1+(k%2);dbl=2;}
  if(ch===5){pins=2;dbl=2+(k%3===0?1:0);}
  const scatter=ch>=1&&k%4===3;
  return {ch,k,n,dens,pins,dbl,scatter,t};
}
function genPoints(rng,n){
  let dmin=0.66/Math.sqrt(n);
  for(let round=0;round<40;round++){
    const pts=[];let tries=0;
    while(pts.length<n&&tries<5000){
      tries++;
      const x=0.06+rng()*0.88,y=0.06+rng()*0.88;let ok=true;
      for(const p of pts){const dx=p.x-x,dy=p.y-y;if(dx*dx+dy*dy<dmin*dmin){ok=false;break;}}
      if(ok) pts.push({x,y});
    }
    if(pts.length===n) return {pts,dmin};
    dmin*=0.94;
  }
  return null;
}
function distPS(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=clamp(t,0,1);const x=ax+dx*t-px,y=ay+dy*t-py;return Math.sqrt(x*x+y*y);}
/* greedy planar straight-line graph: shortest-first, reject crossings and edges grazing other nodes */
function buildPlanar(rng,pts,clr){
  const n=pts.length,pairs=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const l=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);pairs.push([i,j,l*(0.82+0.36*rng())]);}
  pairs.sort((a,b)=>a[2]-b[2]);
  const E=[];
  for(const pr of pairs){
    const a=pr[0],b=pr[1],A=pts[a],B=pts[b];let ok=true;
    for(let k=0;k<n&&ok;k++){if(k===a||k===b)continue;if(distPS(pts[k].x,pts[k].y,A.x,A.y,B.x,B.y)<clr)ok=false;}
    if(!ok)continue;
    for(const e of E){if(e[0]===a||e[0]===b||e[1]===a||e[1]===b)continue;const C=pts[e[0]],D=pts[e[1]];if(segX(A.x,A.y,B.x,B.y,C.x,C.y,D.x,D.y)){ok=false;break;}}
    if(ok)E.push([a,b]);
  }
  return E;
}
function connected(n,E,skip){
  const adj=Array.from({length:n},()=>[]);
  E.forEach((e,k)=>{if(k===skip)return;adj[e[0]].push(e[1]);adj[e[1]].push(e[0]);});
  const seen=new Uint8Array(n),st=[0];seen[0]=1;let c=1;
  while(st.length){const v=st.pop();for(const w of adj[v])if(!seen[w]){seen[w]=1;c++;st.push(w);}}
  return c===n;
}
function genGraph(rng,n,dens){
  for(let att=0;att<60;att++){
    const gp=genPoints(rng,n);if(!gp)continue;
    const pts=gp.pts;const E=buildPlanar(rng,pts,gp.dmin*0.3);
    if(!connected(n,E,-1))continue;
    const m=clamp(Math.round(n*dens),n,E.length);
    const deg=new Array(n).fill(0);E.forEach(e=>{deg[e[0]]++;deg[e[1]]++;});
    const len=e=>Math.hypot(pts[e[0]].x-pts[e[1]].x,pts[e[0]].y-pts[e[1]].y);
    const order=E.map(e=>({e,s:len(e)*(0.45+rng())})).sort((a,b)=>b.s-a.s).map(o=>o.e);
    for(const e of order){
      if(E.length<=m)break;
      if(deg[e[0]]<=2||deg[e[1]]<=2)continue;
      const k=E.indexOf(e);
      if(!connected(n,E,k))continue;
      E.splice(k,1);deg[e[0]]--;deg[e[1]]--;
    }
    return {pts,E:E.map(e=>[e[0],e[1],1])};
  }
  return null;
}
function placeCircle(pos,ord,off,rad){const L=ord.length;for(let k=0;k<L;k++){const a=off+k*TAU/L;pos[ord[k]]={x:0.5+rad*Math.cos(a),y:0.5+rad*Math.sin(a)};}}
function minPinDist(pos,free,pinned){let m=9;for(const f of free)for(let k=0;k<pos.length;k++){if(!pinned[k])continue;m=Math.min(m,Math.hypot(pos[f].x-pos[k].x,pos[f].y-pos[k].y));}return m;}
function placeScatter(rng,pos,free,pinned,n){
  const dm=0.5/Math.sqrt(n);const placed=[];
  for(let k=0;k<pos.length;k++)if(pinned[k])placed.push(pos[k]);

function scramble(rng,sol,E,pinned,p){
  const n=sol.length,free=[];for(let k=0;k<n;k++)if(!pinned[k])free.push(k);

      if(!placeScatter(rng,pos,free,pinned,n))continue;
    }else{
      const ord=free.slice().sort((a,b)=>Math.atan2(sol[a].y-0.5,sol[a].x-0.5)-Math.atan2(sol[b].y-0.5,sol[b].x-0.5));

}
function genLevel(i){
  const p=levelParams(i);
  const rng=mulberry32(((i+1)*2654435761)^0x5eed1e);
  const G=genGraph(rng,p.n,p.dens);
  const n=p.n,E=G.E,sol=G.pts;
  const deg=new Array(n).fill(0);E.forEach(e=>{deg[e[0]]++;deg[e[1]]++;});
  const pinned=new Array(n).fill(false);
  if(p.pins){
    const cand=[...Array(n).keys()].map(k=>({k,s:Math.hypot(sol[k].x-0.5,sol[k].y-0.5)+rng()*0.12-(deg[k]>=3?0.08:0)})).sort((a,b)=>a.s-b.s);
    let c=0;
    for(const o of cand){if(c>=p.pins)break;if(E.some(e=>(e[0]===o.k&&pinned[e[1]])||(e[1]===o.k&&pinned[e[0]])))continue;pinned[o.k]=true;c++;}
  }
  if(p.dbl){
    const idx=shuffle(E.map((_,k)=>k),rng);let c=0;
    for(const k of idx){if(c>=p.dbl)break;const e=E[k];if(pinned[e[0]]&&pinned[e[1]])continue;e[2]=2;c++;}
  }
  const start=scramble(rng,sol,E,pinned,p);
  const startCross=crossInfo(start,E).total;
  return {i,ch:p.ch,n,sol,start,E,pinned,startCross,par3:Math.round(n*1.4)+2,par2:n*3+6};
}

  for(const dx of [-.16,0,.16]){g.beginPath();g.moveTo(0,s*1.05);g.lineTo(dx*s,s*1.75);g.stroke();}
  g.restore();
}
function drawAmbient(dt){
  const g=ctx,W=vw,H=vh,mv=!reduce,t=T,sc=scene;
  g.save();g.fillStyle='#fff4dc';
  for(const s of amb.tw){const a=mv?.28+.55*(.5+.5*Math.sin(t*s.sp+s.ph)):.6;g.globalAlpha=a;g.beginPath();g.arc(s.x,s.y,s.r*.7,0,TAU);g.fill();
    if(s.r>1.3){g.globalAlpha=a*.45;g.fillRect(s.x-s.r*2.6,s.y-.35,s.r*5.2,.7);g.fillRect(s.x-.35,s.y-s.r*2.6,.7,s.r*5.2);}}

      const fl=mv?.85+.15*Math.sin(t*6+p.ph):1,s=p.s;

      gr=g.createLinearGradient(0,-s,0,s);gr.addColorStop(0,'#ffcf8a');gr.addColorStop(1,'#e0602e');g.fillStyle=gr;g.globalAlpha=.9*fl;
      g.beginPath();g.moveTo(-s*.8,-s);g.lineTo(s*.8,-s);g.lineTo(s*.55,s);g.lineTo(-s*.55,s);g.closePath();g.fill();g.restore();}
  }else if(d==='magpie'){

      const gr=g.createRadialGradient(x,y,0,x,y,7);gr.addColorStop(0,'rgba(220,255,170,'+a+')');gr.addColorStop(1,'rgba(220,255,170,0)');g.fillStyle=gr;g.fillRect(x-7,y-7,14,14);}
    g.restore();

  }else if(d==='mum'){

    for(const p of L){if(mv){p.y+=p.v*dt;p.x+=Math.sin(t*.8+p.ph)*.4;p.rot+=dt*.8;if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}}
      g.globalAlpha=.55;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.beginPath();g.ellipse(0,0,p.s,p.s*.38,0,0,TAU);g.fill();g.restore();}
    g.restore();
  }else if(d==='snow'){
    g.save();g.fillStyle='#eef3ff';
    for(const p of L){if(mv){p.y+=p.v*dt;p.x+=Math.sin(t*.7+p.ph)*.35;if(p.y>H+4){p.y=-4;p.x=Math.random()*W;}}
      g.globalAlpha=.35+p.r*.22;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();}
    g.restore();
  }else if(d==='firework'&&mv){
    amb.fwT-=dt;
    if(amb.fwT<=0&&amb.fw.length<500){amb.fwT=1.1+Math.random()*1.9;const cols=['#ffcf6a','#ff6b4a','#ff9bb0','#fff1c9'];amb.fw.push({r:1,x:W*(.1+Math.random()*.8),y:sc.gy,ty:H*(.08+Math.random()*.3),c:cols[Math.random()*4|0]});}

        if(p.y<=p.ty){amb.fw.splice(i,1);const n=38+Math.random()*22|0,sp=60+Math.random()*60;for(let k=0;k<n;k++){const a=k*TAU/n+Math.random()*.1,v=sp*(.7+Math.random()*.4);amb.fw.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:1.3+Math.random()*.7,c:p.c});}}

      const a=1-p.t/p.life;g.globalAlpha=a*.9;g.strokeStyle=p.c;g.lineWidth=1.4;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.06,p.y-p.vy*.06);g.stroke();}

    g.beginPath();for(let i=2;i<pts.length;i++){const p=pts[i],sd=i%2?1:-1;g.moveTo(p[0],p[1]);g.lineTo(p[0]+sd*3.2,p[1]+2.6);}g.stroke();
  }

    for(const a of sc.anchors){const ang=mv?Math.sin(t*1.4+a.ph)*.09:0;g.save();g.translate(a.x,a.y);g.rotate(ang);g.strokeStyle='rgba(10,8,20,.9)';g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.lineTo(0,a.len);g.stroke();drawLantern(g,0,a.len+a.s*1.7,a.s,0,1);g.restore();}
  }
}

/* ================= ropes ================= */
const K=10;
function makeRopes(m){const r=[];for(let e=0;e<m;e++)r.push({x:new Float32Array(K),y:new Float32Array(K),vx:new Float32Array(K),vy:new Float32Array(K),heat:0});return r;}
function snapRopes(RS,E,P){
  for(let e=0;e<E.length;e++){const r=RS[e],A=P[E[e][0]],B=P[E[e][1]],L=Math.hypot(B.x-A.x,B.y-A.y),sag=Math.min(16,L*.05);
    for(let j=0;j<K;j++){const s=j/(K-1);r.x[j]=A.x+(B.x-A.x)*s;r.y[j]=A.y+(B.y-A.y)*s+sag*4*s*(1-s);r.vx[j]=0;r.vy[j]=0;}}
}
function stepRopes(RS,E,P,hit,dt,tension){
  const steps=Math.min(3,Math.max(1,Math.round(dt*60)));
  for(let e=0;e<E.length;e++){
    const r=RS[e],A=P[E[e][0]],B=P[E[e][1]],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
    const sag=Math.min(16,L*.05)*(1-tension)*(E[e][2]>1?.7:1);
    const h=hit?hit[e]:0;r.heat+=(h-r.heat)*Math.min(1,dt*7);
    const jit=(!reduce&&h&&tension<.5)?1.25:0,nx=-dy/L,ny=dx/L;
    r.x[0]=A.x;r.y[0]=A.y;r.x[K-1]=B.x;r.y[K-1]=B.y;
    if(reduce){for(let j=1;j<K-1;j++){const s=j/(K-1);r.x[j]=A.x+dx*s;r.y[j]=A.y+dy*s+sag*4*s*(1-s);}continue;}
    const k=.1+tension*.16;
    for(let st=0;st<steps;st++){
      for(let j=1;j<K-1;j++){
        const s=j/(K-1);let tx=A.x+dx*s,ty=A.y+dy*s+sag*4*s*(1-s);
        if(jit){const w=Math.sin(T*19+j*1.9+e*2.3)*jit*Math.sin(Math.PI*s);tx+=nx*w;ty+=ny*w;}
        const ax=(tx-r.x[j])*k+(r.x[j-1]+r.x[j+1]-2*r.x[j])*.22,ay=(ty-r.y[j])*k+(r.y[j-1]+r.y[j+1]-2*r.y[j])*.22;
        r.vx[j]=(r.vx[j]+ax)*.85;r.vy[j]=(r.vy[j]+ay)*.85;r.x[j]+=r.vx[j];r.y[j]+=r.vy[j];
      }
    }
  }
}
function kickRopes(RS,E,node,amt){if(reduce)return;for(let e=0;e<E.length;e++){if(E[e][0]!==node&&E[e][1]!==node)continue;const r=RS[e];for(let j=1;j<K-1;j++){const s=Math.sin(Math.PI*j/(K-1));r.vx[j]+=(Math.random()-.5)*amt*s;r.vy[j]+=(Math.random()-.3)*amt*s;}}}
function ropePath(g,r,ox,oy){g.beginPath();g.moveTo(r.x[0]+ox,r.y[0]+oy);for(let j=1;j<K-1;j++){g.quadraticCurveTo(r.x[j]+ox,r.y[j]+oy,(r.x[j]+r.x[j+1])/2+ox,(r.y[j]+r.y[j+1])/2+oy);}g.lineTo(r.x[K-1]+ox,r.y[K-1]+oy);}
function ropeColor(h,gl){let r=212+(98-212)*h,g=42+(20-42)*h,b=34;if(gl>0){r+=(255-r)*gl*.85;g+=(96-g)*gl*.85;b+=(62-b)*gl*.85;}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function drawRopes(g,RS,E,lw,glow,alpha){
  g.save();g.lineCap='round';g.lineJoin='round';if(alpha!=null)g.globalAlpha=alpha;
  const ord=[];for(let e=0;e<E.length;e++)ord.push(e);ord.sort((a,b)=>RS[b].heat-RS[a].heat);
  g.strokeStyle='rgba(4,2,14,.42)';
  for(const e of ord){const w=E[e][2]>1?lw*2.1:lw;g.lineWidth=w+1.2;ropePath(g,RS[e],1.6,3.6);g.stroke();}
  for(const e of ord){
    const r=RS[e],h=r.heat,dbl=E[e][2]>1,w=dbl?lw*2.1:lw;
    if(glow>0){g.shadowColor='rgba(255,110,70,'+(glow*.9)+')';g.shadowBlur=14*glow;}
    g.strokeStyle=ropeColor(h,glow);g.lineWidth=w;ropePath(g,r,0,0);g.stroke();
    g.shadowBlur=0;
    if(dbl){g.setLineDash([w*.55,w*.75]);g.strokeStyle='rgba(70,6,14,'+(.55-h*.2)+')';g.lineWidth=w*.78;ropePath(g,r,0,0);g.stroke();g.setLineDash([]);}
    g.strokeStyle='rgba(255,'+(190+glow*50|0)+','+(150+glow*60|0)+','+(.5*(1-h*.75)+glow*.3)+')';g.lineWidth=Math.max(.8,lw*.32);
    ropePath(g,r,-.6,-w*.28);g.stroke();
  }
  g.restore();
}
function drawCrossMarks(g,pts){
  const pulse=reduce?.5:.5+.5*Math.sin(T*5);
  for(const p of pts){const x=rect.x+p.x*rect.w,y=rect.y+p.y*rect.h,rr=p.w>1?9:7.5,ro=rr+3+pulse*2.5;
    const gr=g.createRadialGradient(x,y,0,x,y,ro+6);gr.addColorStop(0,'rgba(255,120,80,'+(.38+pulse*.2)+')');gr.addColorStop(1,'rgba(255,120,80,0)');
    g.fillStyle=gr;g.fillRect(x-ro-6,y-ro-6,(ro+6)*2,(ro+6)*2);
    g.beginPath();g.arc(x,y,ro,0,TAU);g.strokeStyle='rgba(255,196,150,'+(.6+pulse*.35)+')';g.lineWidth=2;g.stroke();
    g.beginPath();g.arc(x,y,p.w>1?4.8:3.8,0,TAU);g.fillStyle='#5a0d16';g.fill();g.strokeStyle='rgba(255,215,170,.9)';g.lineWidth=1.2;g.stroke();}
}
function drawKnot(g,spr,sh,x,y,s,lift,glow){
  const hs=sh.half*(1+lift*.3);g.globalAlpha=.55+lift*.25;g.drawImage(sh,x-hs+1+lift*4,y-hs+3+lift*8,hs*2,hs*2);g.globalAlpha=1;
  if(glow>0){const gr=g.createRadialGradient(x,y,0,x,y,spr.half*2.2);gr.addColorStop(0,'rgba(255,140,90,'+(.45*glow)+')');gr.addColorStop(1,'rgba(255,140,90,0)');g.fillStyle=gr;g.fillRect(x-spr.half*2.2,y-spr.half*2.2,spr.half*4.4,spr.half*4.4);}
  const h=spr.half*s;g.drawImage(spr,x-h,y-h,h*2,h*2);
}

/* ================= particles ================= */
const parts=[];
function emit(x,y,n,o){o=o||{};if(reduce)n=Math.ceil(n/4);for(let i=0;i<n;i++){const a=Math.random()*TAU,sp=(o.sp||60)*(.35+Math.random());parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),t:0,life:(o.life||1)*(.6+Math.random()*.7),r:(o.r||1.6)*(.6+Math.random()*.8),c:o.c||(Math.random()<.55?'#ffd27a':'#ff7a58'),g:o.g==null?28:o.g});}if(parts.length>700)parts.splice(0,parts.length-700);}
function drawParts(dt){
  if(!parts.length)return;const g=ctx;g.save();g.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}
    p.vx*=.98;p.vy=p.vy*.98+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=1-p.t/p.life;g.globalAlpha=a;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*(.4+a*.6),0,TAU);g.fill();}
  g.restore();
}

/* ================= game ================= */
const levelCache=[];
function getLevel(i){if(!levelCache[i])levelCache[i]=genLevel(i);return levelCache[i];}
let G=null,T=0;
const state={screen:'title',selCh:0};
function startLevel(i){
  hideCard();
  const L=getLevel(i);
  G={L,i,pos:L.start.map(p=>({x:p.x,y:p.y})),px:L.start.map(()=>({x:0,y:0})),sc:new Array(L.n).fill(1),sv:new Array(L.n).fill(0),shake:new Array(L.n).fill(-9),
     moves:0,drag:null,hover:-1,won:false,winT:0,cardShown:false,met:false,dirty:true,prevTotal:L.startCross,cross:{total:L.startCross,hit:new Uint8Array(L.E.length),pts:[]},R:makeRopes(L.E.length),lastSnd:0};
  toPx();snapRopes(G.R,L.E,G.px);recalc(true);
  save.last=i;persist();
  setBG(L.ch,false);
  show('game');
  $('#h-title').textContent=CH[L.ch].name+' · 第'+cnNum(i%PER_CH+1)+'段';
  $('#h-sub').textContent=L.n+' 个线结 · '+L.E.length+' 根红线';
  updateHUD();
  const msgs=[];
  if(i===0&&!save.seen.intro){msgs.push('拖动线结，让所有红线<i>都不再交叉</i>。');save.seen.intro=1;}
  if(L.pinned.indexOf(true)>=0&&!save.seen.pin){msgs.push('<i>金色线结</i>被月老钉住了，挪不动——让别的线结绕着它走。');save.seen.pin=1;}
  if(L.E.some(e=>e[2]>1)&&!save.seen.dbl){msgs.push('粗一些的是<i>双股线</i>：和它交叉一次，算两处缠绕。');save.seen.dbl=1;}
  if(msgs.length){persist();toast(msgs.join('<br>'),5200+msgs.length*1200);}
}
function toPx(){for(let k=0;k<G.pos.length;k++){G.px[k].x=rect.x+G.pos[k].x*rect.w;G.px[k].y=rect.y+G.pos[k].y*rect.h;}}
function recalc(silent){
  const info=crossInfo(G.pos,G.L.E,true);
  if(!silent){
    const now=performance.now();
    if(info.total<G.prevTotal){
      if(now-G.lastSnd>70){const idx=2+11*(1-info.total/Math.max(1,G.L.startCross));AudioSys.pluck(idx,.42);buzz(8);G.lastSnd=now;}
      if(G.drag){const p=G.px[G.drag.k];emit(p.x,p.y,6,{sp:50,life:.7,r:1.4});}
    }else if(info.total>G.prevTotal&&now-G.lastSnd>140){const idx=2+11*(1-info.total/Math.max(1,G.L.startCross));AudioSys.pluck(Math.max(0,idx-5),.1);G.lastSnd=now;}
  }
  G.prevTotal=info.total;G.cross=info;updateCount();
}
function updateCount(){
  const el=$('#h-count');
  if(G.won){el.textContent='红线已理顺';el.classList.add('done');return;}
  const t=G.cross.total;
  if(t===0){el.textContent=G.drag?'已无缠绕，松手吧':'已无缠绕';el.classList.add('done');}
  else{el.innerHTML='还剩<b>'+t+'</b>处缠绕';el.classList.remove('done');}
}
function updateHUD(){
  updateCount();
  const L=G.L;$('#h-foot').textContent='已挪 '+G.moves+' 步 · 三星 ≤ '+L.par3+' 步 · 两星 ≤ '+L.par2+' 步';
}
function evPt(e){const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
function pick(x,y){let best=-1,bd=HIT*HIT;for(let k=0;k<G.px.length;k++){const dx=G.px[k].x-x,dy=G.px[k].y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=k;}}return best;}
cv.addEventListener('pointerdown',e=>{
  if(state.screen!=='game'||!G||G.won||G.drag)return;
  const p=evPt(e),k=pick(p.x,p.y);if(k<0)return;
  e.preventDefault();
  if(G.L.pinned[k]){G.shake[k]=T;AudioSys.pluck(1,.2);buzz(5);return;}
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  G.drag={k,id:e.pointerId,ox:G.px[k].x-p.x,oy:G.px[k].y-p.y,moved:0,lx:p.x,ly:p.y};
  AudioSys.pluck(7,.12);
  updateCount();
});
cv.addEventListener('pointermove',e=>{
  if(state.screen!=='game'||!G)return;
  const p=evPt(e);
  if(G.drag&&e.pointerId===G.drag.id){
    const d=G.drag,k=d.k;
    d.moved+=Math.hypot(p.x-d.lx,p.y-d.ly);d.lx=p.x;d.ly=p.y;
    G.pos[k].x=clamp((p.x+d.ox-rect.x)/rect.w,0,1);G.pos[k].y=clamp((p.y+d.oy-rect.y)/rect.h,0,1);
    G.dirty=true;
  }else if(!G.drag&&e.pointerType==='mouse'&&!G.won){
    const k=pick(p.x,p.y);G.hover=k;cv.style.cursor=k<0?'default':(G.L.pinned[k]?'not-allowed':'grab');
  }
});
function release(e){
  if(!G||!G.drag||e.pointerId!==G.drag.id)return;
  const d=G.drag,k=d.k;G.drag=null;
  try{cv.releasePointerCapture(e.pointerId);}catch(err){}
  if(d.moved>4)G.moves++;
  // gently separate overlapping knots
  for(let j=0;j<G.px.length;j++){if(j===k)continue;toPx();const dx=G.px[k].x-G.px[j].x,dy=G.px[k].y-G.px[j].y,dist=Math.hypot(dx,dy),need=R*1.7;
    if(dist<need){const ux=dist>.01?dx/dist:1,uy=dist>.01?dy/dist:0,push=need-dist;G.pos[k].x=clamp(G.pos[k].x+ux*push/rect.w,0,1);G.pos[k].y=clamp(G.pos[k].y+uy*push/rect.h,0,1);}}
  toPx();kickRopes(G.R,G.L.E,k,3.2);G.sv[k]-=.06;
  recalc(false);
  if(G.cross.total===0)win();
  updateHUD();
  if(e.pointerType==='mouse')cv.style.cursor='grab';
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('lostpointercapture',e=>{if(G&&G.drag&&G.drag.id===e.pointerId)release(e);});
function win(){
  G.won=true;G.winT=T;G.drag=null;
  const L=G.L,stars=G.moves<=L.par3?3:G.moves<=L.par2?2:1;
  save.solved[L.i]=Math.max(save.solved[L.i]||0,stars);
  save.best[L.i]=Math.min(save.best[L.i]||9999,G.moves);
  persist();G.stars=stars;
  AudioSys.arp();buzz([14,50,22]);
  for(let e=0;e<L.E.length;e++){const r=G.R[e];for(const j of [2,5,7])emit(r.x[j],r.y[j],3,{sp:36,up:30,life:1.3,r:1.5,g:-6});}
  let a=0,b=0;for(let k=0;k<L.n;k++){if(G.px[k].x<G.px[a].x)a=k;if(G.px[k].x>G.px[b].x)b=k;}
  G.lanA={x:G.px[a].x,y:G.px[a].y};G.lanB={x:G.px[b].x,y:G.px[b].y};
  cv.style.cursor='default';
  updateCount();
}
function drawWinLanterns(g){
  const u0=T-G.winT,S=scene?scene.S:1,size=clamp(R*.85,11,15);
  const meet={x:scene.bridgeTop.x,y:scene.bridgeTop.y-size*2.2};
  const fly=reduce?1:easeIO(clamp((u0-.55)/2.1,0,1));
  const alpha=reduce?1:clamp((u0-.3)*3,0,1);
  if(alpha<=0)return;
  if(fly>=1&&!G.met){G.met=true;emit(meet.x,meet.y,26,{sp:70,up:20,life:1.4,r:1.7,g:-4});AudioSys.pluck(14,.24);AudioSys.pluck(11,.18,.06);buzz(10);}
  [[G.lanA,-1],[G.lanB,1]].forEach(([st,sd])=>{
    const end={x:meet.x+sd*size*1.25,y:meet.y},c={x:(st.x+end.x)/2,y:Math.min(st.y,end.y)-110};
    const v=1-fly,x=v*v*st.x+2*v*fly*c.x+fly*fly*end.x,y=v*v*st.y+2*v*fly*c.y+fly*fly*end.y;
    const bob=reduce?0:Math.sin(T*2+sd)*2*(fly>=1?1:.4),ang=reduce?0:Math.sin(T*1.6+sd)*.06;
    drawLantern(g,x,y+bob,size*(.6+.4*alpha),ang,alpha);
  });
  if(G.met){const k=clamp((u0-2.65)/1.2,0,1),gr=g.createRadialGradient(meet.x,meet.y,0,meet.x,meet.y,90*S);gr.addColorStop(0,'rgba(255,190,120,'+(.28*(1-k*.5))+')');gr.addColorStop(1,'rgba(255,190,120,0)');g.fillStyle=gr;g.fillRect(meet.x-90*S,meet.y-90*S,180*S,180*S);}
  if(!G.cardShown&&u0>(reduce?.7:3.1)){G.cardShown=true;showCard();}
}
function drawGame(dt){
  const g=ctx,L=G.L,E=L.E;
  if(G.dirty){G.dirty=false;recalc(false);}
  toPx();
  let tension=0,glow=0;
  if(G.won){const u=T-G.winT;tension=reduce?1:easeOut(clamp(u/.45,0,1));glow=Math.min(1,u*2.5)*(reduce?.8:.72+.28*Math.sin(T*3.2));}
  stepRopes(G.R,E,G.px,G.won?null:G.cross.hit,dt,tension);
  drawRopes(g,G.R,E,LW,glow);
  if(!G.won)drawCrossMarks(g,G.cross.pts);
  const dk=G.drag?G.drag.k:-1;
  const order=[];for(let k=0;k<L.n;k++)if(k!==dk)order.push(k);if(dk>=0)order.push(dk);
  for(const k of order){
    const tgt=k===dk?1.28:(k===G.hover&&!G.won?1.1:1);
    if(reduce)G.sc[k]=tgt;else{G.sv[k]+=(tgt-G.sc[k])*.32;G.sv[k]*=.64;G.sc[k]+=G.sv[k];}
    let x=G.px[k].x,y=G.px[k].y;const su=T-G.shake[k];if(su<.4&&!reduce)x+=Math.sin(su*60)*4*(1-su/.4);
    const lift=clamp((G.sc[k]-1)/.28,0,1);
    drawKnot(g,L.pinned[k]?SPR.p:SPR.n,SPR.sh,x,y,G.sc[k],lift,glow*.8);
  }
  if(G.won)drawWinLanterns(g);
}

/* ================= title tangle ================= */
const TT={};
function titleScr(){let pos=null;for(let k=0;k<40;k++){const ord=shuffle([...Array(TT.sol.length).keys()],TT.rng);pos=[];ord.forEach((v,i)=>{const a=-Math.PI/2+i*TAU/ord.length;pos[v]={x:.5+.46*Math.cos(a),y:.5+.46*Math.sin(a)};});if(crossInfo(pos,TT.E).total>=4)return pos;}return pos;}
function initTitle(){
  const rng=mulberry32(5150),G0=genGraph(rng,7,1.6);
  TT.E=G0.E;TT.sol=G0.pts;TT.rng=rng;TT.from=titleScr();TT.next=null;TT.clock=reduce?4:0;TT.glow=0;TT.R=makeRopes(TT.E.length);TT.P=TT.sol.map(()=>({x:0,y:0}));TT.snapped=false;
}
function titleRect(){const w=Math.min(vw*.74,420),h=Math.min(vh*.3,300);return {x:vw/2-w/2,y:vh*.3-h/2,w,h};}
function drawTitle(dt){
  const g=ctx;TT.clock+=reduce?0:dt;
  if(TT.clock>=10.4){TT.clock=0;TT.from=TT.next||titleScr();TT.next=null;}
  if(!TT.next)TT.next=titleScr();
  const c=TT.clock,lerpP=(a,b,u)=>a.map((p,k)=>({x:lerp(p.x,b[k].x,u),y:lerp(p.y,b[k].y,u)}));
  let pos;
  if(reduce)pos=TT.sol;
  else if(c<3.4)pos=lerpP(TT.from,TT.sol,easeIO(c/3.4));
  else if(c<6.2)pos=TT.sol;
  else if(c<9.4)pos=lerpP(TT.sol,TT.next,easeIO((c-6.2)/3.2));
  else pos=TT.next;
  const tr=titleRect();
  for(let k=0;k<pos.length;k++){TT.P[k].x=tr.x+pos[k].x*tr.w;TT.P[k].y=tr.y+pos[k].y*tr.h;}
  if(!TT.snapped){snapRopes(TT.R,TT.E,TT.P);TT.snapped=true;}
  const info=crossInfo(pos,TT.E);
  TT.glow+=((info.total===0?1:0)-TT.glow)*Math.min(1,dt*3);
  stepRopes(TT.R,TT.E,TT.P,info.hit,dt,TT.glow*.85);
  drawRopes(g,TT.R,TT.E,LW,TT.glow*(reduce?.7:.6+.3*Math.sin(T*2.5)));
  for(let k=0;k<pos.length;k++)drawKnot(g,SPR.tn,SPR.tsh,TT.P[k].x,TT.P[k].y,1,0,TT.glow*.6);
}

/* ================= screens ================= */
function show(name){
  state.screen=name;
  document.querySelectorAll('.screen').forEach(el=>{if(el.id!=='s-'+name){el.classList.remove('on','vis');}});
  const el=$('#s-'+name);el.classList.add('on');requestAnimationFrame(()=>el.classList.add('vis'));
  if(name!=='game'){hideCard();cv.style.cursor='default';}
  if(name==='title'){setBG(2,true);const n=solvedCount();$('#t-prog').textContent=n?('已理顺 '+n+' / 120 段红线'):'';$('#b-start').textContent=n>=LEVEL_COUNT?'再看姻缘簿':'去解开';}
  if(name==='select'){renderSelect();}
  if(name==='book'){renderBook();setBG(state.selCh,false);el.scrollTop=0;}
}
function renderSelect(){
  const ch=state.selCh;setBG(ch,false);
  $('#sel-cnt').textContent='已理顺 '+solvedCount()+' / 120';
  const tabs=$('#tabs');tabs.innerHTML='';
  CH.forEach((c,k)=>{let n=0;for(let i=k*PER_CH;i<(k+1)*PER_CH;i++)if(save.solved[i])n++;
    const b=document.createElement('button');b.className='tab'+(k===ch?' on':'');b.innerHTML=c.name+'<small>'+n+'/20</small>';b.setAttribute('aria-label',c.name+' 已解 '+n+' 段');
    b.addEventListener('click',()=>{uiTick();state.selCh=k;renderSelect();});tabs.appendChild(b);});
  const C=CH[ch];
  $('#ch-info').innerHTML='<h3>'+C.name+'</h3><p>'+C.sub+' · '+C.desc+'</p>'+(C.feat?'<span class="new">'+C.feat+'</span>':'');
  const grid=$('#grid');grid.innerHTML='';const nx=nextUnsolved();
  for(let i=ch*PER_CH;i<(ch+1)*PER_CH;i++){
    const b=document.createElement('button'),st=save.solved[i]||0,ok=unlocked(i);
    b.className='lv'+(ok?'':' lock')+(i===nx?' next':'');
    b.innerHTML=(i%PER_CH+1)+'<span class="stars">'+[0,1,2].map(s=>'<i class="star'+(s<st?'':' off')+'"></i>').join('')+'</span>';
    b.setAttribute('aria-label','第 '+(i%PER_CH+1)+' 段'+(ok?(st?'，'+st+' 星':''):'，未解锁'));
    if(ok)b.addEventListener('click',()=>{uiTick();startLevel(i);});else b.disabled=true;
    grid.appendChild(b);
  }
}
function renderBook(){
  const n=solvedCount();$('#book-cnt').textContent='已记 '+n+' / 120';
  let h='<p class="intro">每理顺一段红线，月老就在这里记下一笔。</p>';
  CH.forEach((c,k)=>{
    let cnt=0;for(let i=k*PER_CH;i<(k+1)*PER_CH;i++)if(save.solved[i])cnt++;
    h+='<h4>'+c.name+'<small>'+c.sub+' · '+cnt+'/20</small></h4>';
    for(let i=k*PER_CH;i<(k+1)*PER_CH;i++){
      const ok=!!save.solved[i];
      h+='<div class="entry'+(ok?'':' lock')+'"><span class="no">'+(i%PER_CH+1)+'</span><span>'+(ok?STORIES[i]:'这段红线，还缠着。')+'</span></div>';
    }
  });
  $('#book').innerHTML=h;
}
function showCard(){
  const L=G.L,i=L.i;
  $('#c-ch').textContent=CH[L.ch].name+' · 第'+cnNum(i%PER_CH+1)+'段';
  $('#c-stars').innerHTML=[0,1,2].map(s=>'<i class="star lg'+(s<G.stars?'':' off')+'"></i>').join('');
  $('#c-meta').textContent='挪了 '+G.moves+' 步 · 已记入姻缘簿';
  $('#c-story').textContent=STORIES[i];
  const allDone=solvedCount()>=LEVEL_COUNT;
  $('#c-fin').style.display=(i===LEVEL_COUNT-1&&allDone)?'':'none';
  const nb=$('#c-next');
  if(i<LEVEL_COUNT-1){nb.textContent='下一段';nb.dataset.act='next';}else{nb.textContent='翻开姻缘簿';nb.dataset.act='book';}
  $('#card').classList.add('on');
  setTimeout(()=>{try{nb.focus({preventScroll:true});}catch(e){}},50);
}
function hideCard(){$('#card').classList.remove('on');}
let toastTimer=0;
function toast(html,ms){const t=$('#toast');t.innerHTML=html;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),ms||4200);}
$('#toast').addEventListener('click',()=>$('#toast').classList.remove('on'));

$('#b-start').addEventListener('click',()=>{uiTick();const n=nextUnsolved();if(n<0){state.selCh=5;show('book');}else startLevel(n);});
$('#b-select').addEventListener('click',()=>{uiTick();const n=nextUnsolved();state.selCh=n<0?Math.floor(save.last/PER_CH):Math.floor(n/PER_CH);show('select');});
$('#b-book').addEventListener('click',()=>{uiTick();show('book');});
$('#sel-back').addEventListener('click',()=>{uiTick();show('title');});
$('#book-back').addEventListener('click',()=>{uiTick();show('title');});
$('#g-back').addEventListener('click',()=>{uiTick();state.selCh=G?G.L.ch:0;show('select');});
$('#g-reset').addEventListener('click',()=>{uiTick();if(G)startLevel(G.i);});
$('#c-next').addEventListener('click',e=>{uiTick();if(e.currentTarget.dataset.act==='book'){state.selCh=5;show('book');}else startLevel(G.i+1);});
$('#c-again').addEventListener('click',()=>{uiTick();startLevel(G.i);});
$('#c-sel').addEventListener('click',()=>{uiTick();state.selCh=G.L.ch;show('select');});
function setMuteIcon(){$('#mw').style.display=save.muted?'none':'';$('#mx').style.display=save.muted?'':'none';$('#mute').setAttribute('aria-label',save.muted?'打开声音':'静音');$('#mute').setAttribute('aria-pressed',save.muted?'true':'false');}
$('#mute').addEventListener('click',()=>{save.muted=!save.muted;persist();setMuteIcon();AudioSys.ensure();AudioSys.setMuted(save.muted);if(!save.muted)AudioSys.pluck(9,.2);});
document.addEventListener('pointerdown',()=>AudioSys.ensure(),true);
document.addEventListener('keydown',e=>{AudioSys.ensure();if(e.key==='Escape'){if(state.screen==='game')$('#g-back').click();else if(state.screen!=='title')show('title');}},true);

/* ================= resize & loop ================= */
let rsPending=false;
function resize(){
  vw=Math.max(1,innerWidth);vh=Math.max(1,innerHeight);dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  readSafe();computeRect();buildSprites();
  if(bgKey){setBG(bgCh,bgTitle,true);}
  if(G){toPx();snapRopes(G.R,G.L.E,G.px);}
  TT.snapped=false;
}
window.addEventListener('resize',()=>{if(rsPending)return;rsPending=true;requestAnimationFrame(()=>{rsPending=false;resize();});});
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;T+=dt;
  const g=ctx;g.setTransform(dpr,0,0,dpr,0,0);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  if(fadeT<1){fadeT=clamp((performance.now()-fadeStart)/450,0,1);g.drawImage(bgB,0,0,vw,vh);g.globalAlpha=fadeT;g.drawImage(bgA,0,0,vw,vh);g.globalAlpha=1;}
  else g.drawImage(bgA,0,0,vw,vh);
  drawAmbient(dt);
  if(state.screen==='title')drawTitle(dt);
  else if(state.screen==='game'&&G)drawGame(dt);
  drawParts(dt);
  requestAnimationFrame(frame);
}
/* ================= boot ================= */
paperTexURL();setMuteIcon();initTitle();
vw=innerWidth;vh=innerHeight;resize();
show('title');
requestAnimationFrame(frame);
})();
</script>
