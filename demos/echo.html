<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昨日之我</title>
<meta name="description" content="昨日之我 · ECHO OF YESTERDAY —— 和昨天的自己协作的动作解谜。">
<meta name="theme-color" content="#0e1013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0e1013; --panel:#15181d; --line:#262b33; --ink:#e8ecf1; --dim:#8a94a1; --faint:#4d5561;
  --warm:#ff8a3d; --warm2:#ffb46e; --cold:#3fe0ff; --learn:#a98bff; --hazard:#ff4f7b;
  --mono:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* ---------- HUD ---------- */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:linear-gradient(#121519,#0f1215);min-height:52px;flex-wrap:wrap;position:relative;z-index:3}
#hud[hidden]{display:none}
.lv{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.lv .num{font-family:var(--mono);font-weight:700;color:var(--warm);font-size:20px;letter-spacing:.04em}
.lv .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .rd{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.hb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#181c22;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.hb:hover{background:#1f242b;border-color:#36404b}
.hb:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.hb kbd{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px}
.hb.pri{border-color:rgba(255,138,61,.55);color:#ffd2b3;background:rgba(255,138,61,.1)}
.hb.pri:hover{background:rgba(255,138,61,.18)}
.hb.ic{width:34px;padding:0;justify-content:center}
.hb svg{width:16px;height:16px;display:block}
.hb.learn{border-color:rgba(169,139,255,.5);color:#d8cbff;background:rgba(169,139,255,.1)}
.hb.learn.off{border-color:rgba(63,224,255,.45);color:#bff4ff;background:rgba(63,224,255,.08)}
.hb[hidden]{display:none}
.hb .s{display:none}
/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);max-width:min(680px,92%);font-size:14px;line-height:1.6;color:#b9c2cd;text-align:center;padding:8px 14px;border-radius:10px;background:rgba(14,16,19,.72);border:1px solid var(--line);pointer-events:none;transition:opacity .4s}
#hint b{color:var(--warm2);font-weight:500}
#hint.hide{opacity:0}
/* ---------- 虚拟按键 ---------- */
#pad{flex:0 0 auto;display:none;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 16px 16px;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;z-index:3}
body.touch.playing #pad{display:flex}
.pg{display:flex;gap:12px;align-items:flex-end}
.pb{width:76px;height:76px;border-radius:18px;border:1px solid #2d343e;background:rgba(24,28,34,.88);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#cfd6de;touch-action:none;transition:transform .06s,background .06s}
.pb svg{width:28px;height:28px}
.pb.on{background:rgba(255,138,61,.22);border-color:rgba(255,138,61,.7);transform:scale(.96)}
.pb.big{width:92px;height:92px;border-radius:50%;border-color:rgba(255,138,61,.45);color:#ffd2b3;font-size:18px}
.pb.sm{width:76px;height:64px;font-size:12px;line-height:1.25;border-color:rgba(63,224,255,.35);color:#bff4ff;flex-direction:column}
.pb.sm.on{background:rgba(63,224,255,.18)}
@media (orientation:landscape) and (pointer:coarse){
  body.touch #pad{position:absolute;left:0;right:0;bottom:0;padding:0 calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none;background:none}
  body.touch #pad .pb{pointer-events:auto;opacity:.82}
  .pb{width:64px;height:64px}.pb.big{width:80px;height:80px}
}
/* ---------- 浮层 ---------- */
.ov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ov[hidden]{display:none}
#title{flex-direction:column;text-align:center;justify-content:flex-start;padding-top:min(14vh,120px)}
#title h1{margin:0;font-weight:900;font-size:clamp(46px,12vw,104px);letter-spacing:.1em;line-height:1.05;text-shadow:-3px 0 rgba(63,224,255,.55),3px 0 rgba(255,138,61,.55);padding-left:.1em}
#title .en{margin-top:14px;font-family:var(--mono);letter-spacing:.42em;font-size:clamp(11px,2.6vw,15px);color:var(--dim);padding-left:.42em}
#title .tag{margin-top:22px;color:#aab3be;font-size:15px;line-height:1.7}
#title .btns{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bt{height:48px;min-width:132px;padding:0 24px;border-radius:12px;border:1px solid var(--line);background:#171b21;font-size:16px;font-weight:700;letter-spacing:.08em;transition:transform .12s,background .15s}
.bt:hover{transform:translateY(-1px);background:#1d2229}
.bt:focus-visible{outline:2px solid var(--cold);outline-offset:3px}
.bt.pri{background:var(--warm);border-color:var(--warm);color:#1d0f05}
.bt.pri:hover{background:#ff9a55}
#title .foot{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.2em}
#title .keys{margin-top:18px;font-size:12px;color:var(--faint);font-family:var(--mono);letter-spacing:.06em}
.card{background:rgba(18,21,26,.94);border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;max-width:560px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h2{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:.06em}
.card .sub{color:var(--dim);font-size:14px}
.card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.cell{position:relative;text-align:left;border:1px solid var(--line);border-radius:12px;background:#14171c;padding:10px 10px 9px;min-height:84px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.cell:hover:not([disabled]){border-color:#3a4450;background:#181c22}
.cell .n{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--warm)}
.cell .t{font-size:13px;font-weight:700}
.cell .b{font-size:11px;color:var(--dim);margin-top:auto}
.cell.ln .n{color:var(--learn)}
.cell[disabled]{opacity:.38;cursor:not-allowed}
.cell .chip{position:absolute;top:9px;right:9px;font-size:10px;color:var(--learn);border:1px solid rgba(169,139,255,.4);border-radius:6px;padding:0 5px;line-height:16px}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;background:#121519}
.stat .k{font-size:11px;color:var(--dim)}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700}
.stat.p .v{color:var(--learn)}.stat.w .v{color:var(--warm)}.stat.c .v{color:var(--cold)}
#clear .quote{margin-top:14px;color:#c4ccd6;font-size:14px;line-height:1.7;border-left:2px solid var(--learn);padding-left:12px}
#ending{flex-direction:column;text-align:center}
#ending .big{font-size:clamp(24px,5.6vw,44px);font-weight:900;letter-spacing:.08em;line-height:1.5;max-width:900px}
#ending .big span{color:var(--warm2)}
#ending .small{margin-top:16px;color:var(--dim);font-family:var(--mono);letter-spacing:.2em;font-size:12px}
#ending .btns{margin-top:30px;display:flex;gap:12px;justify-content:center}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);background:rgba(20,23,28,.95);border:1px solid #333b46;border-radius:999px;padding:8px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:6;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:720px){
  #hud{gap:6px;padding:6px 8px}
  .hb{height:32px;padding:0 9px;font-size:12px}
  .hb kbd{display:none}
  .hb .l{display:none}.hb .s{display:inline}
  .lv{width:100%;margin-right:0}
  .lv .num{font-size:17px}.lv .nm{font-size:14px}
  #hint{font-size:13px}
}
@media (max-height:520px) and (orientation:landscape){
  #title{padding-top:18px}
  #title h1{font-size:clamp(36px,9vh,60px)}
  #title .en{margin-top:6px}
  #title .tag,#title .keys{display:none}
  #title .btns{margin-top:14px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <div class="lv"><span class="num" id="lvNum">01</span><span class="nm" id="lvName">醒来</span><span class="rd" id="lvRound">回合 1/1</span></div>
    <button class="hb ic" id="bMenu" aria-label="返回选关" title="选关（Esc）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
    <button class="hb learn" id="bLearn" hidden title="切换学习回声 / 死板回放（L）">学习回声 · 开<kbd>L</kbd></button>
    <button class="hb" id="bDemo" title="观看示范（H）">示范<kbd>H</kbd></button>
    <button class="hb" id="bRestart" title="重来本回合（R）"><span class="l">重来本回合</span><span class="s">重来</span><kbd>R</kbd></button>
    <button class="hb" id="bClear" title="清空所有回声（C）"><span class="l">清空回声</span><span class="s">清空</span><kbd>C</kbd></button>
    <button class="hb pri" id="bEnd" title="结束本回合，留下回声（E）"><span class="l">结束回合</span><span class="s">结束</span><kbd>E</kbd></button>
    <button class="hb ic" id="bMute" aria-label="静音" title="静音（M）"></button>
  </header>
  <main id="stage">
    <canvas id="cv" aria-label="游戏画面"></canvas>
    <div id="hint" class="hide"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <section class="ov" id="title">
      <h1>昨日之我</h1>
      <div class="en">ECHO OF YESTERDAY</div>
      <div class="tag">每一回合结束，这一回合的你会变成「昨天的你」。<br>下一回合，它回来，陪你一起解开今天。</div>
      <div class="btns"><button class="bt pri" id="bStart">开始</button><button class="bt" id="bSelect">选关</button></div>
      <div class="keys">← → 移动 · 空格 跳跃 · E 结束回合 · R 重来 · C 清空回声</div>
      <div class="foot">第二玩家 · PLAYER TWO</div>
    </section>

    <section class="ov" id="select" hidden>
      <div class="card" style="max-width:720px">
        <h2>选择关卡</h2>
        <div class="sub">第 6 关起，回声会「学习」：等待、对齐节拍、改道——不再死板地照搬昨天。</div>
        <div class="grid" id="grid"></div>
        <div class="row"><button class="bt" id="bBackTitle">返回标题</button></div>
      </div>
    </section>

    <section class="ov" id="clear" hidden>
      <div class="card">
        <h2 id="clTitle">第 01 关 · 完成</h2>
        <div class="sub" id="clSub">用了 1 / 1 个回合</div>
        <div class="stats" id="clStats"></div>
        <div class="quote" id="clQuote" hidden></div>
        <div class="row"><button class="bt pri" id="bNext">下一关</button><button class="bt" id="bReplay">重玩</button><button class="bt" id="bToSelect">选关</button></div>
      </div>
    </section>

    <section class="ov" id="ending" hidden>
      <div class="big">原来一直在等我的，<br><span>是我自己。</span></div>
      <div class="small">全部 12 关完成 · 谢谢你，和你所有的昨天</div>
      <div class="btns"><button class="bt pri" id="bEndTitle">回到标题</button><button class="bt" id="bEndSelect">选关</button></div>
    </section>
  </main>
  <div id="pad" aria-hidden="true">
    <div class="pg">
      <button class="pb" data-k="L" aria-label="向左"><svg viewBox="0 0 24 24"><path d="M15 5 L7 12 L15 19 Z" fill="currentColor"/></svg></button>
      <button class="pb" data-k="R" aria-label="向右"><svg viewBox="0 0 24 24"><path d="M9 5 L17 12 L9 19 Z" fill="currentColor"/></svg></button>
    </div>
    <div class="pg">
      <button class="pb sm" id="pEnd" aria-label="结束回合">结束<span>回合</span></button>
      <button class="pb big" data-k="J" aria-label="跳跃">跳</button>
    </div>
  </div>
</div>
<script>
// ==ECHO-SIM-BEGIN==
/* ============================================================
 *  昨日之我 · 确定性模拟核心（无 DOM，可在 node 中运行）
 *  - 固定 60Hz 步长；回声录的是「输入」而不是位置，重放完全确定。
 *  - 学习回声（第 6 关起）：不是死板逐帧回放，而是一个轻量的
 *    「意图对齐时间弯曲回放」行为模型（见 brainLearn）。
 *    参赛版可以把 brainLearn 替换成真正的模仿学习策略
 *    （例如用录制轨迹训练的小型 BC/GAIL 策略网络），或让大模型
 *    基于「意图点 + 关卡语义」做规划，只要保持同样的接口：
 *        输入：世界状态 w + 回声 c（含录制 rec）
 *        输出：本帧按键位掩码（L=1, R=2, J=4）
 * ============================================================ */
var EchoSim = (function () {
  'use strict';
  var T = 32, COLS = 24, ROWS = 14, WW = COLS * T, WH = ROWS * T;
  var PH = { w: 22, h: 26, run: 3.4, accG: 0.62, decG: 0.9, accA: 0.42, decA: 0.22,
    g: 0.7, gFall: 0.82, jumpV: 11.2, cut: -4, maxFall: 13, coyote: 6, buffer: 8, push: 1.8 };
  var BOX = 30, PLAT_H = 10;
  var IN_L = 1, IN_R = 2, IN_J = 4;
  var CHS = 'abcd';

  function mod(a, n) { return ((a % n) + n) % n; }
  function approach(v, t, a) { return v < t ? Math.min(v + a, t) : Math.max(v - a, t); }
  function ov(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }

  /* ---------------- 关卡定义 ----------------
   * 字符画 24 列 × 14 行，每格 32px。
   *  #  墙          .  空           S  出生点       X  出口
   *  ^  尖刺        -  单向平台（可从下方跳上）     o  可推箱子
   *  a b c d  压力板（频道）          A B C D  对应频道的门（频道激活时打开）
   *  1 2 3 4  激光栅栏，分别对应频道 a b c d（频道激活时熄灭）
   * 额外配置：
   *  echoes  最多回声数（回合数 = echoes + 1）
   *  T       每回合帧数（60 帧 = 1 秒）
   *  chan    频道特性：{a:{hold:N}} 松开后保持 N 帧；
   *          {c:{cycle:P,on:N,phase:0,drift:D}} 周期频道，每回合相位漂移 D 帧
   *  inv     反向门（频道激活时关闭），例如 'B'
   *  plats   移动平台：{x,y,w,to:[x,y],ch:'a',speed} 受频道驱动的电梯；
   *          {x,y,w,to,move,hold,phase,drift} 往返平台（会漂移）
   *  learn   是否启用学习回声
   */
  var LEVELS = [
    { name: '醒来', echoes: 0, T: 900,
      hint: '移动：← → 或 A D；跳跃：空格 或 ↑，按住跳得更高。走到发光的出口。',
      hintTouch: '按住左右方向键移动，按「跳」起跳，按得越久跳得越高。走到发光的出口。',
      map: [
        '########################',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#...................X..#',
        '#...........##....######',
        '#.S.....#...##^^..######',
        '########################',
        '########################'] },
    { name: '回声', echoes: 1, T: 600,
      hint: '站上压力板，门就会打开——可你一走开它就关上。站在板上按「结束回合」（E）：下一回合，「昨天的你」会替你站在那里。',
      map: [
        '########################',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................#...#',
        '#..................A...#',
        '#a......S..........A.X.#',
        '########################',
        '########################'] },
    { name: '垫脚石', echoes: 1, T: 600,
      hint: '这面墙一个人跳不上去。走到墙脚，按「结束回合」（E）——下一回合，踩着昨天的自己上去。',
      map: [
        '########################',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#......................#',
        '#...................X..#',
        '#.............##########',
        '#.............##########',
        '#..S..........##########',
        '########################',
        '########################'] },
    { name: '接力', echoes: 2, T: 600,
      hint: '两扇门，两块压力板。第一个你，可以同时是开关和台阶。',
      map: [
        '########################',
        '#............#.....#...#',
        '#............#.....#...#',
        '#............#.....#...#',
        '#............#.....#...#',
        '#............#.....#...#',

        '#............#.....#...#',
        '#.b..........#.....#...#',
        '####.........#.....#...#',
        '####.........A.....B...#',
        '####a...S....A.....B.X.#',
        '########################',
        '########################'] },
    { name: '电梯与箱子', echoes: 2, T: 720,
      hint: '有人按住压力板，电梯才会上升。箱子也能压住压力板——它是一个永远不会离开的你。',
      plats: [{ x: 5, y: 10, w: 3, to: [5, 5], ch: 'a', speed: 1.6 }],
      map: [
        '########################',
        '#...................#..#',

        '#...................#..#',
        '#...................B..#',
        '#a........S......b..B.X#',
        '########################',
        '########################'] },
    { name: '漂移之门', echoes: 1, T: 780, learn: true,
      chan: { c: { cycle: 150, on: 60, phase: 0, drift: 75 } },
      hint: '带紫色相位环的机关会「漂移」：每一回合节奏都不同，死板的回放会撞上它。从这一关起，昨天的你学会了等待（L 键 / 顶栏按钮可切换对比）。',
      map: [
        '########################',

  }
  function openSelect() {
    var g = $('grid'), html = '';
    S.LEVELS.forEach(function (L, i) {
      var lock = i > prog.unlocked, best = prog.best[i];
      html += '<button class="cell' + (L.learn ? ' ln' : '') + '" data-i="' + i + '"' + (lock ? ' disabled aria-disabled="true"' : '') + '>' +
        (L.learn ? '<span class="chip">学习</span>' : '') +
        '<span class="n">' + ('0' + (i + 1)).slice(-2) + '</span><span class="t">' + L.name + '</span>' +
        '<span class="b">' + (lock ? '未解锁' : best ? '最佳 ' + best + ' 回合' : (L.echoes + 1) + ' 个回合') + '</span></button>';
    });
    g.innerHTML = html;
    setScreen('select');
  }
  function startDemo() {
    var src = S.SOLUTIONS[li]; if (!src) return;
    sess.learn = !!sess.L.def.learn;
    sess.clearEchoes();
    demo = { rounds: src.split('|'), r: 0, keep: false };
    demo.drv = new S.Driver(demo.rounds[0]);
    onNewRound(false);
    toast('示范：昨天的你会怎么帮今天的你。按任意方向键接管');
  }
  function act(a) {
    if (screen !== 'play' || !sess) return;
    AU.init(); skipIntro();
    if (a === 'menu') { demo = null; openSelect(); return; }
    if (mode !== 'play') return;
    if (a !== 'demo' && demo) demo = null;
    if (a === 'end') {
      if (sess.L.maxEchoes === 0) { toast('这一关还用不到回声——直接走到出口吧'); return; }
      if (!sess.canRecord()) { toast('这是最后一个回合了。按 C 清空回声重新开始'); return; }
      beginRewind('end');
    } else if (a === 'restart') beginRewind('restart');
    else if (a === 'clear') { beginRewind(sess.records.length ? 'clear' : 'restart'); if (sess.records.length) toast('已清空所有回声'); }
    else if (a === 'learn') {
      if (!sess.L.def.learn) return;
      sess.setLearn(!sess.learn); onNewRound(false);
      toast(sess.learn ? '学习回声：会等待、对齐节拍、被挡住时改道' : '死板回放：逐帧照搬昨天的按键——试试看会发生什么');
    } else if (a === 'demo') startDemo();
    updateHud();
  }
  function toggleMute() {
    AU.init(); AU.setMuted(!AU.isMuted()); prog.muted = AU.isMuted(); save(); muteIcon();
    toast(AU.isMuted() ? '已静音' : '声音已开启');
  }
  function muteIcon() {
    $('bMute').innerHTML = AU.isMuted()
      ? '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none"/><path d="M11 6l4 4M15 6l-4 4"/></svg>'
      : '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none"/><path d="M11 5.5c1 .8 1 4.2 0 5M13 3.5c2 1.8 2 7.2 0 9"/></svg>';
    $('bMute').setAttribute('aria-label', AU.isMuted() ? '取消静音' : '静音');
  }

  /* ---------------- 主循环（固定 60Hz 模拟） ---------------- */
  function readInput() {
    return ((keys.L || tkeys.L) ? S.IN_L : 0) | ((keys.R || tkeys.R) ? S.IN_R : 0) | ((keys.J || tkeys.J) ? S.IN_J : 0);
  }
  function tick() {
    gt++; titleT++;
    tickFx();
    if (screen !== 'play' && screen !== 'clear') return;
    if (bannerT > 0) bannerT--;
    if (spawnT > 0) spawnT--;
    if (screen !== 'play') return;
    if (introLeft() > 0 && mode === 'play') return; // 关卡标题卡（实时 ≤1.2 秒）期间不推进模拟
    var w = sess.world;
    if (mode === 'play') {
      var inp = demo ? demo.drv.next(w) : readInput();
      if (inp === -1) { beginRewind('end'); return; }
      sess.step(inp === null ? 0 : inp);
      w = sess.world;
      handleEvents(w); updateVis(w);
      if (sess.status === 'won') { mode = 'winning'; modeT = 0; }
      else if (sess.status === 'dead') { mode = 'dying'; modeT = 0; }
      else if (sess.status === 'timeup') {
        if (sess.L.maxEchoes === 0) { toast('时间到——再来一次'); beginRewind('restart'); }
        else beginRewind(sess.canRecord() ? 'end' : 'exhaust');
      }
    } else if (mode === 'rewind') { if (++modeT >= rw.dur) finishRewind(); }
    else if (mode === 'dying') { updateVis(w); if (++modeT > 40) { if (demo) demo.keep = true; else toast('今天的你消散了——重来本回合'); beginRewind('restart'); } }
    else if (mode === 'winning') { updateVis(w); if (++modeT > 75) showClear(); }
  }
  var lastTs = 0, acc = 0, STEP = 1000 / 60;
  function frame(ts) {
    if (!lastTs) lastTs = ts;
    frameDt = clamp(ts - lastTs, 1, 100); acc += Math.min(250, ts - lastTs); lastTs = ts;
    var n = 0;
    while (acc >= STEP && n < 15) { tick(); acc -= STEP; n++; }
    if (n >= 15) acc = 0;
    render();
    window.requestAnimationFrame(frame);
  }
  function render() {
    if ((screen === 'play' || screen === 'clear') && sess) {
      if (mode === 'rewind' && rw) { renderLevel(sctx); compositeRewind(clamp(modeT / rw.dur, 0, 1)); }
      else renderLevel(ctx);
      if (screen === 'clear') { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(8,9,11,0.55)'; ctx.fillRect(0, 0, cv.width, cv.height); }
    } else {
      renderTitle(ctx, screen === 'ending');
      if (screen === 'select' || screen === 'ending') { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(8,9,11,' + (screen === 'select' ? 0.6 : 0.35) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
    }
  }

  /* ---------------- 输入 ---------------- */
  var KEYMAP = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'J', KeyW: 'J', Space: 'J', KeyK: 'J', KeyZ: 'J' };
  window.addEventListener('keydown', function (e) {
    AU.init();
    if (e.code === 'KeyM' && !e.repeat) { toggleMute(); return; }
    if (screen === 'play') {
      skipIntro();
      var k = KEYMAP[e.code];
      if (k) { keys[k] = 1; e.preventDefault(); if (demo && mode === 'play' && k !== 'J') { demo = null; toast('你接管了今天'); } return; }
      if (e.repeat) return;
      switch (e.code) {
        case 'KeyR': act('restart'); break;
        case 'KeyE': case 'Enter': e.preventDefault(); act('end'); break;
        case 'KeyC': case 'Backspace': e.preventDefault(); act('clear'); break;
        case 'KeyL': act('learn'); break;
        case 'KeyH': act('demo'); break;
        case 'Escape': act('menu'); break;
      }
    } else if (screen === 'title' && e.code === 'Enter' && !e.repeat) { e.preventDefault(); startFromTitle(); }
    else if (screen === 'clear' && e.code === 'Escape') openSelect();
    else if (screen === 'select' && e.code === 'Escape') setScreen('title');
  });
  window.addEventListener('keyup', function (e) { var k = KEYMAP[e.code]; if (k) keys[k] = 0; });
  window.addEventListener('blur', function () { keys.L = keys.R = keys.J = 0; tkeys.L = tkeys.R = tkeys.J = 0; });
  function markTouch() { if (!touchSeen) { touchSeen = true; updateTouchClass(); setTimeout(resize, 0); } }
  updateTouchClass();
  window.addEventListener('touchstart', markTouch, { passive: true });
  Array.prototype.forEach.call(document.querySelectorAll('#pad [data-k]'), function (b) {
    var k = b.getAttribute('data-k'), ids = {};
    function on(e) {
      e.preventDefault(); AU.init(); skipIntro(); ids[e.pointerId] = 1;
      try { b.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      tkeys[k] = 1; b.classList.add('on');
      if (demo && k !== 'J') { demo = null; toast('你接管了今天'); }
    }
    function off(e) { delete ids[e.pointerId]; if (!Object.keys(ids).length) { tkeys[k] = 0; b.classList.remove('on'); } }
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
  $('pEnd').addEventListener('pointerdown', function (e) { e.preventDefault(); $('pEnd').classList.add('on'); act('end'); setTimeout(function () { $('pEnd').classList.remove('on'); }, 150); });
  $('pad').addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  cv.addEventListener('pointerdown', function () { AU.init(); skipIntro(); });

  function startFromTitle() { AU.init(); AU.ui(); startLevel(Math.min(prog.unlocked, S.LEVELS.length - 1)); }
  function blurAnd(f) { return function (e) { if (e && e.currentTarget && e.currentTarget.blur) e.currentTarget.blur(); AU.init(); f(); }; }
  $('bStart').addEventListener('click', blurAnd(startFromTitle));
  $('bSelect').addEventListener('click', blurAnd(function () { AU.ui(); openSelect(); }));
  $('bBackTitle').addEventListener('click', blurAnd(function () { titleStart = now(); setScreen('title'); }));
  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.cell') : null;
    if (!b || b.disabled) return;
    AU.init(); AU.ui(); startLevel(+b.getAttribute('data-i'));
  });
  $('bNext').addEventListener('click', blurAnd(function () { if (li + 1 < S.LEVELS.length) startLevel(li + 1); else { titleStart = now(); setScreen('title'); } }));
  $('bReplay').addEventListener('click', blurAnd(function () { startLevel(li); }));
  $('bToSelect').addEventListener('click', blurAnd(openSelect));
  $('bEndTitle').addEventListener('click', blurAnd(function () { titleStart = now(); setScreen('title'); }));
  $('bEndSelect').addEventListener('click', blurAnd(openSelect));
  $('bMenu').addEventListener('click', blurAnd(function () { act('menu'); }));
  $('bLearn').addEventListener('click', blurAnd(function () { act('learn'); }));
  $('bDemo').addEventListener('click', blurAnd(function () { act('demo'); }));
  $('bRestart').addEventListener('click', blurAnd(function () { act('restart'); }));
  $('bClear').addEventListener('click', blurAnd(function () { act('clear'); }));
  $('bEnd').addEventListener('click', blurAnd(function () { act('end'); }));
  $('bMute').addEventListener('click', blurAnd(toggleMute));
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { resize(); });
  document.addEventListener('visibilitychange', function () { lastTs = 0; acc = 0; keys.L = keys.R = keys.J = 0; });

  $('bStart').textContent = prog.unlocked > 0 ? '继续 · 第 ' + (Math.min(prog.unlocked, S.LEVELS.length - 1) + 1) + ' 关' : '开始';
  muteIcon();
  setScreen('title');
  resize();
  if (/[?&]selftest\b/.test(location.search)) { S.selfTest(function (s) { console.log(s); }); }
  window.requestAnimationFrame(frame);
})();

</script>
</body>
</html>
