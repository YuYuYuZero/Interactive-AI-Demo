<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外婆的菜谱</title>
<meta name="description" content="外婆记不清名字和面孔，但还记得味道。周末回到老厨房，照着残缺的菜谱本做五道家常菜，陪她多记住一天。">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3e5c4; --paper2:#ead5a8; --paper3:#f8efd9;
  --ink:#4a2f1f; --ink2:#7b5a3f; --ink3:#a88a68;
  --red:#b9432c; --red2:#d8614a; --green:#6c9467; --jade:#8fb59a; --gold:#d79b36; --sun:#ffd98a;
  --body:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi","BiauKai",cursive;
  --title:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","BiauKai",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#ecd8ae;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
canvas{display:block}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{transition:filter .9s ease}
body.dim #bg{filter:blur(5px) brightness(.78) saturate(.85)}
body.dim #fx{opacity:.35}
#fx{transition:opacity .9s}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;z-index:80}
.screen{position:fixed;inset:0;display:none;z-index:10}
.screen.on{display:block}

/* ---------- 按钮 ---------- */
.btn{min-height:52px;min-width:120px;padding:10px 30px;border-radius:999px;border:0;cursor:pointer;font-size:19px;letter-spacing:.12em;font-family:var(--body);font-weight:600;transition:transform .15s ease,box-shadow .15s ease,filter .15s}
.btn.main{background:linear-gradient(180deg,#c9543a,#a83b27);color:#fff6e6;box-shadow:0 3px 0 #7c2a1b,0 8px 20px rgba(90,40,10,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #7c2a1b,0 4px 10px rgba(90,40,10,.3)}
.btn.ghost{background:rgba(250,240,218,.85);color:var(--ink);box-shadow:inset 0 0 0 2px rgba(122,90,63,.45)}
.btn.small{min-height:46px;min-width:96px;font-size:16px;padding:8px 20px}
.btn.on{filter:brightness(1.18);transform:translateY(2px) scale(.98)}
#ctrl .btn{touch-action:none;-webkit-touch-callout:none}
#c-hold{min-width:200px;min-height:58px}
.btn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.btn:focus-visible{outline:3px solid #fff3c4;outline-offset:3px}

#mute{position:fixed;top:calc(10px + var(--sat));right:10px;z-index:90;width:46px;height:46px;border-radius:50%;border:0;background:rgba(250,240,218,.88);box-shadow:0 2px 8px rgba(80,40,10,.25),inset 0 0 0 2px rgba(122,90,63,.35);cursor:pointer;display:grid;place-items:center}
#mute svg{width:24px;height:24px}
#mute .x{display:none}
#mute.off .x{display:inline}
#mute.off .w{display:none}

/* ---------- 开始页 ---------- */
#title .t-wrap{position:absolute;left:55%;top:5.5vh;transform:translateX(-50%);text-align:center;width:min(92vw,640px)}
.t-kicker{font-size:15px;letter-spacing:.42em;color:var(--ink2);margin-bottom:2px;padding-left:.42em}
.t-main{font-family:var(--title);font-weight:400;font-size:clamp(58px,8.4vw,112px);line-height:1.08;margin:0;color:#5a2d18;letter-spacing:.06em;
  text-shadow:0 0 18px rgba(255,240,205,.95),0 0 4px rgba(255,240,205,.9),2px 3px 0 rgba(185,67,44,.22)}
.t-sub{font-family:var(--hand);font-size:clamp(22px,2.5vw,28px);margin:6px 0 16px;color:var(--ink);text-shadow:0 0 10px rgba(255,242,210,.95)}
.t-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.t-note{font-size:13px;color:var(--ink2);margin-top:10px;text-shadow:0 0 6px rgba(255,242,210,.9)}
.t-credit{position:absolute;left:0;right:0;bottom:calc(10px + var(--sab));text-align:center;font-size:12px;color:rgba(255,246,226,.85);letter-spacing:.2em;text-shadow:0 1px 3px rgba(60,30,10,.6)}

/* ---------- 游戏 HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:calc(62px + var(--sat));padding:calc(10px + var(--sat)) 64px 0 16px;display:flex;align-items:center;gap:14px}
#hudDish{font-family:var(--title);font-size:26px;color:#fff4de;text-shadow:0 1px 4px rgba(60,25,10,.7);white-space:nowrap}
#hudDish small{font-family:var(--body);font-size:13px;letter-spacing:.2em;opacity:.85;margin-left:8px}
#hudStep{font-size:15px;color:#fff4de;text-shadow:0 1px 3px rgba(60,25,10,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageBox{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--sat));bottom:calc(92px + var(--sab));width:min(96vw,1120px);border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 4px rgba(250,238,210,.9),0 14px 40px rgba(60,25,8,.45);background:#efe4c8;touch-action:none}
#stage{width:100%;height:100%;touch-action:none}
#ctrl{position:absolute;left:0;right:0;bottom:calc(16px + var(--sab));height:62px;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 12px}
#hint:empty{display:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:10px;max-width:calc(100% - 24px);background:rgba(252,244,226,.92);border-radius:12px;padding:7px 14px;font-size:15px;line-height:1.5;color:var(--ink);box-shadow:0 2px 8px rgba(80,40,10,.18);pointer-events:none;text-align:center;transition:opacity .4s}
#bubble{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;max-width:calc(100% - 24px)}
#bubble.show{opacity:1;transform:none}
#bubble canvas{width:54px;height:54px;flex:none;border-radius:50%;box-shadow:0 2px 6px rgba(60,30,10,.3)}
#bubble .b-txt{background:#fff8e8;border-radius:16px 16px 16px 4px;padding:8px 14px;font-family:var(--hand);font-size:24px;line-height:1.25;color:#4a2f1f;box-shadow:0 2px 8px rgba(80,40,10,.22)}
#seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg) scale(.6);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.2,1.6,.4,1);text-align:center}
#seal.show{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
#seal .s-stamp{display:inline-block;font-family:var(--title);font-size:46px;line-height:1;color:#fff3e4;background:#b9432c;padding:12px 16px;border-radius:8px;box-shadow:inset 0 0 0 3px #f3d2bf,inset 0 0 0 6px #b9432c,0 4px 14px rgba(80,20,10,.35)}
#seal .s-txt{margin-top:12px;background:rgba(252,244,226,.95);border-radius:12px;padding:8px 14px;font-size:16px;max-width:min(80vw,420px);line-height:1.5;box-shadow:0 2px 10px rgba(80,40,10,.2)}

/* ---------- 对话框 ---------- */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:min(94vw,840px);min-height:128px;z-index:40;display:flex;gap:14px;align-items:flex-start;padding:16px 18px 30px;border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,#fbf3df,#f2e2bd);box-shadow:0 0 0 3px rgba(122,90,63,.25),0 12px 30px rgba(60,25,8,.35)}
#dialog::before{content:"";position:absolute;inset:6px;border-radius:13px;border:1.5px dashed rgba(122,90,63,.3);pointer-events:none}
#dialog .ava{width:76px;height:76px;flex:none;border-radius:50%;box-shadow:0 2px 8px rgba(60,30,10,.3)}
#dialog.nar .ava{display:none}
#dialog .d-body{flex:1;min-width:0}
#dialog .d-who{font-size:14px;letter-spacing:.3em;color:var(--red);font-weight:700;margin-bottom:4px}
#dialog .d-txt{font-family:var(--hand);font-size:clamp(23px,2.6vw,28px);line-height:1.45;color:#3e2617;min-height:2.9em;white-space:pre-wrap}
#dialog.nar .d-txt{font-family:var(--body);font-size:clamp(16px,1.9vw,19px);line-height:1.85;color:#4a2f1f}
#dialog.mix .d-txt{font-family:var(--body);font-size:clamp(16px,1.9vw,19px);line-height:1.85;color:#4a2f1f}
#dialog .d-next{position:absolute;right:18px;bottom:8px;font-size:13px;color:var(--ink2);letter-spacing:.15em;opacity:0;transition:opacity .3s}
#dialog.ready .d-next{opacity:1;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}

/* ---------- 菜名卡 ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:calc(60px + var(--sat)) 16px calc(16px + var(--sab))}
#card{pointer-events:none}
#card .c-in{text-align:center;color:#fff4de;text-shadow:0 2px 10px rgba(50,20,5,.6);animation:cardIn 2.6s ease both}
#card .c-no{font-size:16px;letter-spacing:.5em;padding-left:.5em}
#card .c-name{font-family:var(--title);font-size:clamp(64px,10vw,120px);line-height:1.1;margin:8px 0}
#card .c-era{font-family:var(--hand);font-size:28px}
@keyframes cardIn{0%{opacity:0;transform:translateY(14px)}18%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}

/* ---------- 菜谱本 ---------- */
#recipe{background:rgba(40,20,8,.28)}
.r-page{position:relative;width:min(92vw,560px);max-height:calc(100% - 80px);overflow:hidden;padding:30px 30px 26px 58px;color:#3b2a8a;
  background:
    radial-gradient(circle at 78% 72%,rgba(196,140,50,.32) 0 34px,rgba(196,140,50,.16) 35px 52px,transparent 54px),
    radial-gradient(ellipse 60px 40px at 18% 86%,rgba(186,128,40,.22),transparent 70%),
    radial-gradient(circle at 92% 14%,rgba(176,120,40,.18) 0 18px,transparent 20px),
    linear-gradient(90deg,transparent 40px,rgba(200,70,60,.45) 40px 41.5px,transparent 42px),
    repeating-linear-gradient(180deg,transparent 0 37px,rgba(80,110,160,.28) 37px 38px),
    linear-gradient(180deg,#f6ebcd,#efdcaf);
  background-position:0 0,0 0,0 0,0 0,0 22px,0 0;
  box-shadow:0 18px 40px rgba(40,20,5,.45),inset 0 0 40px rgba(150,100,40,.25);transform:rotate(-1.2deg);animation:pageIn .6s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(30px) rotate(-4deg)}to{opacity:1;transform:rotate(-1.2deg)}}
.r-page.tear-br{clip-path:polygon(0 0,100% 0,100% 74%,96% 77%,98% 81%,93% 85%,95% 89%,89% 92%,90% 96%,84% 100%,0 100%)}
.r-page.tear-tr{clip-path:polygon(0 0,70% 0,73% 3%,78% 2%,81% 6%,86% 5%,89% 10%,94% 9%,96% 14%,100% 16%,100% 100%,0 100%)}
.r-page.tear-bl{clip-path:polygon(0 0,100% 0,100% 100%,22% 100%,18% 96%,14% 98%,11% 93%,6% 94%,4% 89%,0 87%)}
.r-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--body);font-size:13px;color:#8a6a4a;letter-spacing:.2em;margin-bottom:2px}
.r-title{font-family:var(--hand);font-size:44px;line-height:1.1;color:#2e2470;margin:0 0 6px;letter-spacing:.05em}
.r-line{font-family:var(--hand);font-size:clamp(22px,3.3vw,27px);line-height:38px;min-height:38px;color:#33287e}
.r-line .del{text-decoration:line-through;text-decoration-thickness:2px;color:#6b62a3;opacity:.75}
.r-line .add{color:#b43a2a;font-size:.92em;position:relative;top:-6px;margin-left:2px}
.r-line .gap{color:transparent;background:radial-gradient(ellipse at center,rgba(150,95,30,.5),rgba(170,110,40,.28) 60%,transparent 75%);border-radius:40%;padding:0 6px;filter:blur(.4px)}
.r-note{font-family:var(--hand);font-size:22px;color:#8a4a2a;margin-top:12px;transform:rotate(-2deg);text-align:right}
.r-btns{margin-top:18px;display:flex;justify-content:center}
.r-tip{font-size:13px;color:#fff3dc;margin-top:10px;text-shadow:0 1px 3px rgba(40,20,5,.7);text-align:center}

/* ---------- 闪回 ---------- */
#flash{background:radial-gradient(ellipse at 50% 40%,#5a4330,#2a1c12 75%);color:#f4e6cc;overflow:hidden}
#flash .f-head{position:absolute;left:0;right:0;top:calc(18px + var(--sat));text-align:center;font-family:var(--hand);font-size:clamp(22px,3vw,30px);color:#f1d9a8;letter-spacing:.1em;padding:0 60px}
#flash .f-stack{position:absolute;left:50%;top:calc(66px + var(--sat));transform:translateX(-50%)}
#flash .photo{position:absolute;left:0;top:0;background:#f2ecdf;padding:10px 10px 36px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s}
#flash .photo canvas{display:block}
#flash .photo .p-cap{position:absolute;left:12px;right:12px;bottom:6px;font-family:var(--hand);font-size:20px;color:#6a5640;text-align:right}
#flash .photo.old{filter:brightness(.7) sepia(.3)}
#flash .f-txt{position:absolute;left:50%;transform:translateX(-50%);width:min(90vw,640px);font-size:clamp(16px,2vw,19px);line-height:1.85;text-align:center;color:#f6ead2;min-height:3.7em}
#flash .f-next{position:absolute;left:0;right:0;bottom:calc(18px + var(--sab));display:flex;justify-content:center}
#flash .f-dots{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:8px}
#flash .f-dots i{width:9px;height:9px;border-radius:50%;background:rgba(241,217,168,.25)}
#flash .f-dots i.on{background:#f1d9a8}
#flash .f-dots i.lost{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(241,217,168,.3)}

/* ---------- 结局 ---------- */
#ending{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:rgba(236,216,174,.55)}
.e-wrap{width:min(94vw,860px);margin:0 auto;padding:calc(70px + var(--sat)) 0 calc(40px + var(--sab))}
.e-book{background:linear-gradient(180deg,#fbf3df,#f1e0ba);border-radius:6px 18px 18px 6px;padding:30px clamp(18px,4vw,46px);box-shadow:0 16px 40px rgba(60,25,8,.35),inset 8px 0 0 rgba(150,100,50,.15)}
.e-kicker{font-size:14px;letter-spacing:.4em;color:var(--ink2)}
.e-title{font-family:var(--title);font-size:clamp(40px,6vw,64px);font-weight:400;margin:6px 0 4px;color:#5a2d18}
.e-sub{font-family:var(--hand);font-size:24px;color:var(--red);margin:0 0 18px}
.e-mem{list-style:none;padding:0;margin:0 0 18px}
.e-mem li{display:flex;gap:14px;padding:12px 0;border-bottom:1.5px dashed rgba(122,90,63,.3);align-items:baseline}
.e-mem .m-era{flex:none;width:5.6em;font-size:13px;color:var(--ink2);letter-spacing:.1em}
.e-mem .m-dish{font-weight:700;font-size:15px;margin-right:6px}
.e-mem .m-txt{font-family:var(--hand);font-size:24px;line-height:1.35;color:#3e2617}
.e-mem li.poor .m-txt{color:#9a8268}
.e-mem .m-dots{font-size:12px;color:var(--ink3);margin-left:6px;letter-spacing:.2em;white-space:nowrap}
.e-close p{font-size:clamp(16px,2vw,18px);line-height:1.95;margin:0 0 4px}
.e-close .last{font-family:var(--hand);font-size:26px;color:#5a2d18;margin-top:10px}
.e-shots{margin-top:26px;background:#2f2219;color:#f2e4c8;border-radius:16px;padding:22px clamp(14px,3vw,30px)}
.e-shots h3{font-family:var(--title);font-weight:400;font-size:30px;margin:0;color:#f6d79a}
.e-tag{display:inline-block;margin:8px 0 14px;font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(246,215,154,.16);color:#f6d79a;letter-spacing:.08em}
.e-shot{display:grid;grid-template-columns:2.2em 4.6em 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid rgba(242,228,200,.14);font-size:15px;line-height:1.6}
.e-shot .n{color:#f6d79a;font-weight:700}
.e-shot .s{color:#f6d79a}
.e-shot .snd{grid-column:3;color:#c9b694;font-size:13.5px}
.e-shot .snd::before{content:"声｜";color:#8f7c60}
.e-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.e-upload{margin-top:22px;border-radius:16px;padding:20px clamp(16px,3vw,28px);background:repeating-linear-gradient(135deg,#f8eed6 0 14px,#f3e5c4 14px 28px);box-shadow:inset 0 0 0 2px rgba(185,67,44,.35);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.e-upload .u-ic{width:64px;height:64px;flex:none}
.e-upload .u-body{flex:1;min-width:220px}
.e-upload h4{margin:0 0 4px;font-size:19px}
.e-upload p{margin:0;font-size:14px;line-height:1.7;color:var(--ink2)}
.e-upload .soon{font-size:12px;letter-spacing:.2em;color:#fff;background:var(--red);border-radius:6px;padding:3px 8px;margin-left:6px;vertical-align:2px}
.e-foot{text-align:center;font-size:12.5px;color:var(--ink2);margin-top:18px;letter-spacing:.1em}

/* ---------- 手机竖屏 ---------- */
@media (max-aspect-ratio:21/20){
  #title .t-wrap{left:50%;top:27vh}
  #hud{padding-left:12px;gap:8px;flex-wrap:wrap;align-content:center;row-gap:0}
  #hudDish{font-size:22px}
  #hudStep{font-size:13.5px;width:100%}
  #stageBox{width:100%;border-radius:0;box-shadow:0 0 0 0 transparent,0 10px 30px rgba(60,25,8,.35);top:calc(70px + var(--sat));bottom:calc(84px + var(--sab))}
  #ctrl{bottom:calc(12px + var(--sab))}
  #bubble canvas{width:46px;height:46px}
  #bubble .b-txt{font-size:21px}
  #hint{font-size:13.5px;top:8px}
  #dialog{padding:12px 14px 28px;gap:10px;min-height:118px}
  #dialog .ava{width:58px;height:58px}
  .r-page{padding:24px 18px 20px 48px}
  .r-page{background-position:0 0,0 0,0 0,-8px 0,0 22px,0 0}
  .r-title{font-size:38px}
  .e-shot{grid-template-columns:1.8em 4.2em 1fr;font-size:14px}
  .e-mem li{flex-direction:column;gap:2px}
  #flash .f-head{font-size:20px;letter-spacing:0;padding:0 58px;top:calc(22px + var(--sat))}
  .e-mem .m-era{width:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<button id="mute" aria-label="静音开关" title="声音">
  <svg viewBox="0 0 24 24" fill="none" stroke="#5a3a24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f0c98a"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<section id="title" class="screen on" aria-label="开始">
  <div class="t-wrap">
    <div class="t-kicker">第一章 · 礼拜六的厨房</div>
    <h1 class="t-main">外婆的菜谱</h1>
    <p class="t-sub">味道，是最后才会忘记的记忆。</p>
    <div class="t-btns">
      <button id="btnStart" class="btn main">回外婆家</button>
      <button id="btnRestart" class="btn ghost hidden">从头做起</button>
    </div>
    <p class="t-note" id="tNote">五道家常菜 · 约十分钟 · 建议戴耳机</p>
  </div>
  <div class="t-credit">一个关于阿尔茨海默与味道的小故事</div>
</section>

<section id="play" class="screen" aria-label="厨房">
  <header id="hud"><div id="hudDish"></div><div id="hudStep"></div></header>
  <div id="stageBox">
    <canvas id="stage"></canvas>
    <div id="hint"></div>
    <div id="bubble"><canvas class="ava" width="108" height="108"></canvas><div class="b-txt"></div></div>
    <div id="seal"><div class="s-stamp"></div><div class="s-txt"></div></div>
  </div>

function drawSteam(c, x, y, s, t, alpha) {
  c.save(); c.lineCap = 'round';
  for (var k = 0; k < 3; k++) {
    var ph = k * 2.1, hgt = s * (1.6 + k * 0.25);
    for (var layer = 0; layer < 2; layer++) {
      c.beginPath();
      for (var i = 0; i <= 16; i++) {
        var p = i / 16, yy = y - p * hgt;
        var xx = x + (k - 1) * s * 0.22 + Math.sin(p * 5 + t * 1.3 + ph) * s * 0.16 * (0.3 + p) + Math.sin(t * 0.7 + ph) * s * 0.05;
        i ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
      }
      var cyc = ((t * 0.25 + k * 0.33) % 1);
      c.strokeStyle = 'rgba(255,255,250,' + (alpha * (layer ? 0.16 : 0.08) * (0.6 + 0.4 * Math.sin(cyc * Math.PI))) + ')';
      c.lineWidth = s * (layer ? 0.09 : 0.22);
      c.stroke();
    }
  }
  c.restore();
}

  for (var j = 0; j < DUST.length; j++) {
    var d = DUST[j];
    var u = (d.u + tt * 0.004 * d.sp) % 1, v = (d.v + tt * 0.01 * d.sp + Math.sin(tt * 0.3 + d.ph) * 0.01) % 1;
    var top = [lerp(b[0][0], b[1][0], u), lerp(b[0][1], b[1][1], u)], bot = [lerp(b[3][0], b[2][0], u), lerp(b[3][1], b[2][1], u)];
    var x = lerp(top[0], bot[0], v), y = lerp(top[1], bot[1], v);

    c.fillStyle = 'rgba(255,246,210,' + (a * (1 - v * 0.7)).toFixed(3) + ')';
    c.beginPath(); c.arc(x, y, d.s, 0, TAU); c.fill();

      window.addEventListener('keydown', function (e) { if (cur && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); } });
    },
    say: function (kind, text, mood) {
      return new Promise(function (res) {
        D.classList.remove('hidden', 'ready', 'nar', 'mix');
        if (kind === 'nar') D.classList.add('nar');
        if (kind === 'mix') D.classList.add('mix');
        who.textContent = kind === 'nar' ? '' : '外婆';
        if (kind !== 'nar') drawGrandma(ava, mood || (/……/.test(text) ? 'think' : 'smile'));
        var times = [], acc = 0, base = kind === 'granny' ? 0.07 : 0.045;
        for (var i = 0; i < text.length; i++) { var ch = text.charAt(i); acc += base + (ch === '…' ? 0.18 : '，、'.indexOf(ch) >= 0 ? 0.12 : '。？！”'.indexOf(ch) >= 0 ? 0.22 : ch === '—' ? 0.12 : 0); times.push(acc); }
        cur = { text: text, done: false, res: res };
        var my = cur, t0 = performance.now();
        txt.textContent = '';
        if (REDUCED) { finishTyping(); return; }
        (function frame() {
          if (cur !== my || my.done) return;
          var el = (performance.now() - t0) / 1000, n = 0;
          while (n < times.length && times[n] <= el) n++;
          txt.textContent = text.slice(0, n);
          if (n >= text.length) finishTyping(); else requestAnimationFrame(frame);
        })();
        setTimeout(function () { if (cur === my && !my.done && (performance.now() - t0) / 1000 > acc + 0.2) finishTyping(); }, (acc + 0.5) * 1000);
      });
    },
    hide: function () { D.classList.add('hidden'); }
  };
})();

function dishCard(d, i) {
  var C = $('#card'), nums = ['第一道', '第二道', '第三道', '第四道', '第五道'];
  C.querySelector('.c-no').textContent = nums[i];
  C.querySelector('.c-name').textContent = d.name;
  C.querySelector('.c-era').textContent = '外婆的' + d.decade.replace('s', ' 年代');
  var inner = C.querySelector('.c-in'); inner.style.animation = 'none'; void inner.offsetWidth; inner.style.animation = '';
  C.classList.remove('hidden');
  return wait(2500).then(function () { C.classList.add('hidden'); });
}
function showRecipe(d) {
  return new Promise(function (res) {
    var O = $('#recipe'), pg = O.querySelector('.r-page');
    pg.className = 'r-page tear-' + d.recipe.tear;
    O.querySelector('.r-title').textContent = d.name;
    O.querySelector('.r-pg').textContent = '第 ' + d.recipe.page + ' 页';
    var box = O.querySelector('.r-lines'); box.innerHTML = '';
    d.recipe.lines.forEach(function (ln) {
      var div = document.createElement('div'); div.className = 'r-line';
      GameLogic.parseRecipeLine(ln).forEach(function (seg) { var sp = document.createElement('span'); if (seg.k !== 'txt') sp.className = seg.k; sp.textContent = seg.k === 'gap' ? (seg.t || '　　') : seg.t; div.appendChild(sp); });
      box.appendChild(div);
    });
    O.querySelector('.r-note').textContent = '—— ' + d.recipe.note;
    O.classList.remove('hidden'); AudioFX.page();
    var b = $('#rGo');
    var h = function () { b.removeEventListener('click', h); O.classList.add('hidden'); AudioFX.page(); res(); };
    b.addEventListener('click', h);
  });
}
function showSeal(tier, text) {
  var S = $('#seal');
  S.querySelector('.s-stamp').textContent = GameLogic.TIER_SEAL[tier];
  S.querySelector('.s-txt').textContent = text;
  S.classList.add('show');
  if (tier === 'good') AudioFX.ding();
  return wait(2000).then(function () { S.classList.remove('show'); });
}

async function runStep(d, i, k) {
  var step = d.steps[k];
  $('#hudStep').textContent = '第 ' + (k + 1) + ' / ' + d.steps.length + ' 步 · ' + step.title;
  ctrlButtons([]); setHint(step.hint);
  var q = await GAMES[step.type](step);
  AudioFX.heat(0, false); AudioFX.pour(false);
  ctrlButtons([]); setHint('');
  q = GameLogic.clamp01(q);
  await showSeal(GameLogic.tierOf(q), step.fb[GameLogic.tierOf(q)]);
  return q;
}
function showFinalDish(d, q) {
  var bg = null, W = 1, H = 1;
  Stage.run({
    layout: function (w, h) { W = w; H = h; bg = offscreen(w, h, function (c) { drawOilcloth(c, w, h); }); },
    draw: function (c, t) { c.drawImage(bg, 0, 0, W, H); drawFinalDish(c, d.final, W / 2, H * 0.36, Math.min(W * 0.34, H * 0.3, 210), q, t); }
  });
}

async function playDish(i) {
  var d = GameLogic.DISHES[i];
  Session.balls = [];
  document.body.classList.remove('dim'); showScreen(null);
  await dishCard(d, i);
  for (var k = 0; k < d.intro.length; k++) await Dialog.say('granny', d.intro[k]);
  Dialog.hide();
  document.body.classList.add('dim');
  await showRecipe(d);
  showScreen('play');
  $('#hudDish').innerHTML = '';
  $('#hudDish').appendChild(document.createTextNode(d.name));
  var sm = document.createElement('small'); sm.textContent = d.era; $('#hudDish').appendChild(sm);
  var qs = [];
  for (var s = 0; s < d.steps.length; s++) qs.push(await runStep(d, i, s));
  var q = GameLogic.dishQuality(qs), tier = GameLogic.tierOf(q);
  $('#hudStep').textContent = '外婆尝一口';
  showFinalDish(d, q);
  await wait(700);
  await Dialog.say('mix', d.taste[tier], tier === 'good' ? 'happy' : tier === 'fair' ? 'smile' : 'blank');
  Dialog.hide();
  await flashback(d, tier);
  Stage.stop();
  return { q: Math.round(q * 1000) / 1000, tier: tier };
}

/* ---------- 记忆闪回 ---------- */
function flashback(d, tier) {
  return new Promise(function (res) {
    var F = $('#flash'), stack = F.querySelector('.f-stack'), txt = F.querySelector('.f-txt'), dots = F.querySelector('.f-dots'), btn = $('#fNext');
    showScreen('flash'); AudioFX.music(true);
    F.querySelector('.f-head').textContent = d.flash.title;
    var panels = GameLogic.panelsFor(d, tier), total = d.flash.panels.length;
    stack.innerHTML = ''; dots.innerHTML = '';
    for (var k = 0; k < total; k++) { var i = document.createElement('i'); if (k >= panels.length) i.className = 'lost'; dots.appendChild(i); }
    var vw = window.innerWidth, vh = window.innerHeight, port = vw < vh * 1.05;
    var pw = Math.round(Math.min(vw - 52, 640, (vh - (port ? 330 : 280)) * 1.5)), ph = Math.round(pw / 1.5);
    stack.style.width = (pw + 20) + 'px'; stack.style.height = (ph + 46) + 'px';
    var top = stack.getBoundingClientRect().top;
    txt.style.top = (top + ph + 46 + 40) + 'px'; dots.style.top = (top + ph + 46 + 18) + 'px';
    txt.textContent = '';
    var idx = 0, dpr = Math.min(2, window.devicePixelRatio || 1), photos = [];
    function typeLine(s) {
      var t0 = performance.now(), my = {}; typeLine.cur = my;
      if (REDUCED) { txt.textContent = s; return; }
      (function f() { if (typeLine.cur !== my) return; var n = Math.floor((performance.now() - t0) / 55); txt.textContent = s.slice(0, n); if (n < s.length) requestAnimationFrame(f); })();
      setTimeout(function () { if (typeLine.cur === my) { typeLine.cur = null; txt.textContent = s; } }, s.length * 55 + 300);
    }
    function showPanel() {
      var p = panels[idx];
      photos.forEach(function (ph0, j) { ph0.classList.add('old'); ph0.style.transform = 'translate(' + (-14 - (photos.length - j) * 6) + 'px,' + (-8 - (photos.length - j) * 4) + 'px) rotate(' + (-6 + j * 2) + 'deg) scale(.97)'; });
      var el = document.createElement('div'); el.className = 'photo';
      var cv = document.createElement('canvas'); cv.width = Math.round(pw * dpr); cv.height = Math.round(ph * dpr); cv.style.width = pw + 'px'; cv.style.height = ph + 'px';
      el.appendChild(cv);
      var cap = document.createElement('div'); cap.className = 'p-cap'; cap.textContent = d.era + (p.faded ? ' · 记不清了' : ''); el.appendChild(cap);
      var rot = (idx % 2 ? 1.6 : -1.2);
      el.style.opacity = '0'; el.style.transform = 'translateY(40px) rotate(' + (rot + 5) + 'deg)';
      stack.appendChild(el); photos.push(el);
      try { renderPanel(cv, p.scene, p.faded); } catch (e) {}
      void el.offsetWidth; setTimeout(function () { el.style.opacity = p.faded ? '0.82' : '1'; el.style.transform = 'rotate(' + rot + 'deg)'; }, 30);
      dots.children[idx].className = 'on';
      typeLine(p.text + (p.faded ? '\n（其余的，她没有想起来。）' : ''));
      btn.textContent = idx < panels.length - 1 ? '下一格' : '回到厨房';
      AudioFX.page();
    }
    var h = function () {
      if (typeLine.cur) { typeLine.cur = null; var p = panels[idx]; txt.textContent = p.text + (p.faded ? '\n（其余的，她没有想起来。）' : ''); return; }
      idx++;
      if (idx < panels.length) { showPanel(); return; }
      btn.removeEventListener('click', h); AudioFX.music(false); res();
    };
    btn.addEventListener('click', h);
    setTimeout(showPanel, 200);
  });
}

/* ---------- 结局 ---------- */
function showEnding() {
  var E = GameLogic.buildEnding(state.results);
  showScreen('ending'); document.body.classList.add('dim');
  $('#eSub').textContent = E.title + ' · 唤回 ' + E.recalled + ' / ' + E.total + ' 格记忆';
  var ul = $('#eMem'); ul.innerHTML = '';
  E.memories.forEach(function (m) {
    var li = document.createElement('li'); li.className = m.tier;
    var era = document.createElement('span'); era.className = 'm-era'; era.textContent = m.era + ' · ' + m.decade;
    var body = document.createElement('div');
    var dn = document.createElement('span'); dn.className = 'm-dish'; dn.textContent = m.dish;
    var dots = document.createElement('span'); dots.className = 'm-dots'; dots.textContent = '●'.repeat(m.panels) + '○'.repeat(4 - m.panels);
    var tx = document.createElement('div'); tx.className = 'm-txt'; tx.textContent = m.text;
    body.appendChild(dn); body.appendChild(dots); body.appendChild(tx);
    li.appendChild(era); li.appendChild(body); ul.appendChild(li);
  });
  var cl = $('#eClose'); cl.innerHTML = '';
  E.closing.forEach(function (s) { var p = document.createElement('p'); p.textContent = s; cl.appendChild(p); });
  var last = document.createElement('p'); last.className = 'last'; last.textContent = '你把今天写进了菜谱本最后一页的空白处。'; cl.appendChild(last);
  var sh = $('#eShots'); sh.innerHTML = '';
  E.shots.forEach(function (s) {
    var row = document.createElement('div'); row.className = 'e-shot';
    [['n', ('0' + s.no).slice(-2)], ['s', s.size], ['f', s.frame], ['snd', s.sound]].forEach(function (c) { var el = document.createElement('div'); el.className = c[0]; el.textContent = c[1]; row.appendChild(el); });
    sh.appendChild(row);
  });
  $('#eCopy').onclick = function () {
    var text = GameLogic.shotListText(E), b = this, okf = function () { b.textContent = '已复制'; setTimeout(function () { b.textContent = '复制分镜单'; }, 1600); };
    try { navigator.clipboard.writeText(text).then(okf, function () { fallbackCopy(text); okf(); }); } catch (e) { fallbackCopy(text); okf(); }
  };
  $('#ending').scrollTop = 0;
  AudioFX.music(true); setTimeout(function () { AudioFX.music(false); }, 20000);
}
function fallbackCopy(text) { try { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } catch (e) {} }

/* ---------- 开始 ---------- */
var running = false;
async function startGame(fresh) {
  if (running) return; running = true;
  AudioFX.unlock();
  if (fresh || state.dish >= 5) { state = { dish: 0, results: [] }; saveState(); }
  showScreen(null);
  if (state.dish === 0) {
    for (var k = 0; k < GameLogic.PROLOGUE.length; k++) { var l = GameLogic.PROLOGUE[k]; await Dialog.say(l.who, l.text, l.mood); }
  }
  for (var i = state.dish; i < GameLogic.DISHES.length; i++) {
    var r = await playDish(i);
    state.results[i] = r; state.dish = i + 1; saveState();
  }
  Dialog.hide(); running = false;
  showEnding();
}
function refreshTitle() {
  var s = loadState(), b = $('#btnStart'), rb = $('#btnRestart'), note = $('#tNote');
  if (s) state = s;
  if (s && s.dish > 0 && s.dish < 5) { b.textContent = '接着做（第 ' + (s.dish + 1) + ' 道）'; rb.classList.remove('hidden'); note.textContent = '上回做到了' + GameLogic.DISHES[s.dish - 1].name + '。'; }
  else if (s && s.dish >= 5) { b.textContent = '再回一趟外婆家'; rb.classList.add('hidden'); var e = GameLogic.buildEnding(s.results); note.textContent = '上回，她记住了 ' + e.recalled + ' 格往事。'; }
  else { b.textContent = '回外婆家'; rb.classList.add('hidden'); }
}

/* ---------- 背景与动态层 ---------- */
var BG = { L: null };
function drawBG() {
  var cv = $('#bg'), c = cv.getContext('2d'), d = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d); c.setTransform(d, 0, 0, d, 0, 0);
  BG.L = drawKitchen(c, W, H); BG.W = W; BG.H = H;
  applyTooth(c, cv.width, cv.height, 0.32);
  var fx = $('#fx'); fx.width = Math.round(W * d); fx.height = Math.round(H * d);
}
function fxLoop(now) {
  requestAnimationFrame(fxLoop);
  var fx = $('#fx'), c = fx.getContext('2d'), d = fx.width / Math.max(1, window.innerWidth);
  if (BG.W !== window.innerWidth || BG.H !== window.innerHeight) drawBG();
  if ($('#flash').classList.contains('on') || $('#ending').classList.contains('on')) return;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, fx.width, fx.height); c.setTransform(d, 0, 0, d, 0, 0);
  drawFX(c, BG.L, now / 1000);
}

/* ---------- 调试入口（截图/联调用） ---------- */
var GrandmaDebug = {
  step: function (di, si) { var d = GameLogic.DISHES[di]; showScreen('play'); document.body.classList.add('dim'); $('#hudDish').textContent = d.name; return runStep(d, di, si); },
  flash: function (di, tier) { return flashback(GameLogic.DISHES[di], tier); },
  ending: function (tiers) { state.results = tiers.map(function (t) { return { q: t === 'good' ? 0.9 : t === 'fair' ? 0.6 : 0.2, tier: t }; }); state.dish = 5; showEnding(); },
  final: function (di) { var d = GameLogic.DISHES[di]; showScreen('play'); document.body.classList.add('dim'); showFinalDish(d, 0.9); return Dialog.say('mix', d.taste.good, 'happy'); },
  say: function (who, t) { return Dialog.say(who, t); },
  recipe: function (di) { document.body.classList.add('dim'); return showRecipe(GameLogic.DISHES[di]); }
};
window.GrandmaDebug = GrandmaDebug;

(function boot() {
  hintEl = $('#hint'); bubbleEl = $('#bubble'); ctrlEl = $('#ctrl');
  try { $('#grain').style.backgroundImage = 'url(' + makePaperURL() + ')'; } catch (e) {}
  drawBG();
  var rt = 0; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawBG, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawBG(); lastMood = ''; });
  requestAnimationFrame(fxLoop);
  Stage.init(); Dialog.init();
  refreshTitle();
  var mb = $('#mute'); mb.classList.toggle('off', AudioFX.muted);
  mb.addEventListener('click', function () { AudioFX.unlock(); AudioFX.setMuted(!AudioFX.muted); mb.classList.toggle('off', AudioFX.muted); });
  $('#btnStart').addEventListener('click', function () { startGame(false); });
  $('#btnRestart').addEventListener('click', function () { startGame(true); });
  $('#eAgain').addEventListener('click', function () { AudioFX.music(false); state = { dish: 0, results: [] }; saveState(); document.body.classList.remove('dim'); refreshTitle(); showScreen('title'); });
  document.addEventListener('pointerdown', function () { AudioFX.unlock(); }, { once: true });
})();
</script>
